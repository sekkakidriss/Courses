lesson({
  id: 'quantity-theory', title: 'The Quantity Theory of Money', dur: '1:34', tags: 'mv=py velocity money neutrality',
  hook: `Here's one of the oldest equations in economics, and it fits on a sticky note: <b>MV = PY</b>. It explains why printing lots of money usually ends in inflation.`,
  body: () => `
  <div class="formula" style="font-size:1.2rem;text-align:center"><b>M × V = P × Y</b></div>
  <div class="cards">
    <div class="card"><h4>M</h4><p>Money supply</p></div><div class="card"><h4>V</h4><p>Velocity: how many times each unit of money is spent per year</p></div>
    <div class="card"><h4>P</h4><p>Price level</p></div><div class="card"><h4>Y</h4><p>Real output</p></div>
  </div>
  <p>The equation is an identity: total spending (MV) equals the value of what's bought (PY). It becomes a <b>theory</b> once we assume velocity is stable and output is set by real factors in the long run. Then any growth in M shows up as growth in P. This is the idea of <b>money neutrality</b>.</p>
  ${W('q')}`,
  widgets: {
    q(el) {
      el.innerHTML = lab('Balance the equation', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('m', 'Money supply growth', 0, 30, .5, 8)}${slider('v', 'Velocity growth', -5, 5, .5, 0)}${slider('y', 'Real output growth', -2, 6, .5, 2)}
        <div class="readout">${ro('Implied inflation', 'pi')}</div><div class="verdict" id="v"></div></div></div>`);
      const draw = () => {
        const m = val(el, 'm'), v = val(el, 'v'), y = val(el, 'y'); setO(el, 'm', pct(m)); setO(el, 'v', pct(v)); setO(el, 'y', pct(y));
        const pi = m + v - y;
        const sc = 9, mid = 220;
        const bar = (yy, v, cl, n) => `<text class="dg-t" x="10" y="${yy + 19}">${n}</text><rect x="${v >= 0 ? mid : mid + v * sc}" y="${yy}" width="${Math.abs(v) * sc}" height="26" class="${cl}" rx="3"/><text class="lab-t" x="${v >= 0 ? mid + v * sc + 6 : mid + v * sc - 6}" y="${yy + 18}" text-anchor="${v >= 0 ? 'start' : 'end'}">${fmt(v, 1)}%</text>`;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 560 200" role="img" aria-label="Quantity theory"><line x1="${mid}" x2="${mid}" y1="5" y2="190" class="ax"/>
          ${bar(10, m, 'fs-s', '%ΔM')}${bar(50, v, 'fmu-s', '%ΔV')}${bar(95, y, 'fm-s', '%ΔY (real)')}${bar(140, pi, 'fc-s', '%ΔP (inflation)')}</svg></div>`;
        setT(el, 'pi', pct(pi));
        $('#v', el).innerHTML = `%ΔM + %ΔV = %ΔP + %ΔY, so inflation ≈ ${fmt(m, 1)} + ${fmt(v, 1)} − ${fmt(y, 1)} = <b>${pct(pi)}</b>.`;
        goal(el, 'Hit exactly 2% inflation while the money supply grows 6%.', m === 6 && Math.abs(pi - 2) < .01);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'If velocity is constant, real output grows 3% and the money supply grows 7%, the quantity theory predicts inflation of about…', o: ['10%', '7%', '4%', '3%'], a: 2, why: '%ΔP ≈ %ΔM + %ΔV − %ΔY = 7 + 0 − 3 = 4%.' }],
  take: ['MV = PY is an identity; with stable V and real Y it becomes a theory of inflation.', 'In the long run, money growth beyond real output growth shows up as inflation.']
});

lesson({
  id: 'money-demand-supply', title: 'Theories of Money Demand and Supply', dur: '4:47', tags: 'transaction precautionary speculative motive money market equilibrium interest rate',
  hook: `Why hold money at all, when bonds pay interest? Because money is useful, and holding it costs you the interest you give up. That trade-off sets the interest rate.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-acc">T</div><h4>Transactions demand</h4><p>Money to pay for everyday purchases. Rises with nominal GDP.</p></div>
    <div class="card"><div class="ic c-sun">P</div><h4>Precautionary demand</h4><p>A buffer for unexpected needs. Also rises with income.</p></div>
    <div class="card"><div class="ic c-plu">S</div><h4>Speculative (portfolio) demand</h4><p>Holding money instead of bonds and other assets. <b>Falls</b> as interest rates rise, because holding money costs more in forgone interest. It rises when other assets look risky.</p></div>
  </div>
  ${W('mm')}
  <h3>How the market gets back to equilibrium</h3>
  <p>If the interest rate is <b>above</b> equilibrium, people hold more money than they want, so they buy bonds. Bond prices rise and yields fall, back to equilibrium. Below equilibrium, they sell bonds, bond prices fall and rates rise.</p>`,
  widgets: {
    mm(el) {
      el.innerHTML = lab('The money market', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('ms', 'Money supply (set by central bank)', 3, 9, .1, 6)}${slider('y', 'Nominal income (shifts money demand)', -2, 2, .1, 0)}
        <div class="readout">${ro('Equilibrium interest rate', 'r')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> raise the money supply: the interest rate falls. Then raise income: money demand shifts right and the rate rises.</p>`);
      const draw = () => {
        const ms = val(el, 'ms'), y = val(el, 'y'); setO(el, 'ms', fmt(ms, 1)); setO(el, 'y', (y > 0 ? '+' : '') + fmt(y, 1));
        const md = q => 10.5 + y * 1.2 - 1.2 * q;
        const r = md(ms);
        const c = chart({ x: [0, 12], y: [0, 12], xl: 'Quantity of money', yl: 'Interest rate (%)', yt: [0, 2, 4, 6, 8, 10], grid: true, label: 'Money market' });
        if (y) c.fn(q => 10.5 - 1.2 * q, 'ghost', 0, 12);
        c.fn(md, 'l1', 0, 12).text(Math.min(11.5, (10.5 + y * 1.2 - .8) / 1.2), .8, 'Md', 'a', 6, 0);
        c.vline(ms, 'l4', 0, 11.5).text(ms, 11.5, 'Ms', 's', 6, 6);
        c.guide(ms, r).dot(ms, r, 's', 7);
        $('#p', el).innerHTML = c.html();
        setT(el, 'r', pct(Math.max(0, r)));
        $('#v', el).innerHTML = `Money supply is vertical because the central bank sets it. Money demand slopes down because a higher rate makes holding money costlier. They meet at <b>${pct(Math.max(0, r))}</b>.`;
        goal(el, 'Push the interest rate below 2% using the money supply alone (keep income at zero).', y === 0 && r < 2);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'If the interest rate is above equilibrium in the money market, people will…', o: ['Sell bonds, pushing rates higher', 'Buy bonds, pushing bond prices up and rates down', 'Demand more money', 'Ask the central bank to print money'], a: 1, why: 'There is excess money supply. People use the excess to buy bonds; higher bond prices mean lower yields, moving rates down to equilibrium.' }],
  take: ['Money demand: transactions, precautionary and speculative motives.', 'Money demand falls as interest rates rise; money supply is set by the central bank.', 'Bond buying and selling moves the interest rate back to equilibrium.']
});

lesson({
  id: 'fisher-effect', title: 'The Fisher Effect', dur: '2:32', tags: 'nominal interest rate real rate expected inflation risk premium',
  hook: `If a bank pays you 5% while prices rise 3%, you're only 2% better off. Lenders know this, so they build expected inflation into the interest rates they charge.`,
  body: () => `
  <div class="formula"><span class="lbl">Fisher effect</span><b>Nominal rate = Real rate + Expected inflation</b> &nbsp;&nbsp;&nbsp; (i ≈ r + π<sup>e</sup>)</div>
  <p>Fisher argued the real rate is fairly stable, so <b>changes in expected inflation pass one-for-one into nominal rates</b>. That's money neutrality applied to interest rates.</p>
  <p>Investors also want compensation for <b>uncertainty</b> about inflation and other risks, so in practice:</p>
  <div class="formula">Nominal rate = Real rate + Expected inflation + Risk premium(s)</div>
  ${W('f')}`,
  widgets: {
    f(el) {
      el.innerHTML = lab('Build a nominal interest rate', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('r', 'Real rate', 0, 5, .25, 2)}${slider('pi', 'Expected inflation', 0, 12, .25, 2.5)}${slider('rp', 'Risk premium', 0, 4, .25, .5)}
        <div class="readout">${ro('Nominal rate', 'n')}</div></div></div>`);
      const draw = () => {
        const r = val(el, 'r'), pi = val(el, 'pi'), rp = val(el, 'rp'); setO(el, 'r', pct(r, 2)); setO(el, 'pi', pct(pi, 2)); setO(el, 'rp', pct(rp, 2));
        const sc = 22, t = r + pi + rp;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 560 120" role="img" aria-label="Fisher decomposition">
          <rect x="20" y="30" width="${r * sc}" height="40" class="fm-s" rx="3"/><rect x="${20 + r * sc}" y="30" width="${pi * sc}" height="40" class="fs-s"/><rect x="${20 + (r + pi) * sc}" y="30" width="${rp * sc}" height="40" class="fp-s"/>
          <text class="lab-t" x="${24 + t * sc}" y="56">${pct(t, 2)} nominal</text><text class="dg-s" x="20" y="100">green = real rate · yellow = expected inflation · purple = risk premium</text></svg></div>`;
        setT(el, 'n', pct(t, 2));
        goal(el, 'Build a 9% nominal rate with a real rate of 2% or less.', t >= 9 && r <= 2);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'The real interest rate is 2% and expected inflation rises from 2% to 5%. According to the Fisher effect, the nominal rate…', o: ['Stays at 4%', 'Rises from 4% to 7%', 'Falls to 3%', 'Rises to 10%'], a: 1, why: 'Nominal = real + expected inflation: 2 + 2 = 4% becomes 2 + 5 = 7%.' }],
  take: ['Nominal rate ≈ real rate + expected inflation (+ risk premium).', 'Changes in expected inflation pass through to nominal rates.']
});

lesson({
  id: 'central-bank-roles', title: 'Roles and Objectives of Central Banks', dur: '5:22', tags: 'lender of last resort monopoly supplier banker to government price stability dual mandate',
  hook: `A central bank wears many hats. It prints the currency, banks for the government, rescues banks in a panic, and above all tries to keep prices stable.`,
  body: () => `
  <h2>Roles (tap each)</h2>
  <div class="cards">
    ${[['Monopoly supplier of currency', 'Only the central bank issues notes and coins. Today currency is fiat money: backed by trust, not gold.'],
       ['Banker to the government', 'Holds the government\'s accounts and helps manage its borrowing.'],
       ['Bankers\' bank', 'Commercial banks keep reserves with it and settle payments between each other through it.'],
       ['Lender of last resort', 'Lends to solvent banks facing a run, so a panic doesn\'t become a collapse of the banking system.'],
       ['Regulator and supervisor', 'Often oversees banks to keep the payments and financial system safe.'],
       ['Payment system overseer', 'Keeps the plumbing of payments working smoothly.'],
       ['Manager of FX reserves', 'Holds and manages the country\'s gold and foreign currency reserves.'],
       ['Conductor of monetary policy', 'Sets interest rates and the money supply to hit its objectives.']].map(([h, p]) => `<details class="reveal" style="border-color:var(--line)"><summary>${h}</summary><div>${p}</div></details>`).join('')}
  </div>
  <h2>Objectives</h2>
  <div class="idea"><p>The main objective of almost every central bank is <b>price stability</b>, usually a low, stable inflation rate around 2%. Some also have other goals, such as the US Federal Reserve's <b>dual mandate</b> of maximum employment and stable prices, plus stable exchange rates or moderate long-term interest rates elsewhere.</p></div>
  ${say('penny', 'Why not aim for 0% inflation? Measured inflation overstates true inflation (remember the biases?), and a small positive rate gives a buffer against <b>deflation</b>, which is much harder to cure.', 'think')}`,
  check: [{ q: 'A central bank lending to a solvent commercial bank facing a sudden run is acting as…', o: ['Banker to the government', 'Lender of last resort', 'Monopoly supplier of currency', 'Manager of FX reserves'], a: 1, why: 'Providing emergency liquidity to stop a bank run is the lender-of-last-resort role.' }],
  take: ['Central banks issue currency, bank for government and banks, act as lender of last resort, supervise, and manage reserves.', 'The primary objective is price stability; some have dual mandates.']
});

lesson({
  id: 'inflation-costs', title: 'Costs of Expected and Unexpected Inflation', dur: '3:53', tags: 'menu costs shoe leather costs redistribution borrowers lenders uncertainty',
  hook: `Even when everyone sees inflation coming, it's a nuisance. When it surprises us, it quietly moves wealth from one group to another.`,
  body: () => `
  <div class="cards">
    <div class="card"><h4>Expected inflation</h4><ul><li><b>Menu costs</b>: reprinting price lists, updating systems.</li><li><b>Shoe leather costs</b>: time and effort spent holding less cash (more trips to the bank).</li><li>Distorted taxes when tax systems aren't fully indexed.</li></ul></div>
    <div class="card"><h4>Unexpected inflation</h4><ul><li><b>Redistribution</b>: borrowers gain, lenders lose (and vice versa for unexpected disinflation).</li><li><b>Uncertainty</b>: firms delay investment; lenders demand a risk premium.</li><li>Confusion between relative price changes and general inflation, which distorts decisions.</li></ul></div>
  </div>
  ${W('rd')}`,
  widgets: {
    rd(el) {
      el.innerHTML = lab('Who wins from surprise inflation?', `<p class="hint-line">A bank lends $10,000 for one year. Both sides expect inflation of 2%, so they agree a nominal rate of 5% (real rate 3%).</p>
        <div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('a', 'Actual inflation', -2, 12, .5, 2)}<div class="readout">${ro('Realised real rate', 'r')}${ro('Lender gain/loss (real $)', 'g')}</div><div class="verdict" id="v"></div></div></div>`);
      const draw = () => {
        const a = val(el, 'a'); setO(el, 'a', pct(a));
        const rr = (1.05 / (1 + a / 100) - 1) * 100, gain = 10000 * (rr - 3) / 100;
        const c = chart({ x: [-2, 12], y: [-8, 8], xl: 'Actual inflation (%)', yl: 'Realised real rate (%)', xt: [0, 2, 4, 6, 8, 10, 12], yt: [-8, -4, 0, 4, 8], grid: true, h: 280, label: 'Realised real rate' });
        c.hline(0, 'gridl').vline(2, 'guide', -8, 8).text(2, 8, 'expected', 'mu', 4, 14);
        c.fn(x => (1.05 / (1 + x / 100) - 1) * 100, 'l1', -2, 12).guide(a, rr).dot(a, rr, rr >= 3 ? 'm' : 'c', 7);
        $('#p', el).innerHTML = c.html();
        setT(el, 'r', pct(rr, 2)); setT(el, 'g', (gain >= 0 ? '+$' : '−$') + fmt0(Math.abs(gain)));
        $('#v', el).className = 'verdict ' + (Math.abs(a - 2) < .3 ? 'good' : 'warn');
        $('#v', el).innerHTML = Math.abs(a - 2) < .3 ? 'Inflation was as expected. Nobody wins or loses.' : a > 2 ? `Surprise inflation! The borrower repays in cheaper dollars. Wealth moves from <b>lender to borrower</b>.` : `Inflation came in lower than expected. Wealth moves from <b>borrower to lender</b>.`;
        goal(el, 'Make the lender\'s realised real return negative.', rr < 0);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Higher-than-expected inflation tends to benefit…', o: ['Lenders with fixed-rate loans', 'Borrowers with fixed-rate loans', 'People holding large cash balances', 'Pensioners on fixed nominal pensions'], a: 1, why: 'Borrowers repay a fixed nominal amount with money that is worth less in real terms.' }],
  take: ['Expected inflation causes menu costs and shoe leather costs.', 'Unexpected inflation redistributes wealth from lenders to borrowers and raises uncertainty and risk premiums.']
});

lesson({
  id: 'policy-tools', title: 'Monetary Policy Tools', dur: '3:00', tags: 'open market operations policy rate reserve requirements repo',
  hook: `A central bank has three classic dials. Each one changes how much money banks have to lend, and what it costs them.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-sun">1</div><h4>Open market operations</h4><p>Buying or selling government bonds with banks. <b>Buying</b> bonds injects reserves (expansionary); <b>selling</b> drains them (contractionary).</p></div>
    <div class="card"><div class="ic c-acc">2</div><h4>Policy rate</h4><p>The rate at which the central bank lends to banks (the refi rate, discount rate, or repo rate). Lower is expansionary; higher is contractionary.</p></div>
    <div class="card"><div class="ic c-plu">3</div><h4>Reserve requirements</h4><p>The share of deposits banks must hold. Lowering it frees up lending (expansionary). Rarely used as an active tool in developed markets.</p></div>
  </div>
  ${W('t')}`,
  widgets: {
    t(el) {
      const acts = [
        { t: 'Buy bonds (OMO)', e: [1, 1, -1, 1], d: 'Banks receive cash for bonds, so reserves rise. They lend more, the money supply grows and rates fall.' },
        { t: 'Sell bonds (OMO)', e: [-1, -1, 1, -1], d: 'Banks pay for bonds with reserves, so reserves fall, lending shrinks and rates rise.' },
        { t: 'Cut policy rate', e: [1, 1, -1, 1], d: 'Banks borrow more cheaply from the central bank and pass lower rates on to customers.' },
        { t: 'Raise policy rate', e: [-1, -1, 1, -1], d: 'Borrowing from the central bank costs more, so commercial rates rise and lending slows.' },
        { t: 'Lower reserve requirement', e: [1, 1, -1, 1], d: 'Banks can lend a larger share of deposits: the money multiplier rises.' },
        { t: 'Raise reserve requirement', e: [-1, -1, 1, -1], d: 'Banks must hold more idle reserves, so the money multiplier falls.' }
      ];
      const lbl = ['Bank lending capacity', 'Money supply', 'Market interest rates', 'Aggregate demand'];
      el.innerHTML = lab('Central bank control panel', `<div class="chips" id="c">${acts.map((a, i) => `<button type="button" class="chip" data-i="${i}">${a.t}</button>`).join('')}</div><div id="o"></div><div class="verdict" id="v">Choose an action.</div>`, 'Lab');
      const draw = i => {
        const e = i == null ? [0, 0, 0, 0] : acts[i].e;
        $('#o', el).innerHTML = `<div class="readout">${lbl.map((l, k) => `<div class="ro"><small>${l}</small><b style="color:var(--${e[k] > 0 ? 'mint' : e[k] < 0 ? 'coral' : 'muted'})">${e[k] > 0 ? '▲ up' : e[k] < 0 ? '▼ down' : '–'}</b></div>`).join('')}</div>`;
      };
      $('#c', el).addEventListener('click', ev => { const b = ev.target.closest('.chip'); if (!b) return; $$('.chip', el).forEach(x => x.classList.toggle('on', x === b)); const i = +b.dataset.i; draw(i); $('#v', el).innerHTML = acts[i].d + (acts[i].e[3] > 0 ? ' <b>Expansionary.</b>' : ' <b>Contractionary.</b>'); });
      draw(null);
    }
  },
  check: [{ q: 'A central bank wanting to tighten policy through open market operations would…', o: ['Buy government bonds', 'Sell government bonds', 'Lower the reserve requirement', 'Cut the policy rate'], a: 1, why: 'Selling bonds drains reserves from banks, reducing lending and raising interest rates.' }],
  take: ['Three tools: open market operations, the policy rate, reserve requirements.', 'Buying bonds, cutting rates and lowering reserve requirements are expansionary.']
});

lesson({
  id: 'transmission', title: 'The Monetary Transmission Mechanism', dur: '4:43', tags: 'policy rate asset prices expectations exchange rate domestic demand inflation',
  hook: `When the central bank changes its policy rate, how does that tiny change reach the price of your groceries? Through four channels that ripple out across the economy.`,
  body: () => `
  ${W('tm')}
  <ol>
    <li><b>Market interest rates</b>: banks change lending and deposit rates, which affects borrowing and saving.</li>
    <li><b>Asset prices</b>: lower rates raise the value of bonds, shares and houses, creating a wealth effect.</li>
    <li><b>Expectations and confidence</b>: a rate cut signals the bank's view and can lift confidence.</li>
    <li><b>Exchange rate</b>: lower rates make domestic assets less attractive, so the currency depreciates and exports become more competitive.</li>
  </ol>
  <p>These channels raise <b>domestic demand</b> and <b>net external demand</b>, which increases total demand and inflation pressure, while a weaker currency also pushes up <b>import prices</b>.</p>
  <div class="pit"><p>The effects take time, typically 1–2 years to fully affect inflation, and the size is uncertain. That's why central banks look ahead, at <b>forecast</b> inflation.</p></div>`,
  widgets: {
    tm(el) {
      el.innerHTML = lab('Watch a rate change ripple through', `${segHTML('d', ['Rate cut', 'Rate hike'])}<div class="plot" style="overflow-x:auto" id="p"></div><p class="hint-line"><b>Try:</b> switch between a cut and a hike. Every arrow flips direction.</p>`, 'Diagram');
      let dir = 1;
      const N = [
        { id: 'pr', x: 10, y: 140, t: 'Policy rate', s: 1, w: 100 },
        { id: 'mr', x: 150, y: 20, t: 'Market rates', s: 1 }, { id: 'ap', x: 150, y: 100, t: 'Asset prices', s: -1 }, { id: 'ex', x: 150, y: 180, t: 'Expectations', s: -1 }, { id: 'fx', x: 150, y: 260, t: 'Exchange rate', s: 1 },
        { id: 'dd', x: 320, y: 70, t: 'Domestic demand', s: -1 }, { id: 'nx', x: 320, y: 220, t: 'Net external demand', s: -1 },
        { id: 'td', x: 490, y: 100, t: 'Total demand', s: -1 }, { id: 'ip', x: 490, y: 220, t: 'Import prices', s: -1 },
        { id: 'in', x: 640, y: 160, t: 'Inflation', s: -1, w: 100 }
      ];
      const E = [['pr', 'mr'], ['pr', 'ap'], ['pr', 'ex'], ['pr', 'fx'], ['mr', 'dd'], ['ap', 'dd'], ['ex', 'dd'], ['fx', 'nx'], ['fx', 'ip'], ['dd', 'td'], ['nx', 'td'], ['td', 'in'], ['ip', 'in']];
      const draw = () => {
        const g = id => N.find(n => n.id === id);
        const bw = n => n.w || 130, H = 44;
        let svg = `<svg viewBox="0 0 750 320" style="min-width:620px" role="img" aria-label="Transmission mechanism">`;
        E.forEach(([a, b], i) => {
          const A = g(a), B = g(b), x1 = A.x + bw(A), y1 = A.y + H / 2, x2 = B.x, y2 = B.y + H / 2, mx = (x1 + x2) / 2;
          const d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 6},${y2}`;
          svg += `<path d="${d}" class="dg-arrow on" id="e${i}"/><path d="M${x2 - 6},${y2 - 5} L${x2},${y2} L${x2 - 6},${y2 + 5}" class="dg-arrow on"/>
            <circle r="4.5" class="flowdot"><animateMotion dur="2.4s" repeatCount="indefinite" begin="${(i % 4) * .3}s" path="${d}"/></circle>`;
        });
        N.forEach(n => {
          const up = n.s * dir < 0 ? true : false; const arrow = (n.id === 'pr' ? (dir > 0 ? '▼' : '▲') : (n.s * dir > 0 ? (n.id === 'fx' ? '▼ weaker' : '▼') : (n.id === 'fx' ? '▲ stronger' : '▲')));
          const isUp = arrow.startsWith('▲');
          svg += `<g><rect x="${n.x}" y="${n.y}" width="${bw(n)}" height="${H}" rx="10" class="dg-box on"/><text class="dg-t" x="${n.x + bw(n) / 2}" y="${n.y + 19}" text-anchor="middle">${n.t}</text>
            <text class="lab-t ${isUp ? 'm' : 'c'}" x="${n.x + bw(n) / 2}" y="${n.y + 36}" text-anchor="middle">${arrow}</text></g>`;
        });
        svg += '</svg>';
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px;padding:6px">${svg}</div>`;
      };
      segBind(el, 'd', i => { dir = i ? -1 : 1; draw(); }); draw();
    }
  },
  check: [{ q: 'Through the exchange rate channel, a cut in the policy rate typically…', o: ['Appreciates the currency and lowers import prices', 'Depreciates the currency, boosting net exports and raising import prices', 'Has no effect on trade', 'Reduces asset prices'], a: 1, why: 'Lower rates make domestic assets less attractive, the currency weakens, exports become cheaper abroad and imports pricier at home.' }],
  take: ['Policy rates work through market rates, asset prices, expectations and the exchange rate.', 'These affect domestic and external demand, then inflation, with long and variable lags.']
});

lesson({
  id: 'effective-central-banks', title: 'Qualities of Effective Central Banks', dur: '3:53', tags: 'independence credibility transparency inflation expectations',
  hook: `Two central banks announce the same 2% target. One gets believed, the other doesn't. The difference comes down to three qualities.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-acc">I</div><h4>Independence</h4><p>Free from political pressure to print money before elections. <b>Operational</b> independence: the bank chooses how to hit the target. <b>Target</b> independence: it also sets the target.</p></div>
    <div class="card"><div class="ic c-sun">C</div><h4>Credibility</h4><p>People believe it will do what it says. Then expectations stay anchored, and the bank needs smaller rate moves to keep inflation on target.</p></div>
    <div class="card"><div class="ic c-min">T</div><h4>Transparency</h4><p>Publishes its targets, forecasts, inflation reports and meeting minutes, so markets understand its reasoning.</p></div>
  </div>
  ${W('cr')}`,
  widgets: {
    cr(el) {
      el.innerHTML = lab('Credibility and inflation expectations', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('c', 'Central bank credibility', 0, 100, 5, 70)}
        <div class="verdict" id="v"></div></div></div><p class="hint-line"><b>Try:</b> an oil shock pushes inflation to 6% in year 1. With low credibility, expectations drift up and inflation stays high. With high credibility, it snaps back.</p>`);
      const draw = () => {
        const cr = val(el, 'c') / 100; setO(el, 'c', fmt0(cr * 100) + '%');
        const pts = [], ex = []; let e = 2;
        for (let t = 0; t <= 10; t += .25) {
          const shock = t >= 1 && t < 2 ? 4 : 0;
          const pi = e + shock * (1 - .3 * cr);
          pts.push([t, pi]); ex.push([t, e]);
          e = e + (1 - cr) * .25 * (pi - e) * 1.2 - cr * .25 * .6 * (e - 2);
        }
        const c = chart({ x: [0, 10], y: [0, 9], xl: 'Years', yl: 'Inflation (%)', xt: [0, 2, 4, 6, 8, 10], yt: [0, 2, 4, 6, 8], grid: true, label: 'Inflation path' });
        c.hline(2, 'l3 thin').text(10, 2, 'target 2%', 'm', -4, 16, 'end').line(pts, 'l2').line(ex, 'l1', 'stroke-dasharray="6 4"');
        c.text(10, pts[pts.length - 1][1], 'inflation', 'c', -4, -8, 'end').text(6, ex[24][1], 'expectations', 'a', 0, -10, 'middle');
        $('#p', el).innerHTML = c.html();
        const end = pts[pts.length - 1][1];
        $('#v', el).className = 'verdict ' + (end < 2.6 ? 'good' : 'bad');
        $('#v', el).innerHTML = end < 2.6 ? 'Expectations stay <b>anchored</b>: people trust the bank, so inflation returns to target quickly.' : `Expectations <b>de-anchor</b>. After 10 years inflation is still around ${pct(end)}, and the bank would need a painful recession to bring it down.`;
        goal(el, 'With credibility of 60% or less, still bring inflation back within 0.6 pp of target.', cr <= .6 && end < 2.6);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'A central bank that can choose how to achieve a target set by the government has…', o: ['Target independence', 'Operational independence', 'No independence', 'Full credibility by definition'], a: 1, why: 'Operational independence means choosing the tools and settings; the target itself is set by government.' }],
  take: ['Effective central banks are independent, credible and transparent.', 'Credibility anchors inflation expectations and makes policy cheaper to run.']
});

lesson({
  id: 'policy-growth', title: 'The Relationship between Monetary Policy and Economic Growth', dur: '3:45', tags: 'neutral rate trend growth inflation target stance',
  hook: `How do we know if a 4% policy rate is "high" or "low"? We compare it with the <b>neutral rate</b>, the rate that neither speeds up nor slows down the economy.`,
  body: () => `
  <div class="formula"><span class="lbl">Neutral policy rate</span><b>Neutral rate = Trend real GDP growth + Inflation target</b></div>
  <div class="cards">
    <div class="card"><h4>Policy rate &gt; neutral</h4><p><b>Contractionary</b>: slows growth and inflation.</p></div>
    <div class="card"><h4>Policy rate &lt; neutral</h4><p><b>Expansionary</b>: supports growth and raises inflation.</p></div>
    <div class="card"><h4>Policy rate = neutral</h4><p><b>Neutral</b>: consistent with trend growth and on-target inflation.</p></div>
  </div>
  ${W('n')}
  <p>In the long run, money is broadly neutral: monetary policy can't permanently raise real growth. Its job is to keep the economy close to potential with stable prices.</p>`,
  widgets: {
    n(el) {
      el.innerHTML = lab('Stance gauge', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('g', 'Trend real growth', 0, 5, .25, 2)}${slider('t', 'Inflation target', 0, 5, .25, 2)}${slider('r', 'Current policy rate', 0, 10, .25, 5.5)}
        <div class="readout">${ro('Neutral rate', 'n')}${ro('Gap', 'gp')}</div><div class="verdict" id="v"></div></div></div>`);
      const draw = () => {
        const g = val(el, 'g'), t = val(el, 't'), r = val(el, 'r'); setO(el, 'g', pct(g, 2)); setO(el, 't', pct(t, 2)); setO(el, 'r', pct(r, 2));
        const n = g + t, gap = r - n, a = clamp(gap / 4, -1, 1) * 80;
        const cx = 160, cy = 150, R = 110;
        const arc = (a1, a2, cl) => { const p = a => [cx + R * Math.cos((a - 90) * Math.PI / 180), cy + R * Math.sin((a - 90) * Math.PI / 180)]; const [x1, y1] = p(a1), [x2, y2] = p(a2); return `<path d="M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2}" stroke="var(--${cl})" stroke-width="22" fill="none"/>`; };
        const nx = cx + (R - 18) * Math.cos((a - 90) * Math.PI / 180), ny = cy + (R - 18) * Math.sin((a - 90) * Math.PI / 180);
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 320 190" role="img" aria-label="Policy stance gauge">${arc(-80, -12, 'mint')}${arc(-12, 12, 'sun-fill')}${arc(12, 80, 'coral')}
          <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="8" fill="var(--ink)"/>
          <text class="dg-s" x="40" y="180">Expansionary</text><text class="dg-s" x="160" y="26" text-anchor="middle">Neutral</text><text class="dg-s" x="280" y="180" text-anchor="end">Contractionary</text></svg></div>`;
        setT(el, 'n', pct(n, 2)); setT(el, 'gp', (gap > 0 ? '+' : '') + fmt(gap, 2) + ' pp');
        $('#v', el).innerHTML = Math.abs(gap) < .3 ? 'Policy is roughly <b>neutral</b>.' : gap > 0 ? `The policy rate is ${fmt(gap, 2)} pp above neutral: policy is <b>contractionary</b>.` : `The policy rate is ${fmt(-gap, 2)} pp below neutral: policy is <b>expansionary</b>.`;
        goal(el, 'With 3% trend growth and a 2% target, set a neutral policy rate.', g === 3 && t === 2 && Math.abs(gap) < .3);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Trend growth is 2%, the inflation target is 2% and the policy rate is 3%. Policy is…', o: ['Contractionary', 'Expansionary', 'Neutral', 'Impossible to tell'], a: 1, why: 'Neutral = 2 + 2 = 4%. A 3% policy rate is below neutral, so it is expansionary.' }],
  take: ['Neutral rate = trend growth + inflation target.', 'Above neutral is contractionary; below is expansionary.']
});

lesson({
  id: 'targeting', title: 'Inflation, Interest Rate and Exchange Rate Targeting', dur: '3:07', tags: 'inflation targeting exchange rate peg foreign reserves interest rate targeting',
  hook: `A central bank needs an anchor, a clear target to steer by. The main choices are an inflation target, an interest rate target, or a fixed exchange rate.`,
  body: () => `
  <div class="cards">
    <div class="card"><h4>Inflation targeting</h4><p>The most common framework. A public target (often 2%, with a band such as ±1%), set by an independent, credible, transparent bank that adjusts the policy rate to hit forecast inflation.</p></div>
    <div class="card"><h4>Interest rate targeting</h4><p>The bank targets a short-term market rate and uses open market operations to keep it there, buying bonds if rates rise above target and selling if below.</p></div>
    <div class="card"><h4>Exchange rate targeting</h4><p>Common in developing economies: peg the currency to a stable one (often the US dollar) to import that country's low inflation. The bank buys and sells its currency with FX reserves to defend the peg.</p></div>
  </div>
  ${W('peg')}
  <div class="pit"><p>Defending a peg means the bank gives up control of domestic interest rates and money supply. If reserves run out, the peg can collapse in a speculative attack.</p></div>`,
  widgets: {
    peg(el) {
      el.innerHTML = lab('Defend the peg', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('o', 'Capital outflow pressure ($bn/month)', 0, 15, .5, 4)}${slider('i', 'Domestic interest rate raised by', 0, 10, .5, 0)}
        <div class="verdict" id="v"></div></div></div><p class="hint-line"><b>Try:</b> with strong outflows the bank sells reserves to buy its own currency. Raising rates attracts capital back and slows the drain, but it hurts domestic growth.</p>`);
      const draw = () => {
        const o = val(el, 'o'), i = val(el, 'i'); setO(el, 'o', '$' + fmt(o, 1) + 'bn'); setO(el, 'i', '+' + fmt(i, 1) + ' pp');
        const net = Math.max(0, o - i * .9); const pts = []; let R = 60, fail = null;
        for (let m = 0; m <= 24; m++) { pts.push([m, Math.max(0, R)]); if (R <= 0 && fail === null) fail = m; R -= net; }
        const c = chart({ x: [0, 24], y: [0, 70], xl: 'Months', yl: 'FX reserves ($bn)', xt: [0, 6, 12, 18, 24], yt: [0, 20, 40, 60], grid: true, h: 280, label: 'Reserves path' });
        c.line(pts, 'l4').hline(10, 'l2 thin').text(24, 10, 'danger zone', 'c', -4, -8, 'end');
        $('#p', el).innerHTML = c.html();
        $('#v', el).className = 'verdict ' + (fail !== null ? 'bad' : net > 0 ? 'warn' : 'good');
        $('#v', el).innerHTML = fail !== null ? `Reserves run out in month <b>${fail}</b>. The peg breaks and the currency falls sharply.` : net > 0 ? `Reserves are draining at $${fmt(net, 1)}bn a month, but the peg survives two years.` : `Higher rates offset the outflow. The peg holds, at the cost of tighter credit at home${i > 4 ? ', which risks a recession' : ''}.`;
        goal(el, 'Keep the peg alive for 24 months against outflows of $10bn a month or more.', o >= 10 && fail === null);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'A central bank pegging its currency to the US dollar faces downward pressure on its currency. To defend the peg it would…', o: ['Buy foreign currency and cut rates', 'Sell foreign currency reserves and buy its own currency', 'Print more domestic currency', 'Lower the reserve requirement'], a: 1, why: 'Selling FX reserves to buy domestic currency supports its value. Raising interest rates would also help.' }],
  take: ['Inflation targeting: public target, independent and transparent bank.', 'Exchange rate targeting imports another country\'s stability but sacrifices domestic monetary control.', 'Interest rate targeting uses open market operations to hold a market rate near target.']
});

lesson({
  id: 'monetary-stance', title: 'Expansionary or Contractionary Monetary Policy?', dur: '2:23', tags: 'stance neutral rate practice',
  hook: `Quick drill time! Given the neutral rate and the policy rate, can you call the stance? Remember: compare against <b>neutral</b>, not against last month's rate.`,
  body: () => `<div class="formula">Neutral rate = trend growth + inflation target · Policy rate &gt; neutral → contractionary · &lt; neutral → expansionary</div>${W('s')}
  ${say('penny', 'Trap alert: a bank that <b>cuts</b> rates from 7% to 6% when neutral is 4% is still running <b>contractionary</b> policy. It\'s just less tight than before.', 'wow')}`,
  widgets: {
    s(el) {
      sorter(el, {
        title: 'Call the stance', prompt: 'Compute the neutral rate, compare it with the policy rate, and choose.',
        bins: ['Expansionary', 'Neutral', 'Contractionary'],
        items: [
          { t: 'Trend growth 2%, target 2%, policy rate 1.5%', b: 0, why: 'Neutral 4% > 1.5%.' },
          { t: 'Trend growth 3%, target 2%, policy rate 7%', b: 2, why: 'Neutral 5% < 7%.' },
          { t: 'Trend growth 1.5%, target 2.5%, policy rate 4%', b: 1, why: 'Neutral = 4%.' },
          { t: 'Rate cut from 7% to 6%; trend growth 2%, target 2%', b: 2, why: 'Still above neutral of 4%, so contractionary, just less so.' },
          { t: 'Trend growth 4%, target 3%, policy rate 5%', b: 0, why: 'Neutral 7% > 5%.' }
        ], shuffle: false
      }, 'penny');
    }
  },
  check: [{ q: 'Trend growth 2.5%, inflation target 2%, policy rate 5%. Stance?', o: ['Expansionary', 'Neutral', 'Contractionary', 'Cannot be determined'], a: 2, why: 'Neutral = 4.5%. 5% is above it, so policy is contractionary.' }],
  take: ['Always judge the stance against the neutral rate, not against the direction of the last move.']
});

lesson({
  id: 'monetary-limits', title: 'Limitations of Monetary Policy', dur: '5:29', tags: 'liquidity trap zero lower bound quantitative easing bond market vigilantes deflation',
  hook: `Monetary policy is powerful, but it has an off switch it doesn't control. Sometimes the signal gets lost between the central bank and the economy.`,
  body: () => `
  <div class="cards">
    <div class="card"><h4>Long-term rates may not follow</h4><p>If markets doubt the bank's inflation resolve, long-term rates can rise even when the policy rate is cut. These "bond market vigilantes" demand compensation for future inflation.</p></div>
    <div class="card"><h4>Liquidity trap</h4><p>When rates are near zero, people are happy to hold any amount of money. Adding more money doesn't lower rates or raise spending.</p></div>
    <div class="card"><h4>Zero lower bound and deflation</h4><p>Nominal rates can't fall much below zero. In deflation, real rates stay high even at zero nominal rates.</p></div>
    <div class="card"><h4>Banks may not lend</h4><p>In a crisis banks hoard reserves and households and firms don't want to borrow, so the multiplier collapses.</p></div>
    <div class="card"><h4>Developing economies</h4><p>Shallow bond markets, weak credibility and rapid financial change make policy hard to transmit.</p></div>
  </div>
  <h2>The response: quantitative easing (QE)</h2>
  <p>When the policy rate is stuck near zero, central banks buy large amounts of longer-term bonds and other assets to push down long-term yields and add liquidity. Results have been debated: QE supports asset prices, but the effect on lending and real activity is uncertain.</p>
  ${W('lt')}
  <h2>Quantitative tightening (QT): the reverse gear</h2>
  <p>After years of QE, central banks hold enormous bond portfolios. Once inflation is the problem rather than weak demand, they shrink them again. This is <b>quantitative tightening</b>.</p>
  <div class="cards">
    <div class="card"><div class="ic c-sun">1</div><h4>Passive runoff</h4><p>Let bonds <b>mature without reinvesting</b> the principal. Gradual and predictable; the usual approach.</p></div>
    <div class="card"><div class="ic c-cor">2</div><h4>Active sales</h4><p><b>Sell bonds</b> into the market before they mature. Faster, with a bigger effect on yields and more risk of market stress.</p></div>
    <div class="card"><div class="ic c-acc">R</div><h4>Reserves drain</h4><p>When a bond matures or is sold, the payment comes out of banks' reserve accounts at the central bank. <b>Bank reserves shrink</b> one-for-one with the balance sheet.</p></div>
    <div class="card"><div class="ic c-plu">%</div><h4>Long yields rise</h4><p>Private investors must absorb more bonds, so they demand a higher <b>term premium</b>: upward pressure on long-term yields and tighter financial conditions.</p></div>
  </div>
  ${W('qe')}
  <div class="pit"><p>QT is meant to run quietly in the background while the policy rate does the main work. If reserves become scarce, short-term money markets can seize up (as in the US repo market in September 2019), so central banks slow or stop QT before reserves get too thin.</p></div>
  `,
  widgets: {
    qe(el) {
      el.innerHTML = lab('Central bank balance sheet: QE versus QT', `${segHTML('m', ['QE: buy bonds', 'QT: passive runoff', 'QT: active sales'], 1)}
        <div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('pace', 'Monthly pace ($bn)', 10, 120, 5, 60)}${slider('mo', 'Months of the programme', 0, 36, 1, 18)}
        <div class="readout">${ro('Balance sheet', 'bs')}${ro('Bank reserves', 'rs')}${ro('10-year yield', 'y')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> run QE and watch reserves and the balance sheet grow while long yields fall. Switch to QT: reserves drain and yields rise, faster with active sales. The dashed red line is where reserves start to get scarce.</p>`, 'Try it', 'Use QT to shrink the balance sheet by at least $1,000bn without reserves falling below $1,500bn.');
      let mode = 1;
      const draw = () => {
        const pace = val(el, 'pace'), mo = val(el, 'mo'); setO(el, 'pace', '$' + pace + 'bn'); setO(el, 'mo', mo + ' mo');
        const sgn = mode === 0 ? 1 : -1, eff = [-.30, .20, .35][mode];
        const path = t => { const d = pace * t; return { bs: 4000 + sgn * d, rs: 3000 + sgn * d, y: 3.5 + eff * d / 1000 }; };
        const end = path(mo);
        const ys = [...Array(37).keys()].map(t => [t, path(Math.min(t, mo)).y]);
        const rsP = [...Array(37).keys()].map(t => [t, Math.max(0, path(Math.min(t, mo)).rs) / 1000]);
        const c = chart({ x: [0, 36], y: [0, 7], xl: 'Months', yl: '10y yield (%) · reserves ($tn)', xt: [0, 12, 24, 36], yt: [0, 1, 2, 3, 4, 5, 6, 7], grid: true, h: 300, label: 'Yield and reserves path' });
        c.hline(1.5, 'l2 thin').text(36, 1.5, 'scarce reserves', 'c', -4, 16, 'end');
        c.line(rsP, 'l1').line(ys, 'l5').vline(mo, 'guide', 0, 7);
        c.text(36, rsP[36][1], 'reserves', 'a', -4, -8, 'end').text(36, ys[36][1], '10-year yield', 'p', -4, -8, 'end');
        $('#p', el).innerHTML = c.html();
        setT(el, 'bs', '$' + fmt(end.bs / 1000, 2) + 'tn'); setT(el, 'rs', '$' + fmt(Math.max(0, end.rs) / 1000, 2) + 'tn'); setT(el, 'y', pct(end.y, 2));
        const scarce = end.rs < 1500;
        $('#v', el).className = 'verdict ' + (scarce ? 'bad' : mode ? 'warn' : 'good');
        $('#v', el).innerHTML = mode === 0 ? `QE adds $${fmt0(pace * mo)}bn of bonds and the same amount of reserves. Long yields fall to ${pct(end.y, 2)}, easing financial conditions.`
          : scarce ? `Reserves have fallen to $${fmt(Math.max(0, end.rs) / 1000, 2)}tn: they are now <b>scarce</b>. Money-market rates could spike, so the central bank would slow or stop QT.`
          : `${mode === 1 ? 'Passive runoff' : 'Active sales'} remove $${fmt0(pace * mo)}bn of bonds and reserves. The 10-year yield rises to ${pct(end.y, 2)}${mode === 2 ? ', more than with runoff, because sales add bonds to the market at once' : ''}.`;
        goal(el, 'Use QT to shrink the balance sheet by at least $1,000bn without reserves falling below $1,500bn.', mode > 0 && pace * mo >= 1000 && !scarce);
      };
      segBind(el, 'm', i => { mode = i; draw(); });
      el.addEventListener('input', draw); draw();
    },
    lt(el) {
      el.innerHTML = lab('The liquidity trap', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('ms', 'Money supply', 3, 11, .1, 4)}<div class="readout">${ro('Interest rate', 'r')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> keep increasing the money supply. At first rates fall, then the curve goes flat near zero and extra money does nothing.</p>`);
      const md = q => Math.max(.25, 9 - 1.6 * q);
      const draw = () => {
        const ms = val(el, 'ms'); setO(el, 'ms', fmt(ms, 1));
        const r = md(ms);
        const c = chart({ x: [0, 12], y: [0, 10], xl: 'Quantity of money', yl: 'Interest rate (%)', yt: [0, 2, 4, 6, 8], grid: true, label: 'Liquidity trap' });
        c.rect(5.4, 0, 12, 1, 'fs').text(8.7, .5, 'liquidity trap', 's', 0, 4, 'middle');
        c.fn(md, 'l1', 0, 12).vline(ms, 'l4', 0, 9.5).text(ms, 9.5, 'Ms', 's', 6, 6).guide(ms, r).dot(ms, r, 's', 7);
        $('#p', el).innerHTML = c.html();
        setT(el, 'r', pct(r, 2));
        $('#v', el).className = 'verdict ' + (ms > 5.4 ? 'bad' : '');
        $('#v', el).innerHTML = ms > 5.4 ? 'Rates are stuck at the floor. More money is simply hoarded, so <b>conventional policy has lost traction</b>.' : 'Adding money still lowers interest rates. Policy is working.';
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'A central bank lets $60bn of bonds mature each month without reinvesting the proceeds. The most likely effects are…', o: ['Higher bank reserves and lower long-term yields', 'Lower bank reserves and upward pressure on long-term yields', 'A lower policy rate', 'No effect, since no bonds are sold'], a: 1, why: 'Passive runoff is still quantitative tightening: repayments drain reserves, and private investors must absorb more bonds, raising the term premium.' }, { q: 'Quantitative easing is most likely to be used when…', o: ['Inflation is far above target', 'The policy rate is close to zero and the economy is weak', 'The currency is too weak', 'The government runs a large surplus'], a: 1, why: 'QE is an unconventional tool used when the usual rate tool is exhausted at the zero lower bound.' }],
  take: ['Monetary policy can fail when long rates don\'t follow, in a liquidity trap, at the zero bound, or when banks won\'t lend.', 'Quantitative easing buys assets to push down long-term rates when policy rates are near zero.', 'Quantitative tightening shrinks the balance sheet by runoff or sales: it drains reserves and pushes long-term yields up.', 'Central banks stop QT before reserves become scarce to avoid money-market stress.']
});

lesson({
  id: 'practice-4', title: 'Practice Questions + Answers', dur: '0:01', practice: true, tags: 'quiz exam unit 4',
  hook: `Unit 4 review: money, banks, central banks, digital money and QE/QT. Ten questions. Good luck!`,

    { q: 'With a required reserve ratio of 8%, the money multiplier is…', o: ['8', '12.5', '0.08', '92'], a: 1, why: '1 ÷ 0.08 = 12.5. (Money creation)' },
    { q: 'MV = PY. If V and Y are constant and M doubles, then…', o: ['P halves', 'P doubles', 'Y doubles', 'V halves'], a: 1, why: 'With V and Y fixed, P moves in proportion to M. (Quantity theory)' },
    { q: 'The real rate is 1.5%, expected inflation 3% and the risk premium 0.5%. The nominal rate is about…', o: ['3.0%', '4.5%', '5.0%', '1.0%'], a: 2, why: '1.5 + 3 + 0.5 = 5%. (Fisher effect)' },
    { q: 'Which is <b>not</b> a cost of expected inflation?', o: ['Menu costs', 'Shoe leather costs', 'Redistribution from lenders to borrowers', 'Tax distortions from non-indexed brackets'], a: 2, why: 'Redistribution happens when inflation is unexpected. (Costs of inflation)' },
    { q: 'A central bank sells government bonds in the open market. This will most likely…', o: ['Increase bank reserves', 'Decrease bank reserves and raise interest rates', 'Lower interest rates', 'Increase the money multiplier'], a: 1, why: 'Banks pay with reserves, so lending capacity falls and rates rise. (Monetary policy tools)' },
    { q: 'Trend growth 3%, inflation target 2%, policy rate 3.5%. Monetary policy is…', o: ['Expansionary', 'Neutral', 'Contractionary', 'Unknown'], a: 0, why: 'Neutral = 5%; 3.5% is below it. (Policy and growth)' },
    { q: 'Bitcoin\'s price volatility mainly undermines its role as…', o: ['A medium of exchange', 'A unit of account and store of value', 'Legal tender', 'A central bank liability'], a: 1, why: 'Prices can\'t be quoted in, and wealth can\'t safely be held in, an asset whose value swings wildly. (Digital money)' },
    { q: 'A retail CBDC with no holding limits most raises the risk of…', o: ['Deflation', 'Bank disintermediation and fast digital bank runs', 'A weaker currency', 'Higher reserve requirements'], a: 1, why: 'Deposits could flow from banks into central bank money, shrinking bank funding. (Digital money)' },
    { q: 'Quantitative tightening through passive runoff most likely…', o: ['Adds reserves and lowers long-term yields', 'Drains bank reserves and puts upward pressure on long-term yields', 'Cuts the policy rate', 'Has no effect on the balance sheet'], a: 1, why: 'Maturing bonds are not replaced: reserves shrink and private investors must absorb more bonds. (Limitations of monetary policy)' },
    { q: 'When policy rates are near zero and extra money is simply hoarded, the economy is in…', o: ['A liquidity trap', 'Hyperinflation', 'A wage-price spiral', 'Stagflation'], a: 0, why: 'Conventional policy loses traction, which is why central banks turned to QE. (Limitations of monetary policy)' }
  ]
});

unit({ id: 'u5', title: 'Fiscal policy, taxes & national debt', short: 'Fiscal policy', host: 'ollie', blurb: 'What governments tax and spend, multipliers and who receives the money, Ricardian equivalence, debt sustainability, and the green transition.' });
lesson({
  id: 'fiscal-roles', title: 'Roles and Objectives of Fiscal Policy', dur: '5:19', host: 'ollie', tags: 'redistribution allocation stabilization automatic stabilizers discretionary',
  hook: `Ollie here again, for the government's side. Fiscal policy is more than fighting recessions. Through taxes and spending the government also decides <b>who gets what</b> and <b>what gets produced</b>.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-acc">1</div><h4>Distribute income and wealth</h4><p>Progressive taxes and transfer payments reduce inequality.</p></div>
    <div class="card"><div class="ic c-min">2</div><h4>Allocate resources</h4><p>Provide public goods (defence, roads, basic research) and tax harmful activities such as pollution.</p></div>
    <div class="card"><div class="ic c-sun">3</div><h4>Stabilise the economy</h4><p>Smooth the business cycle: support demand in recessions and cool it in booms, keeping unemployment and inflation in check.</p></div>
  </div>
  <h2>Two ways to stabilise</h2>
  <div class="cards">
    <div class="card"><h4>Automatic stabilisers</h4><p>Built in, no decision needed. In a recession, income tax receipts fall and unemployment benefits rise automatically, which supports demand. In a boom the reverse happens.</p></div>
    <div class="card"><h4>Discretionary policy</h4><p>Deliberate changes: a new stimulus package, a tax cut, a spending freeze. Powerful but slowed by lags and politics.</p></div>
  </div>
  ${W('as')}`,
  widgets: {
    as(el) {
      el.innerHTML = lab('Automatic stabilisers at work', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('g', 'Output gap', -6, 6, .5, -3)}
        <div class="readout">${ro('Tax revenue change', 't')}${ro('Transfer spending change', 'tr')}${ro('Budget balance change', 'b')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> move from a boom (+4) into a recession (−4). Nobody passes a law, yet the budget swings into deficit and cushions the fall.</p>`);
      const draw = () => {
        const g = val(el, 'g'); setO(el, 'g', (g > 0 ? '+' : '') + pct(g));
        const t = .35 * g, tr = -.15 * g, b = t - tr;
        const sc = 26, mid = 280;
        const bar = (y, v, cl, n) => `<text class="dg-t" x="10" y="${y + 19}">${n}</text><rect x="${v >= 0 ? mid : mid + v * sc}" y="${y}" width="${Math.abs(v) * sc}" height="28" class="${cl}" rx="3"/><text class="lab-t" x="${v >= 0 ? mid + v * sc + 6 : mid + v * sc - 6}" y="${y + 19}" text-anchor="${v >= 0 ? 'start' : 'end'}">${(v > 0 ? '+' : '') + fmt(v, 2)}</text>`;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 560 170" role="img" aria-label="Automatic stabilisers"><line x1="${mid}" x2="${mid}" y1="5" y2="160" class="ax"/>
          ${bar(15, t, 'fa-s', 'Tax revenue (% GDP)')}${bar(65, tr, 'fp-s', 'Transfers (% GDP)')}${bar(115, b, b >= 0 ? 'fm-s' : 'fc-s', 'Budget balance')}</svg></div>`;
        setT(el, 't', (t > 0 ? '+' : '') + fmt(t, 2) + ' pp'); setT(el, 'tr', (tr > 0 ? '+' : '') + fmt(tr, 2) + ' pp'); setT(el, 'b', (b > 0 ? '+' : '') + fmt(b, 2) + ' pp');
        $('#v', el).innerHTML = g < 0 ? 'Recession: taxes fall and benefits rise automatically, so the deficit widens and <b>supports demand</b>.' : g > 0 ? 'Boom: taxes rise and benefits fall, so the budget improves and <b>restrains demand</b>.' : 'At potential output.';
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Which is an automatic stabiliser?', o: ['A new infrastructure programme', 'A one-off tax rebate approved by parliament', 'Progressive income taxes', 'A central bank rate cut'], a: 2, why: 'Progressive tax receipts fall automatically as incomes drop, cushioning disposable income without any new decision.' }],
  take: ['Fiscal policy redistributes income, allocates resources and stabilises the economy.', 'Automatic stabilisers act without new decisions; discretionary policy requires deliberate action.']
});

lesson({

lesson({
  id: 'effective-tax', title: 'Effective Tax Policy', dur: '2:41', host: 'ollie', tags: 'simplicity efficiency fairness horizontal vertical equity revenue sufficiency progressive',
