/* ================= Unit 2: Business cycles, unemployment, inflation ================= */
unit({ id: 'u3', title: 'Business cycles, unemployment & inflation', short: 'Cycles & inflation', host: 'cog', blurb: 'The phases of the cycle, why it happens, how we measure unemployment and inflation, and the indicators that forecast turns.' });

const PHASES = {
  trough: { n: 'Trough', c: 'a', d: 'The lowest point. GDP growth turns from negative to positive.', rows: ['GDP growth changes from negative to positive', 'Unemployment high; firms reluctant to hire and use overtime first', 'Inflation moderating', 'Consumers start to buy postponed durables'] },
  expansion: { n: 'Expansion', c: 'm', d: 'Output grows above its trend rate and the economy recovers.', rows: ['GDP growth positive and accelerating', 'Firms rehire; unemployment falls', 'Inflation may pick up as slack disappears', 'Spending on durables and business investment rise'] },
  peak: { n: 'Peak', c: 's', d: 'The highest point. Growth slows as the economy runs at full stretch.', rows: ['GDP growth decelerates', 'Unemployment at its lowest; hiring slows', 'Inflation rising, often at its fastest', 'Consumer spending and investment start to slow'] },
  contraction: { n: 'Contraction', c: 'c', d: 'Output falls. A long, deep contraction is a recession.', rows: ['GDP growth negative', 'Firms cut hours first, then lay off workers; unemployment rises', 'Inflation moderates with a lag', 'Consumers cut discretionary and durable spending; investment falls'] }
};

lesson({
  id: 'cycle-phases', title: 'Business Cycle Phases', dur: '5:28', tags: 'trough expansion peak contraction recession',
  hook: `Economies don't grow in a straight line. They speed up, overheat, stall, shrink and recover, again and again. This rhythm is the <b>business cycle</b>, and it has four phases.`,
  body: () => `
  <div class="idea"><p>The business cycle is the recurring fluctuation of economic activity around its long-run trend. The cycles are recurring but <b>not periodic</b>: their length and depth vary a lot.</p></div>
  ${W('cyc')}
  <div class="tblw"><table class="tbl"><tr><th>Phase</th><th>Output</th><th>Jobs</th><th>Inflation</th></tr>
  <tr><td>Trough</td><td>Growth turns positive</td><td>Unemployment high</td><td>Moderating</td></tr>
  <tr><td>Expansion</td><td>Growing above trend</td><td>Hiring, unemployment falls</td><td>Picks up</td></tr>
  <tr><td>Peak</td><td>Growth slows</td><td>Unemployment lowest</td><td>Highest</td></tr>
  <tr><td>Contraction</td><td>Falling</td><td>Layoffs, unemployment rises</td><td>Eases with a lag</td></tr></table></div>
  ${say('cog', 'In the news, a <b>recession</b> is often called "two consecutive quarters of falling real GDP". It\'s a handy rule of thumb, but official bodies look at many indicators: jobs, income, production and sales.', 'think')}`,
  widgets: {
    cyc(el) {
      el.innerHTML = lab('Ride the business cycle', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('t', 'Time', 0, 100, .5, 18)}<div class="chips" id="ph">${Object.entries(PHASES).map(([k, v]) => `<button type="button" class="chip" data-k="${k}">${v.n}</button>`).join('')}</div>
        <div class="verdict" id="v"></div><div class="card" id="cd"></div></div></div>
        <p class="hint-line"><b>Try:</b> drag the time slider through a full wave, or click a phase to jump to it. The dashed line is the long-run trend (potential GDP); red bands are contractions. Notice expansions last longer than contractions.</p>`);
      const Y = t => 100 + .35 * t + 6 * Math.sin(t / 8);
      const dY = t => .35 + .75 * Math.cos(t / 8);
      const phase = t => {
        const s = dY(t);
        if (Math.abs(s) < .15) return Math.sin(t / 8) > 0 ? 'peak' : 'trough';
        return s > 0 ? 'expansion' : 'contraction';
      };
      const jump = { peak: 16.5, contraction: 25, trough: 33.8, expansion: 50 };
      const draw = () => {
        const t = val(el, 't'); setO(el, 't', 'month ' + fmt0(t));
        const c = chart({ x: [0, 100], y: [92, 146], xl: 'Time', yl: 'Real GDP', label: 'Business cycle' });
        c.fn(x => 100 + .35 * x, 'ghost', 0, 100).text(100, 135, 'trend', 'mu', -4, 14, 'end');
        // shade contractions
        let st = null;
        for (let x = 0; x <= 100.01; x += .5) { const ph = phase(x); const isC = ph === 'contraction'; if (isC && st === null) st = x; if ((!isC || x >= 100) && st !== null) { c.rect(st, 92, x, 146, 'fc'); st = null; } }
        c.fn(Y, 'l1', 0, 100, 200);
        const p = phase(t), P = PHASES[p];
        c.dot(t, Y(t), P.c, 8, 'class="pulse"').text(t, Y(t), P.n, P.c, 0, -16, 'middle');
        $('#p', el).innerHTML = c.html();
        $$('.chip', el).forEach(b => b.classList.toggle('on', b.dataset.k === p));
        $('#v', el).innerHTML = `<b>${P.n}.</b> ${P.d}`;
        $('#cd', el).innerHTML = `<ul>${P.rows.map(r => `<li>${r}</li>`).join('')}</ul>`;
        goal(el, 'Move the time slider to a trough of the cycle.', p === 'trough');
      };
      $('#ph', el).addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; $('#t', el).value = jump[b.dataset.k]; draw(); });
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'During which phase is the inflation rate typically highest and unemployment lowest?', o: ['Trough', 'Early expansion', 'Peak', 'Contraction'], a: 2, why: 'At the peak the economy is stretched: labour is scarce, slack is gone and price pressures are strongest.' }],
  take: ['Four phases: trough, expansion, peak, contraction.', 'Cycles recur but vary in length and depth.', 'Unemployment and inflation move in characteristic ways through each phase.']
});

lesson({
  id: 'resource-use', title: 'Resource Use and the Business Cycle', dur: '5:44', tags: 'inventory sales ratio capacity utilization hiring overtime',
  hook: `When sales suddenly drop, a factory can't fire everyone overnight, and it can't stop production instantly. The way firms adjust <b>inventories, hours and capital</b> actually amplifies the cycle.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-sun">Inv</div><h4>Inventories</h4><p>When sales fall unexpectedly, unsold goods pile up and the <b>inventory-to-sales ratio</b> rises. Firms then cut production sharply to work off the excess, which deepens the downturn. In a recovery, the ratio falls, and firms ramp production up.</p></div>
    <div class="card"><div class="ic c-plu">Hrs</div><h4>Labour</h4><p>Hiring and firing are costly. In a downturn firms first cut <b>overtime and hours</b>, then lay people off. In a recovery they use overtime first and hire only when they are confident.</p></div>
    <div class="card"><div class="ic c-acc">Cap</div><h4>Physical capital</h4><p>In a slump, <b>capacity utilisation</b> falls and investment is postponed. Near the peak, factories run near full capacity, so firms invest in new plant.</p></div>
  </div>
  ${W('inv')}
  ${say('cog', 'That\'s why the inventory-to-sales ratio is a <b>lagging</b> indicator: it peaks after the economy has already turned down, then falls only once firms have caught up.', 'think', true)}`,
  widgets: {
    inv(el) {
      el.innerHTML = lab('Inventories over the cycle', `<div class="plot" id="p"></div>${slider('lag', 'Production lag (how slowly firms react)', .2, 2, .1, 1)}<div class="verdict" id="v"></div>
        <p class="hint-line"><b>Try:</b> increase the lag. Inventory swings get bigger, and so do the production cuts needed to fix them.</p>`);
      const draw = () => {
        const lag = val(el, 'lag'); setO(el, 'lag', fmt(lag, 1) + ' quarters');
        const N = 120, S = [], Q = [], R = [];
        let inv = 60;
        for (let i = 0; i <= N; i++) {
          const t = i / 10;
          const s = 100 + 10 * Math.sin(t * .7);
          const q = 100 + 10 * Math.sin((t - lag) * .7) - .08 * (inv - 60);
          inv += (q - s) * .1;
          S.push([t, s]); Q.push([t, q]); R.push([t, inv / s]);
        }
        const c = chart({ x: [0, 12], y: [80, 120], xl: 'Quarters', yl: 'Units per quarter', h: 250, xt: [0, 4, 8, 12], yt: [80, 100, 120], grid: true, label: 'Sales and production' });
        c.line(S, 'l1').line(Q, 'l2').text(12, S[N][1], 'Sales', 'a', -2, -10, 'end').text(12, Q[N][1], 'Production', 'c', -2, 18, 'end');
        const rmin = Math.min(...R.map(r => r[1])), rmax = Math.max(...R.map(r => r[1]));
        const c2 = chart({ x: [0, 12], y: [Math.min(.4, rmin - .02), Math.max(.8, rmax + .02)], xl: 'Quarters', yl: 'Inventory / sales ratio', h: 200, xt: [0, 4, 8, 12], label: 'Inventory to sales' });
        c2.line(R, 'l4');
        $('#p', el).innerHTML = c.html() + '<div style="height:8px"></div>' + c2.html();
        $('#v', el).innerHTML = `When sales turn down, production keeps going for a while, so inventories pile up and the ratio climbs to <b>${fmt(rmax, 2)}</b>. Firms then cut output below sales to clear stock.`;
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'At the start of an expansion, firms typically respond to rising demand by first…', o: ['Hiring large numbers of permanent staff', 'Increasing overtime and hours of existing workers', 'Building new factories', 'Raising inventories well above sales'], a: 1, why: 'Hiring is costly and firms are unsure whether the recovery will last, so they first ask existing workers to work longer hours.' }],
  take: ['Inventory-to-sales ratios rise as an economy turns down and fall in recoveries.', 'Firms adjust hours before headcount, and delay investment until utilisation is high.']
});

lesson({
  id: 'housing-cycle', title: 'The Housing Market and the Business Cycle', dur: '4:01', tags: 'mortgage interest rates house prices affordability construction',
  hook: `Homes are the biggest purchase most families ever make, and almost everyone borrows to buy one. That makes housing very sensitive to <b>interest rates</b>, and a powerful driver of the cycle.`,
  body: () => `
  <div class="cards">
    <div class="card"><h4>Interest rates</h4><p>Lower mortgage rates cut monthly payments, so more households can afford to buy. Housing demand and construction rise.</p></div>
    <div class="card"><h4>Prices relative to income</h4><p>When house prices rise far faster than incomes, affordability worsens and demand eventually cools. Speculative booms can end in sharp busts.</p></div>
    <div class="card"><h4>Demographics</h4><p>The number of new households (young adults, migrants) sets the underlying demand for housing.</p></div>
  </div>
  ${W('h')}
  <p>Because residential construction is part of investment and supports spending on furniture and appliances, housing swings feed directly into GDP. Many recessions have been led by housing downturns.</p>`,
  widgets: {
    h(el) {
      el.innerHTML = lab('Mortgage calculator: what does a rate change do?', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('r', 'Mortgage rate', 1, 10, .25, 4)}${slider('hp', 'House price ($k)', 150, 700, 10, 350)}${slider('inc', 'Household income ($k/yr)', 30, 200, 5, 80)}
        <div class="readout">${ro('Monthly payment', 'm')}${ro('Share of income', 's')}${ro('Price / income', 'pi')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> move the mortgage rate from 3% to 7%. The same house becomes far less affordable, which is why central bank rate hikes cool housing quickly.</p>`);
      const pay = (L, r) => { const i = r / 1200, n = 360; return L * i / (1 - (1 + i) ** -n); };
      const draw = () => {
        const r = val(el, 'r'), hp = val(el, 'hp'), inc = val(el, 'inc');
        setO(el, 'r', pct(r, 2)); setO(el, 'hp', '$' + hp + 'k'); setO(el, 'inc', '$' + inc + 'k');
        const L = hp * 1000 * .8, m = pay(L, r), sh = m * 12 / (inc * 1000) * 100;
        const c = chart({ x: [1, 10], y: [0, 5000], xl: 'Mortgage rate (%)', yl: 'Monthly payment ($)', xt: [2, 4, 6, 8, 10], yt: [0, 1000, 2000, 3000, 4000, 5000], yf: v => fmt0(v), grid: true, label: 'Mortgage payment by rate' });
        c.hline(inc * 1000 / 12 * .3, 'l3 thin').text(10, inc * 1000 / 12 * .3, '30% of income', 'm', -4, -8, 'end');
        c.fn(x => pay(L, x), 'l1', 1, 10).guide(r, m).dot(r, m, 's', 7);
        $('#p', el).innerHTML = c.html();
        setT(el, 'm', '$' + fmt0(m)); setT(el, 's', pct(sh)); setT(el, 'pi', fmt(hp / inc, 1) + '×');
        $('#v', el).className = 'verdict ' + (sh > 30 ? 'bad' : 'good');
        $('#v', el).innerHTML = sh > 30 ? `Payments take <b>${pct(sh)}</b> of income, above the common 30% affordability line. Many buyers drop out, so demand and construction slow.` : `Payments take <b>${pct(sh)}</b> of income. The home is affordable, which supports housing demand.`;
        goal(el, 'Keep a home affordable (30% of income or less) even at a 7% mortgage rate.', r >= 7 && sh <= 30);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'A central bank raises interest rates sharply. The housing market most likely sees…', o: ['Higher demand and more construction', 'Lower demand and less construction', 'No change, since housing depends only on demographics', 'Higher house prices relative to income'], a: 1, why: 'Higher mortgage rates raise monthly payments and reduce affordability, so housing demand and construction fall.' }],
  take: ['Housing is highly sensitive to interest rates through mortgage payments.', 'House prices relative to income and demographics also drive housing demand.', 'Housing swings feed into investment and GDP and often lead the cycle.']
});

lesson({
  id: 'trade-cycle', title: 'External Trade and the Business Cycle', dur: '4:06', host: 'kip', tags: 'exports imports exchange rate trading partners openness',
  hook: `Hi, I'm <b>Kip</b>! I carry goods between countries. When your customers abroad boom, I'm packed full. When they slump, or your currency suddenly gets expensive, I sail half empty.`,
  body: () => `
  <div class="idea"><p>A country's exports depend mostly on its <b>trading partners' cycles</b> and on the <b>exchange rate</b>. Its imports depend on its own domestic cycle.</p></div>
  <ul><li>Partner countries in expansion buy more of your exports, boosting your GDP.</li><li>A <b>stronger</b> domestic currency makes your exports pricier abroad and imports cheaper at home, so net exports fall.</li><li>Exchange rate effects on trade take time and are uncertain; partner growth effects are more direct.</li><li>Small, open economies are far more exposed to the global cycle than large, closed ones.</li></ul>
  ${W('t')}`,
  widgets: {
    t(el) {
      el.innerHTML = lab('Export forecast', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('g', 'Trading partners\' GDP growth', -4, 6, .5, 2)}${slider('fx', 'Domestic currency appreciation', -15, 15, 1, 0)}${slider('op', 'Exports as % of GDP', 10, 80, 5, 30)}
        <div class="readout">${ro('Export growth', 'x')}${ro('Contribution to GDP growth', 'c')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> set partner growth negative and openness to 70% (a small open economy). The hit to GDP growth is large.</p>`);
      const draw = () => {
        const g = val(el, 'g'), fx = val(el, 'fx'), op = val(el, 'op');
        setO(el, 'g', pct(g)); setO(el, 'fx', (fx > 0 ? '+' : '') + fx + '%'); setO(el, 'op', op + '%');
        const ex = 1.8 * g - .5 * fx, contrib = ex * op / 100;
        const items = [['Partner growth effect', 1.8 * g, 'fm-s'], ['Exchange rate effect', -.5 * fx, 'fs-s'], ['Export growth', ex, 'fa-s'], ['GDP contribution', contrib, 'fp-s']];
        const mid = 300, sc = 14;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 560 210" role="img" aria-label="Export effects"><line x1="${mid}" x2="${mid}" y1="10" y2="200" class="ax"/>
          ${items.map(([n, v, cl], i) => `<text class="dg-t" x="10" y="${38 + i * 46}">${n}</text><rect x="${v >= 0 ? mid : mid + v * sc}" y="${20 + i * 46}" width="${Math.abs(v * sc)}" height="28" class="${cl}" rx="3"/>
          <text class="lab-t" x="${v >= 0 ? mid + v * sc + 6 : mid + v * sc - 6}" y="${39 + i * 46}" text-anchor="${v >= 0 ? 'start' : 'end'}">${(v > 0 ? '+' : '') + fmt(v, 1)}%</text>`).join('')}</svg></div>`;
        setT(el, 'x', pct(ex)); setT(el, 'c', (contrib > 0 ? '+' : '') + fmt(contrib, 2) + ' pp');
        $('#v', el).className = 'verdict ' + (contrib >= 0 ? 'good' : 'bad');
        $('#v', el).innerHTML = contrib >= 0 ? 'Foreign demand is lifting the domestic economy.' : 'Weak foreign demand or a strong currency is dragging on domestic growth.';
        goal(el, 'Partners are in a 2% recession: find an exchange rate move that still keeps export growth positive.', g <= -2 && ex > 0);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Which is most likely to <b>reduce</b> a country\'s exports?', o: ['A boom in its main trading partners', 'A depreciation of its currency', 'An appreciation of its currency', 'A domestic recession'], a: 2, why: 'An appreciation makes the country\'s goods more expensive for foreigners. A domestic recession mainly lowers imports, not exports.' }],
  take: ['Exports follow trading partners\' cycles and the exchange rate.', 'Imports follow the domestic cycle.', 'Open economies import foreign booms and busts.']
});

const SCHOOLS = [
  { n: 'Neoclassical', who: 'ollie', cause: 'Real shocks, especially changes in technology. Markets clear and the economy returns to full employment on its own (Say\'s law: supply creates its own demand).', pol: 'No intervention needed; the cycle is self-correcting.' },
  { n: 'Austrian', who: 'penny', cause: 'Government intervention, especially central banks keeping interest rates artificially low. Cheap credit causes over-investment (malinvestment) in the wrong projects, which must eventually be liquidated.', pol: 'Avoid intervening. Let the bust clear out bad investments; do not keep rates artificially low.' },
  { n: 'Keynesian', who: 'cog', cause: 'Swings in aggregate demand, driven by business confidence ("animal spirits"). Wages are sticky downward, so a fall in AD can leave the economy stuck below full employment for a long time.', pol: 'Active fiscal policy, and monetary policy, to restore demand. "In the long run we are all dead."' },
  { n: 'Monetarist', who: 'penny', cause: 'Erratic changes in the money supply growth rate. Policy mistakes by central banks create booms and busts.', pol: 'Steady, predictable money supply growth in line with long-run growth. Avoid discretionary fine-tuning.' },
  { n: 'New Classical (RBC)', who: 'ollie', cause: 'Real business cycle theory: cycles are efficient responses of rational agents to real shocks (technology, resource prices). Unemployment is largely voluntary or frictional.', pol: 'Policy intervention is unnecessary or harmful; focus on long-run fundamentals.' },
  { n: 'New Keynesian', who: 'cog', cause: 'Real and nominal shocks, combined with sticky prices and wages caused by menu costs and contracts. Markets do not adjust instantly.', pol: 'Monetary and fiscal policy can help stabilise the economy while prices adjust.' }
];
lesson({

  take: ['Neoclassical and New Classical views: cycles are driven by real shocks and markets self-correct.', 'Keynesians: AD shocks plus sticky wages, so active policy is needed.', 'Monetarists blame erratic money growth; Austrians blame artificially low rates; New Keynesians use sticky prices to justify stabilisation.']
});

lesson({
  id: 'unemployment-types', title: 'Types of Unemployment', dur: '5:19', tags: 'frictional structural cyclical natural rate',
  hook: `Not all unemployment is the same. Someone between jobs, a coal miner whose mine closed forever, and a worker laid off in a recession all count as unemployed, but each needs a different fix.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-acc">F</div><h4>Frictional</h4><p>Time spent searching and matching: graduates looking for a first job, people switching jobs or moving cities. Short-term and unavoidable.</p></div>
    <div class="card"><div class="ic c-plu">S</div><h4>Structural</h4><p>A mismatch between workers' skills or location and the jobs available, caused by long-run changes such as technology or trade. Long-lasting; needs retraining.</p></div>
    <div class="card"><div class="ic c-cor">C</div><h4>Cyclical</h4><p>Caused by the business cycle. Rises in contractions when demand for output falls, and is negative at peaks.</p></div>
  </div>
  <div class="formula"><span class="lbl">The natural rate of unemployment</span>Natural rate = Frictional + Structural &nbsp;&nbsp; (the rate at full employment, when cyclical unemployment is zero)</div>
  ${W('ur')}
  ${W('ty')}`,
  widgets: {
    ur(el) {
      el.innerHTML = lab('Unemployment through the cycle', `<div class="plot" id="p"></div>${slider('nr', 'Natural rate (frictional + structural)', 3, 7, .5, 5)}`);
      const draw = () => {
        const nr = val(el, 'nr'); setO(el, 'nr', pct(nr));
        const u = t => nr - 2.2 * Math.sin(t / 2.2);
        const c = chart({ x: [0, 20], y: [0, 10], xl: 'Time', yl: 'Unemployment rate (%)', h: 260, yt: [0, 2, 4, 6, 8, 10], grid: true, label: 'Unemployment and natural rate' });
        const pts = []; for (let t = 0; t <= 20; t += .2) pts.push([t, u(t)]);
        c.poly([...pts, ...pts.map(p => [p[0], nr]).reverse()], 'fc');
        c.rect(0, 0, 20, nr * .4, 'fa').rect(0, nr * .4, 20, nr, 'fp');
        c.text(.4, nr * .2, 'Frictional', 'a', 0, 4).text(.4, nr * .7, 'Structural', 'p', 0, 4);
        c.hline(nr, 'l3 thin').line(pts, 'l2').text(20, nr, 'natural rate', 'm', -4, -8, 'end').text(3.4, u(3.4), 'cyclical > 0 (recession)', 'c', 0, -10, 'middle').text(10.4, u(10.4), 'cyclical < 0 (boom)', 'c', 0, 18, 'middle');
        $('#p', el).innerHTML = c.html();
      };
      el.addEventListener('input', draw); draw();
    },
    ty(el) {
      sorter(el, {
        title: 'Diagnose the unemployment', prompt: 'What type of unemployment is each person experiencing?',
        bins: ['Frictional', 'Structural', 'Cyclical'],
        items: [
          { t: 'A new graduate spends two months finding the right job', b: 0, why: 'Normal job search time.' },
          { t: 'A typesetter replaced by desktop publishing software', b: 1, why: 'Technology permanently removed the job; new skills are needed.' },
          { t: 'A car worker laid off because sales collapsed in a recession', b: 2, why: 'Caused by the fall in aggregate demand.' },
          { t: 'A nurse moves cities and is looking for a hospital post', b: 0, why: 'A temporary search gap.' },
          { t: 'A textile worker whose factory moved overseas', b: 1, why: 'A permanent structural shift from trade.' },
          { t: 'A construction worker idle because housing starts plunged in a downturn', b: 2, why: 'Tied to the cycle; jobs return when the economy recovers.' }
        ]
      }, 'cog');
    }
  },
  check: [{ q: 'The natural rate of unemployment includes…', o: ['Only cyclical unemployment', 'Frictional and structural unemployment', 'Frictional and cyclical unemployment', 'All three types'], a: 1, why: 'At full employment there is no cyclical unemployment; what remains is frictional plus structural.' }],
  take: ['Frictional: job search. Structural: skills or location mismatch. Cyclical: caused by the business cycle.', 'Natural rate = frictional + structural; at full employment, cyclical unemployment is zero.']
});

lesson({
  id: 'unemployment-measures', title: 'Measures of Unemployment', dur: '4:48', tags: 'labor force participation ratio discouraged workers underemployed',
  hook: `The unemployment rate seems simple: people without jobs. But who counts as "looking for work"? The definitions matter, and sometimes the rate falls for bad reasons.`,
  body: () => `
  <div class="formula"><span class="lbl">Definitions</span>Labour force = Employed + Unemployed (people without a job who are <b>actively seeking</b> one)<br>
  <b>Unemployment rate</b> = Unemployed ÷ Labour force<br><b>Participation ratio</b> = Labour force ÷ Working-age population</div>
  <div class="cards">
    <div class="card"><h4>Discouraged workers</h4><p>People who have given up looking. They leave the labour force, so they are <b>not counted</b> as unemployed.</p></div>
    <div class="card"><h4>Underemployed</h4><p>Working part-time but wanting full-time, or working below their skill level. Counted as <b>employed</b>.</p></div>
    <div class="card"><h4>Voluntarily unemployed</h4><p>Choosing not to work (early retirees, students). Outside the labour force.</p></div>
  </div>
  ${W('lf')}
  <div class="pit"><p>The unemployment rate is a <b>lagging</b> indicator. Early in a recovery, discouraged workers start looking again and re-enter the labour force, so the unemployment rate can <b>rise</b> even though the economy is improving.</p></div>`,
  widgets: {
    lf(el) {
      el.innerHTML = lab('The labour force tree', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('e', 'Employed (m)', 100, 160, 1, 140)}${slider('u', 'Unemployed, seeking work (m)', 2, 20, .5, 8)}${slider('o', 'Not in labour force (m)', 40, 100, 1, 70)}
        <button class="btn sm" type="button" id="dw">2m unemployed give up looking</button>
        <div class="readout">${ro('Unemployment rate', 'ur')}${ro('Participation ratio', 'pr')}</div><div class="verdict" id="v"></div></div></div>`);
      let note = '';
      const draw = () => {
        const e = val(el, 'e'), u = val(el, 'u'), o = val(el, 'o'), lf = e + u, pop = lf + o;
        setO(el, 'e', e); setO(el, 'u', u); setO(el, 'o', o);
        const box = (x, y, w, t, v, cl) => `<rect x="${x}" y="${y}" width="${w}" height="54" rx="10" class="dg-box" style="${cl ? 'stroke:var(--' + cl + ');stroke-width:2.5' : ''}"/><text class="dg-t" x="${x + w / 2}" y="${y + 23}" text-anchor="middle">${t}</text><text class="lab-t" x="${x + w / 2}" y="${y + 43}" text-anchor="middle">${fmt(v, 1)}m</text>`;
        const ln = (x1, y1, x2, y2) => `<path d="M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}" class="dg-arrow"/>`;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 560 270" role="img" aria-label="Labour force tree">
          ${ln(280, 64, 160, 104)}${ln(280, 64, 440, 104)}${ln(160, 158, 85, 198)}${ln(160, 158, 240, 198)}
          ${box(180, 10, 200, 'Working-age population', pop)}${box(60, 104, 200, 'Labour force', lf, 'accent')}${box(350, 104, 180, 'Not in labour force', o)}
          ${box(10, 198, 150, 'Employed', e, 'mint')}${box(175, 198, 150, 'Unemployed', u, 'coral')}</svg></div>`;
        setT(el, 'ur', pct(u / lf * 100)); setT(el, 'pr', pct(lf / pop * 100));
        $('#v', el).innerHTML = note || 'Unemployment rate = unemployed ÷ labour force. People outside the labour force are not in either number.';
        goal(el, 'Get the unemployment rate below 5% with a participation ratio above 70%.', u / lf < .05 && lf / pop > .7);
      };
      $('#dw', el).onclick = () => {
        const u = $('#u', el), o = $('#o', el);
        if (+u.value < 4) return;
        const before = val(el, 'u') / (val(el, 'e') + val(el, 'u')) * 100;
        u.value = +u.value - 2; o.value = +o.value + 2;
        const after = val(el, 'u') / (val(el, 'e') + val(el, 'u')) * 100;
        note = `<b>The unemployment rate fell</b> from ${pct(before)} to ${pct(after)}, yet nobody found a job. Discouraged workers left the labour force. The participation ratio fell too, which is the warning sign.`;
        $('#v', el).className = 'verdict warn'; draw();
      };
      el.addEventListener('input', () => { note = ''; $('#v', el).className = 'verdict'; draw(); }); draw();
    }
  },
  check: [{ q: 'Working-age population is 200m, employed 120m and unemployed 10m. The unemployment rate and participation ratio are…', o: ['5% and 60%', '7.7% and 65%', '8.3% and 65%', '7.7% and 60%'], a: 1, why: 'Labour force = 130m. Unemployment rate = 10/130 = 7.7%. Participation = 130/200 = 65%.' }],
  take: ['Unemployment rate = unemployed ÷ labour force; participation ratio = labour force ÷ working-age population.', 'Discouraged workers drop out of the labour force, which can flatter the unemployment rate.', 'Unemployment is a lagging indicator.']
});

lesson({
  id: 'inflation', title: 'Inflation', dur: '4:29', host: 'penny', tags: 'deflation disinflation hyperinflation price level',
  hook: `Hi, I'm <b>Penny</b>! Inflation is about me: it's how much less I can buy each year. Let's get the vocabulary straight first, because four similar-sounding words mean very different things.`,
  body: () => `
  <div class="idea"><p><b>Inflation</b> is a persistent increase in the overall price level over time. The <b>inflation rate</b> is the percentage change in a price index.</p></div>
  <div class="cards">
    <div class="card"><div class="ic c-cor">↑</div><h4>Inflation</h4><p>Prices rising: the inflation rate is positive.</p></div>
    <div class="card"><div class="ic c-sun">↘</div><h4>Disinflation</h4><p>The inflation rate is <b>falling</b> but still positive. Prices still rise, just more slowly.</p></div>
    <div class="card"><div class="ic c-acc">↓</div><h4>Deflation</h4><p>The price level is <b>falling</b>: the inflation rate is negative. Dangerous because it raises the real burden of debt and encourages people to delay spending.</p></div>
    <div class="card"><div class="ic c-plu">↑↑</div><h4>Hyperinflation</h4><p>Extremely rapid, accelerating inflation, often 50%+ per month. Usually caused by printing money to fund government deficits.</p></div>
  </div>
  ${W('inf')}
  ${say('penny', 'The most common mix-up: <b>disinflation is not deflation</b>. If inflation drops from 6% to 2%, prices are still rising, just more slowly.', 'wow')}`,
  widgets: {
    inf(el) {
      el.innerHTML = lab('Price level versus inflation rate', `<p class="hint-line">Set inflation in years 1–5 and years 6–10. The widget names what happened in the second period.</p>
        <div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('a', 'Inflation, years 1–5', -4, 30, .5, 6)}${slider('b', 'Inflation, years 6–10', -4, 30, .5, 2)}
        <div class="verdict" id="v"></div></div></div>`);
      const draw = () => {
        const a = val(el, 'a'), b = val(el, 'b'); setO(el, 'a', pct(a)); setO(el, 'b', pct(b));
        const P = [100]; for (let t = 1; t <= 10; t++) P.push(P[t - 1] * (1 + (t <= 5 ? a : b) / 100));
        const mx = Math.max(...P) * 1.08, mn = Math.min(80, Math.min(...P) * .95);
        const c = chart({ x: [0, 10], y: [mn, mx], xl: 'Year', yl: 'Price level (CPI)', xt: [0, 2, 4, 6, 8, 10], h: 300, label: 'Price level path' });
        c.vline(5, 'guide', mn, mx).line(P.map((p, i) => [i, p]), 'l2');
        P.forEach((p, i) => c.dot(i, p, 'c', 3.5));
        c.text(2.5, mx, `${pct(a)} a year`, 'mu', 0, 18, 'middle').text(7.5, mx, `${pct(b)} a year`, 'mu', 0, 18, 'middle');
        $('#p', el).innerHTML = c.html();
        let m, cl = '';
        if (b < 0) { m = '<b>Deflation.</b> The price level is falling.'; cl = 'warn'; }
        else if (b > 25) { m = '<b>Very high inflation</b>, heading toward hyperinflation territory. Money loses value fast.'; cl = 'bad'; }
        else if (b < a) { m = '<b>Disinflation.</b> Inflation fell from ' + pct(a) + ' to ' + pct(b) + ', but prices are still rising.'; cl = 'good'; }
        else if (b > a) { m = '<b>Accelerating inflation.</b> The rate of price increase is rising.'; cl = 'bad'; }
        else m = 'Steady inflation.';
        $('#v', el).className = 'verdict ' + cl; $('#v', el).innerHTML = m;
        goal(el, 'Create disinflation in years 6–10: inflation falls but stays positive.', b > 0 && b < a && b <= 25);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Inflation falls from 5% to 1.5%. This is best described as…', o: ['Deflation', 'Disinflation', 'Hyperinflation', 'Stagflation'], a: 1, why: 'Inflation is still positive but lower, which is disinflation. Deflation would require a negative rate.' }],
  take: ['Inflation: rising price level. Disinflation: inflation falling but positive.', 'Deflation: falling price level. Hyperinflation: extremely rapid inflation.']
});

lesson({
  id: 'inflation-indexes', title: 'Indexes Used to Measure Inflation', dur: '7:33', host: 'penny', tags: 'cpi ppi laspeyres paasche fisher basket core headline',
  hook: `To measure inflation we track the cost of a <b>basket</b> of goods over time. But which basket? Last year's, this year's, or a mix? Each choice gives a slightly different number.`,
  body: () => `
  <div class="formula"><span class="lbl">Three index formulas</span>
  <b>Laspeyres</b> (base-period basket) = Σ P<sub>t</sub>Q<sub>0</sub> ÷ Σ P<sub>0</sub>Q<sub>0</sub> × 100 &nbsp;&nbsp; used by most CPIs<br>
  <b>Paasche</b> (current basket) = Σ P<sub>t</sub>Q<sub>t</sub> ÷ Σ P<sub>0</sub>Q<sub>t</sub> × 100<br>
  <b>Fisher</b> = √(Laspeyres × Paasche)</div>
  ${W('cpi')}
  <div class="cards">
    <div class="card"><h4>CPI</h4><p>Consumer Price Index: the basket urban households typically buy.</p></div>
    <div class="card"><h4>PPI / WPI</h4><p>Producer or wholesale prices. Often a leading signal for CPI because input costs pass through to consumers.</p></div>
    <div class="card"><h4>Headline vs core</h4><p><b>Headline</b> includes everything. <b>Core</b> excludes volatile food and energy to show the underlying trend. Central banks watch core closely.</p></div>
    <div class="card"><h4>PCE deflator</h4><p>A broader consumer price measure with changing weights, favoured by the US Federal Reserve.</p></div>
  </div>`,
  widgets: {
    cpi(el) {
      const G = [{ n: 'Bread', p0: 2, q0: 50 }, { n: 'Petrol', p0: 1.5, q0: 80 }, { n: 'Streaming', p0: 10, q0: 6 }];
      el.innerHTML = lab('Build your own price index', `<p class="hint-line">Base year: bread $2 × 50, petrol $1.50 × 80, streaming $10 × 6. Change this year's prices and quantities.</p>
        <div class="lab-grid"><div class="ctls">${G.map((g, i) => slider('p' + i, g.n + ' price now', g.p0 * .5, g.p0 * 2, g.p0 / 20, g.p0 * [1.1, 1.5, 1][i]) + slider('q' + i, g.n + ' quantity now', g.q0 * .4, g.q0 * 1.6, g.q0 / 20, g.q0 * [1, .8, 1.1][i])).join('')}</div>
        <div class="ctls"><div class="plot" id="p"></div><div class="readout">${ro('Laspeyres', 'L')}${ro('Paasche', 'P')}${ro('Fisher', 'F')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> make petrol much more expensive and let people buy less of it. Laspeyres, which ignores substitution, shows the highest inflation.</p>`);
      const draw = () => {
        const p = G.map((g, i) => val(el, 'p' + i)), q = G.map((g, i) => val(el, 'q' + i));
        G.forEach((g, i) => { setO(el, 'p' + i, '$' + fmt(p[i], 2)); setO(el, 'q' + i, fmt(q[i], 0)); });
        const sum = (P, Q) => P.reduce((s, v, i) => s + v * Q[i], 0);
        const p0 = G.map(g => g.p0), q0 = G.map(g => g.q0);
        const L = sum(p, q0) / sum(p0, q0) * 100, Pa = sum(p, q) / sum(p0, q) * 100, F = Math.sqrt(L * Pa);
        setT(el, 'L', fmt(L, 1)); setT(el, 'P', fmt(Pa, 1)); setT(el, 'F', fmt(F, 1));
        const vals = [['Laspeyres', L, 'fc-s'], ['Fisher', F, 'fs-s'], ['Paasche', Pa, 'fa-s']];
        const mn = Math.min(90, ...vals.map(v => v[1])) - 5, mx = Math.max(...vals.map(v => v[1])) + 5;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 320 150" role="img" aria-label="Index comparison">${vals.map(([n, v, cl], i) => {
          const w = (v - mn) / (mx - mn) * 200; return `<text class="dg-t" x="8" y="${34 + i * 42}">${n}</text><rect x="90" y="${16 + i * 42}" width="${Math.max(2, w)}" height="26" class="${cl}" rx="3"/><text class="lab-t" x="${96 + w}" y="${34 + i * 42}">${fmt(v, 1)}</text>`;
        }).join('')}</svg></div>`;
        $('#v', el).innerHTML = `Measured inflation: Laspeyres <b>${pct(L - 100)}</b>, Paasche <b>${pct(Pa - 100)}</b>. ${L > Pa + .2 ? 'Laspeyres is higher because it keeps the old basket and ignores that people switched away from goods that got pricier.' : 'The indexes are close because quantities changed little.'}`;
        goal(el, 'Open a gap of at least 2 index points between Laspeyres and Paasche.', L - Pa >= 2);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'A price index that uses a fixed basket from the base period is a…', o: ['Paasche index', 'Laspeyres index', 'Fisher index', 'Chained index'], a: 1, why: 'Laspeyres weights prices by base-period quantities. Most consumer price indexes are of this type.' }],
  take: ['Laspeyres uses the base basket; Paasche uses the current basket; Fisher is their geometric mean.', 'Core inflation excludes food and energy; headline includes them.', 'PPI and WPI measure producer prices and can foreshadow CPI.']
});

lesson({
  id: 'inflation-limits', title: 'Uses and Limitations of Inflation Measures', dur: '5:26', host: 'penny', tags: 'substitution bias quality bias new product bias hedonic chained',
  hook: `Official inflation is used to adjust pensions, wages and bond payments. So if it's measured wrongly, real money moves. And the standard index tends to <b>overstate</b> inflation. Here's why.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-cor">1</div><h4>Substitution bias</h4><p>When beef gets pricey, people buy more chicken. A fixed basket ignores this switch, so it overstates the cost of living. <b>Fix:</b> chained indexes that update weights often.</p></div>
    <div class="card"><div class="ic c-sun">2</div><h4>Quality bias</h4><p>A $1,000 phone today is far better than a $1,000 phone five years ago. Part of the price rise is really better quality. <b>Fix:</b> hedonic pricing, which adjusts for quality.</p></div>
    <div class="card"><div class="ic c-plu">3</div><h4>New product bias</h4><p>New goods (once smartphones, now new services) enter the basket late, missing their early price falls. <b>Fix:</b> update the basket more often.</p></div>
  </div>
  ${W('b')}
  <h3>Who uses inflation measures?</h3>
  <ul><li><b>Central banks</b>: to set policy against an inflation target.</li><li><b>Governments</b>: to index pensions, benefits and tax brackets.</li><li><b>Investors</b>: inflation-linked bonds pay according to CPI.</li><li><b>Businesses and workers</b>: wage negotiations and long-term contracts.</li></ul>`,
  widgets: {
    b(el) {
      el.innerHTML = lab('From measured to "true" inflation', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('m', 'Measured CPI inflation', 0, 8, .1, 3)}${slider('s', 'Substitution bias', 0, .8, .05, .35)}${slider('q', 'Quality bias', 0, .8, .05, .4)}${slider('n', 'New product bias', 0, .5, .05, .15)}
        <div class="readout">${ro('Total bias', 'tb')}${ro('Estimated true inflation', 'ti')}</div><div class="verdict" id="v"></div></div></div>`);
      const draw = () => {
        const m = val(el, 'm'), s = val(el, 's'), q = val(el, 'q'), n = val(el, 'n');
        ['m', 's', 'q', 'n'].forEach(k => setO(el, k, fmt(val(el, k), 2) + (k === 'm' ? '%' : ' pp')));
        const t = m - s - q - n, sc = 60;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 560 160" role="img" aria-label="Bias decomposition">
          <text class="dg-t" x="10" y="40">Measured</text><rect x="110" y="22" width="${m * sc}" height="28" class="fc-s" rx="3"/>
          <text class="dg-t" x="10" y="100">True + biases</text>
          <rect x="110" y="82" width="${Math.max(0, t) * sc}" height="28" class="fm-s" rx="3"/>
          <rect x="${110 + Math.max(0, t) * sc}" y="82" width="${s * sc}" height="28" class="fs-s"/>
          <rect x="${110 + (Math.max(0, t) + s) * sc}" y="82" width="${q * sc}" height="28" class="fp-s"/>
          <rect x="${110 + (Math.max(0, t) + s + q) * sc}" y="82" width="${n * sc}" height="28" class="fa-s"/>
          <text class="dg-s" x="110" y="140">green = true inflation · yellow = substitution · purple = quality · blue = new products</text></svg></div>`;
        setT(el, 'tb', fmt(s + q + n, 2) + ' pp'); setT(el, 'ti', pct(t, 2));
        $('#v', el).innerHTML = `A pension indexed to measured CPI rises ${pct(m, 1)} a year, but the true cost of living rises only about ${pct(t, 2)}. Over 20 years that gap compounds to <b>${pct(((1 + m / 100) ** 20 / (1 + t / 100) ** 20 - 1) * 100, 0)}</b>.`;
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Hedonic pricing is designed to correct which bias?', o: ['Substitution bias', 'Quality bias', 'New product bias', 'Base-year bias'], a: 1, why: 'Hedonic pricing separates the part of a price change that reflects better quality from pure inflation.' }],
  take: ['Fixed-basket indexes overstate inflation through substitution, quality and new-product biases.', 'Fixes: chained indexes, hedonic adjustment, frequent basket updates.', 'Inflation measures drive policy, indexation and inflation-linked bonds.']
});

lesson({
  id: 'cost-push-demand-pull', title: 'Cost-push and Demand-pull Inflation', dur: '9:05', host: 'penny', tags: 'wage push nairu unit labor cost wage price spiral',
  hook: `Prices can be <b>pulled</b> up by too much spending, or <b>pushed</b> up by rising costs. On the AD-AS graph, one is an AD story and the other is an AS story.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-acc">D</div><h4>Demand-pull</h4><p>AD grows faster than potential output: too much money chasing too few goods. Output rises above potential and prices climb. If it persists, wages chase prices and SRAS shifts left too.</p></div>
    <div class="card"><div class="ic c-cor">C</div><h4>Cost-push</h4><p>Rising input costs, such as wages (<b>wage-push</b>) or commodity prices, shift SRAS left. Prices rise <b>and</b> output falls.</p></div>
  </div>
  ${W('ip')}
  <h2>Supply-chain shocks: when cost-push persists</h2>
  ${say('kip', 'I know this one from the inside. In 2021–22 I sat outside ports for weeks. Shipping rates rose several-fold, chips ran short, and factories everywhere waited for parts. That was cost-push inflation, and it lasted far longer than an oil spike.', 'sad')}
  <div class="cards">
    <div class="card"><h4>Bottlenecks</h4><p>When one link fails (a port, a chip plant, a canal), every firm downstream faces higher costs or can't produce at all. SRAS shifts left.</p></div>
    <div class="card"><h4>Persistence</h4><p>Rebuilding capacity, rerouting shipping and finding new suppliers takes months or years, so the shock repeats round after round instead of fading.</p></div>
    <div class="card"><h4>Policy dilemma</h4><p>Raising interest rates doesn't make more ships or chips. Central banks must judge whether the shock will fade by itself or feed into wages and expectations.</p></div>
    <div class="card"><h4>Response: resilience</h4><p>Firms and governments respond with <b>nearshoring</b> and <b>friendshoring</b>, which you'll meet in Unit 6. They trade some efficiency for safer supply.</p></div>
  </div>
  <h2>Watching for inflation pressure</h2>
  <div class="formula"><span class="lbl">Unit labour cost</span><b>ULC</b> = Total labour compensation per hour ÷ Output per hour (labour productivity)</div>
  <p>If wages grow faster than productivity, ULC rises and firms pass the cost on as higher prices. Other signals: unemployment below the <b>NAIRU</b> (the non-accelerating inflation rate of unemployment), high capacity utilisation, and, for monetarists, fast money supply growth.</p>
  ${W('ulc')}`,
  widgets: {
    ip(el) {
      el.innerHTML = lab('Run the inflation story', `${segHTML('m', ['Demand-pull', 'Cost-push', 'Supply-chain shock'])}<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        <button class="btn sm pri" type="button" id="nx">Next round</button><button class="btn sm" type="button" id="rs">Reset</button>
        <div class="readout">${ro('Round', 'rd')}${ro('Price level', 'pl')}${ro('Real GDP', 'y')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> step through four rounds of each story. Compare where output and the price level end up.</p>`, 'Try it', 'Run the supply-chain story to round 4 and compare its final price level with the cost-push story.');
      let mode = 0, r = 0;
      const steps = [
        ['Start: long-run equilibrium at potential output.', 'Start: long-run equilibrium at potential output.'],
        ['Spending surges: <b>AD shifts right</b>. Output above potential, prices up.', 'Oil prices jump: <b>SRAS shifts left</b>. Prices up, output down: stagflation.'],
        ['Workers demand higher wages to keep up with prices: <b>SRAS shifts left</b>.', 'Workers demand compensation for higher prices: <b>SRAS shifts left again</b>.'],
        ['If AD keeps rising (e.g. money growth), the cycle repeats: a <b>wage-price spiral</b>.', 'If the central bank accommodates with more money, <b>AD shifts right</b>, prices rise further.'],
        ['Prices keep ratcheting up while output returns to potential. Persistent demand-pull inflation needs persistent AD growth.', 'Output is back near potential but at a much higher price level. Cost-push alone gives one-off price jumps unless accommodated.']
      ];
      ['Start: long-run equilibrium at potential output.',
       'A port shutdown and a chip shortage hit at once: <b>SRAS shifts left</b>. Prices up, output down.',
       'Shortages ripple along supply chains (shipping, components, energy): costs keep rising and <b>SRAS shifts left again</b>.',
       'Firms pay up for scarce inputs and hold bigger buffers. Unlike a one-off oil spike, the shock is <b>persistent</b>.',
       'Supply chains slowly heal: <b>SRAS drifts back right</b>. Output recovers, but the price level stays well above where it started.'].forEach((t, i) => steps[i].push(t));
      const path = mode => {
        const ad = [0, 0, 0, 0, 0], sr = [0, 0, 0, 0, 0];
        if (mode === 0) { [0, 1.8, 1.8, 3.6, 3.6].forEach((v, i) => ad[i] = v); [0, 0, -1.8, -1.8, -3.6].forEach((v, i) => sr[i] = v); }
        else if (mode === 2) { [0, -1.2, -2.0, -2.4, -1.0].forEach((v, i) => sr[i] = v); }
        else { [0, 0, 0, 1.6, 2.4].forEach((v, i) => ad[i] = v); [0, -1.6, -2.4, -2.4, -2.4].forEach((v, i) => sr[i] = v); }
        return { ad, sr };
      };
      const draw = () => {
        const { ad, sr } = path(mode);
        const c = chart({ x: [0, 12], y: [0, 16], xl: 'Real GDP', yl: 'Price level', label: 'Inflation story' });
        c.xtick(6, 'Y*').vline(6, 'l3', .5, 15.5).text(6, 15.5, 'LRAS', 'm', 6, 6);
        const pts = [];
        for (let i = 0; i <= r; i++) { const p = meet(10.8 + ad[i], -.8, 1.2 - sr[i], .8); pts.push(p); }
        if (r > 0) { c.fn(y => 10.8 - .8 * y, 'ghost', 1, 12); c.fn(y => 1.2 + .8 * y, 'ghost', 0, 12); }
        c.fn(y => 10.8 + ad[r] - .8 * y, 'l1', 1, 12).text(11.5, 10.8 + ad[r] - .8 * 11.5, 'AD', 'a', 0, -10, 'end');
        c.fn(y => 1.2 - sr[r] + .8 * y, 'l2', 0, 12).text(Math.min(11.4, (15.4 - 1.2 + sr[r]) / .8), Math.min(15.4, 1.2 - sr[r] + .8 * 11.4), 'SRAS', 'c', -4, -8, 'end');
        c.line(pts, 'l4 thin', 'stroke-dasharray="3 4"');
        pts.forEach((p, i) => c.dot(p[0], p[1], i === r ? 's' : '', i === r ? 7 : 4));
        $('#p', el).innerHTML = c.html();
        const [Y, P] = pts[r];
        setT(el, 'rd', r + ' / 4'); setT(el, 'pl', fmt(P / 6 * 100, 0)); setT(el, 'y', (Y >= 6 ? '+' : '') + pct((Y - 6) / 6 * 100) + ' vs Y*');
        $('#v', el).innerHTML = steps[r][mode];
        goalSet(el, mode === 2 && r === 4);
      };
      segBind(el, 'm', i => { mode = i; r = 0; draw(); });
      $('#nx', el).onclick = () => { r = Math.min(4, r + 1); draw(); };
      $('#rs', el).onclick = () => { r = 0; draw(); };
      draw();
    },
    ulc(el) {
      el.innerHTML = lab('Unit labour cost calculator', `<div class="lab-grid"><div class="ctls">${slider('wg', 'Wage growth per year', 0, 10, .25, 4)}${slider('pg', 'Productivity growth per year', -1, 5, .25, 1.5)}</div>
        <div class="ctls"><div class="readout">${ro('ULC growth', 'u')}</div><div class="verdict" id="v"></div></div></div>`, 'Calc');
      const draw = () => {
        const w = val(el, 'wg'), p = val(el, 'pg'); setO(el, 'wg', pct(w, 2)); setO(el, 'pg', pct(p, 2));
        const u = ((1 + w / 100) / (1 + p / 100) - 1) * 100; setT(el, 'u', pct(u, 2));
        $('#v', el).className = 'verdict ' + (u > 2.5 ? 'bad' : u < 0 ? 'good' : '');
        $('#v', el).innerHTML = u > 2.5 ? 'Wages are outpacing productivity. Rising unit costs signal <b>cost-push pressure</b>.' : u < 0 ? 'Productivity is outpacing wages. Unit costs are falling.' : 'Unit costs are rising modestly, roughly consistent with low, stable inflation.';
        goal(el, 'Keep unit labour cost growth at 2% or less even with 5% wage growth.', w >= 5 && u <= 2);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Which feature makes a supply-chain shock harder for a central bank to handle than a demand-pull boom?', o: ['It raises output above potential', 'Higher interest rates cannot create missing ships or chips, yet prices and output move in opposite directions', 'It lowers the price level', 'It only affects exports'], a: 1, why: 'A cost-push shock pushes prices up and output down. Tightening fights the inflation but deepens the slump, and it does nothing to fix the bottleneck itself.' }, { q: 'Wages rise 5% while labour productivity rises 1%. Unit labour costs rise about…', o: ['6%', '5%', '4%', '1%'], a: 2, why: 'ULC growth ≈ wage growth − productivity growth = 5% − 1% = 4%, which points to cost-push inflation pressure.' }],
  take: ['Demand-pull: AD outruns potential output. Cost-push: input costs shift SRAS left.', 'Supply-chain bottlenecks act as persistent cost-push shocks that monetary policy can\'t directly fix.', 'A wage-price spiral can turn a one-off shock into persistent inflation.', 'Watch ULC, unemployment versus NAIRU, capacity utilisation and money growth.']
});

lesson({
  id: 'economic-indicators', title: 'Types of Economic Indicators', dur: '3:49', tags: 'leading coincident lagging indicators yield spread building permits',
  hook: `Forecasters want to know where the cycle is heading <b>before</b> it gets there. Some data series move ahead of the economy, some move with it, and some only confirm the turn afterwards.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-min">L</div><h4>Leading</h4><p>Turn <b>before</b> the economy. Used to predict.</p><ul><li>Average weekly hours in manufacturing</li><li>Initial unemployment claims</li><li>New orders for goods</li><li>Building permits</li><li>Stock prices</li><li>Interest rate spread (10-year minus short rate)</li><li>Consumer expectations</li></ul></div>
    <div class="card"><div class="ic c-acc">C</div><h4>Coincident</h4><p>Move <b>with</b> the economy. Tell you where you are now.</p><ul><li>Employees on non-farm payrolls</li><li>Real personal income less transfers</li><li>Industrial production</li><li>Manufacturing and trade sales</li></ul></div>
    <div class="card"><div class="ic c-cor">Lg</div><h4>Lagging</h4><p>Turn <b>after</b> the economy. Confirm the trend.</p><ul><li>Average duration of unemployment</li><li>Inventory-to-sales ratio</li><li>Change in unit labour costs</li><li>Average bank prime rate</li><li>Commercial and industrial loans outstanding</li><li>Consumer credit to income ratio</li><li>CPI for services</li></ul></div>
  </div>
  ${W('lag')}
  ${W('ind')}`,
  widgets: {
    lag(el) {
      el.innerHTML = lab('See the timing', `<div class="plot" id="p"></div><div class="chips" id="c"><button type="button" class="chip on" data-i="0">Leading</button><button type="button" class="chip on" data-i="1">Coincident</button><button type="button" class="chip on" data-i="2">Lagging</button></div>`);
      const on = [1, 1, 1];
      const draw = () => {
        const c = chart({ x: [0, 20], y: [-1.6, 1.8], xl: 'Time', yl: 'Indicator (standardised)', h: 260, label: 'Indicator timing' });
        const cls = ['l3', 'l1', 'l2'], nm = ['Leading', 'Coincident', 'Lagging'], sh = [-1.6, 0, 1.6];
        c.vline(4.71 + 0, 'guide', -1.6, 1.8).text(4.71, 1.8, 'peak', 'mu', 0, 14, 'middle').vline(14.14, 'guide', -1.6, 1.8).text(14.14, 1.8, 'trough', 'mu', 0, 14, 'middle');
        [0, 1, 2].forEach(i => { if (on[i]) { c.fn(t => Math.sin((t - sh[i]) / 3), cls[i], 0, 20); c.text(sh[i] + 4.71, 1, nm[i], ['m', 'a', 'c'][i], 0, -10, 'middle'); } });
        $('#p', el).innerHTML = c.html();
      };
      $('#c', el).addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; const i = +b.dataset.i; on[i] = !on[i]; b.classList.toggle('on', !!on[i]); draw(); });
      draw();
    },
    ind(el) {
      sorter(el, {
        title: 'Leading, coincident or lagging?', prompt: 'Classify each indicator.',
        bins: ['Leading', 'Coincident', 'Lagging'],
        items: [
          { t: 'Building permits for new houses', b: 0, why: 'Permits come before construction activity.' },
          { t: 'Industrial production', b: 1, why: 'Measures current output.' },
          { t: 'Average duration of unemployment', b: 2, why: 'Stays high well after recovery begins.' },
          { t: 'S&P 500 stock index', b: 0, why: 'Markets price in expected future earnings.' },
          { t: 'Inventory-to-sales ratio', b: 2, why: 'Peaks after the downturn starts.' },
          { t: 'Non-farm payroll employment', b: 1, why: 'Tracks current activity.' },
          { t: 'Initial claims for unemployment insurance', b: 0, why: 'Rises early as firms start laying off.' },
          { t: 'Average bank prime lending rate', b: 2, why: 'Banks adjust rates after the cycle turns.' },
          { t: 'Yield spread: 10-year bond minus short rate', b: 0, why: 'A flattening or inverted curve has historically preceded recessions.' }
        ]
      }, 'cog');
    }
  },
  check: [{ q: 'Which is a <b>leading</b> economic indicator?', o: ['Average duration of unemployment', 'Industrial production', 'New orders for consumer goods', 'Change in unit labour costs'], a: 2, why: 'New orders come before production. Duration of unemployment and ULC are lagging; industrial production is coincident.' }],
  take: ['Leading indicators predict turns; coincident ones confirm the present; lagging ones confirm the past.', 'Examples: building permits and yield spread (leading), payrolls and industrial production (coincident), unemployment duration (lagging).']
});

lesson({

    { q: 'Which statement about the business cycle is most accurate?', o: ['Cycles are regular and periodic', 'Cycles recur but vary in duration and intensity', 'Cycles last exactly 7 years', 'Expansions and contractions are equally long'], a: 1, why: 'Cycles are recurrent but not periodic. (Business cycle phases)' },
    { q: 'At the beginning of a recovery, the inventory-to-sales ratio typically…', o: ['Rises sharply', 'Falls as sales pick up faster than production', 'Stays constant', 'Becomes negative'], a: 1, why: 'Sales recover before production catches up, so the ratio falls. (Resource use)' },
    { q: 'The Austrian school attributes business cycles mainly to…', o: ['Technology shocks', 'Sticky wages', 'Government intervention that keeps interest rates artificially low', 'Erratic money supply growth'], a: 2, why: 'Austrians blame artificially low rates causing malinvestment. (Theories)' },
    { q: 'A worker loses her job because automation made her skills obsolete. This is…', o: ['Frictional', 'Structural', 'Cyclical', 'Voluntary'], a: 1, why: 'A long-term mismatch between skills and available jobs. (Types of unemployment)' },

    { q: 'Failing to account for better-quality smartphones causes CPI to…', o: ['Understate inflation', 'Overstate inflation', 'Measure inflation accurately', 'Measure only core inflation'], a: 1, why: 'Quality bias: part of the price rise is better quality. (Uses and limitations)' },
    { q: 'Global shipping bottlenecks raise input costs month after month. On the AD-AS graph this is best shown as…', o: ['AD shifting right', 'Repeated leftward shifts of SRAS', 'LRAS shifting right', 'A movement along SRAS'], a: 1, why: 'Persistent supply-chain problems are cost-push shocks that keep shifting SRAS left. (Cost-push and demand-pull)' },
    { q: 'Which is a lagging indicator?', o: ['Building permits', 'Stock prices', 'Average bank prime rate', 'Average weekly hours in manufacturing'], a: 2, why: 'The prime rate changes after the economy has turned. (Economic indicators)' }
  ]
});

unit({ id: 'u4', title: 'Money, banking & monetary policy', short: 'Money & banking', host: 'penny', blurb: 'What money is, how banks create it, how central banks steer the economy, digital money and CBDCs, QE and QT, and where monetary policy\'s power ends.' });

lesson({
  id: 'policy-intro', title: 'Introduction to Monetary and Fiscal Policy', dur: '3:23', tags: 'monetary fiscal policy central bank government levers',
  hook: `Hi, I'm <b>Penny</b>! The economy has two big steering wheels. The <b>central bank</b> holds one: money and interest rates. That's this unit. The <b>government</b> holds the other: spending and taxes, which get their own unit next. Both work mainly by shifting aggregate demand.`,
  body: () => `
  <div class="compare cards">
    <div class="card"><div class="ic c-sun">M</div><h4>Monetary policy</h4><p>Run by the <b>central bank</b>. Changes the money supply and interest rates to influence spending, inflation and output.</p></div>
    <div class="card"><div class="ic c-acc">F</div><h4>Fiscal policy</h4><p>Run by the <b>government</b>. Uses taxation and spending to influence the economy and to redistribute income.</p></div>
  </div>
  ${W('lv')}
  <div class="idea"><p><b>Expansionary</b> policy shifts AD right to fight recessions; <b>contractionary</b> policy shifts AD left to fight inflation.</p></div>
  <h2>The road through this unit</h2>
  <p>We follow the monetary lever all the way: what money is (including digital money and CBDCs), how banks create it, how its demand and supply set interest rates, what central banks aim for, the tools they use, how a rate change reaches your groceries, and where their power runs out (QE and QT). Fiscal policy gets the full treatment in Unit 5.</p>`,
  widgets: {
    lv(el) {
      el.innerHTML = lab('Pull a lever', `<div class="chips" id="c">
        <button type="button" class="chip" data-a="1.8" data-t="Central bank <b>cuts interest rates</b>: borrowing gets cheaper, investment and consumption rise, AD shifts right.">Cut interest rates</button>
        <button type="button" class="chip" data-a="-1.8" data-t="Central bank <b>raises interest rates</b>: borrowing gets dearer, spending cools, AD shifts left and inflation pressure eases.">Raise interest rates</button>
        <button type="button" class="chip" data-a="2" data-t="Government <b>raises spending</b>: G rises directly, plus a multiplier effect. AD shifts right.">Increase spending</button>
        <button type="button" class="chip" data-a="-1.6" data-t="Government <b>raises taxes</b>: disposable income falls, consumption drops, AD shifts left.">Raise taxes</button></div>
        <div class="lab-grid"><div class="plot" id="p"></div><div class="verdict" id="v">Choose a policy action.</div></div>`, 'Lab');
      let a = 0;
      const draw = () => {
        const c = chart({ x: [0, 12], y: [0, 12], xl: 'Real GDP', yl: 'Price level', label: 'Policy and AD' });
        c.xtick(6, 'Y*').vline(6, 'l3', .5, 11.5).text(6, 11.5, 'LRAS', 'm', 6, 6).fn(y => 1.2 + .8 * y, 'l2', 0, 12).text(11.2, 10.16, 'SRAS', 'c', -4, -8, 'end');
        if (a) c.fn(y => 10.8 - .8 * y, 'ghost', 1, 12);
        c.fn(y => 10.8 + a - .8 * y, 'l1', 1, 12).text(11.6, 10.8 + a - .8 * 11.6, 'AD', 'a', 0, -10, 'end');
        const [Y, P] = meet(10.8 + a, -.8, 1.2, .8); c.guide(Y, P).dot(Y, P, 's', 7);
        $('#p', el).innerHTML = c.html();
      };
      $('#c', el).addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; $$('.chip', el).forEach(x => x.classList.toggle('on', x === b)); a = +b.dataset.a; $('#v', el).innerHTML = b.dataset.t; draw(); });
      draw();
    }
  },
  check: [{ q: 'Which is an example of contractionary fiscal policy?', o: ['Cutting the policy interest rate', 'Raising income taxes', 'Buying government bonds in the open market', 'Increasing infrastructure spending'], a: 1, why: 'Higher taxes reduce disposable income and AD. Rate cuts and bond purchases are monetary, and expansionary.' }],
  take: ['Monetary policy: central bank, money and interest rates.', 'Fiscal policy: government, taxes and spending.', 'Both mainly work by shifting aggregate demand.']
});

lesson({
  id: 'money-functions', title: 'Functions of Money', dur: '2:43', tags: 'medium of exchange unit of account store of value barter double coincidence',
  hook: `Imagine a world without me. You have eggs and want shoes. You'd need to find a shoemaker who wants eggs right now. Good luck! That problem is why money exists.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-sun">1</div><h4>Medium of exchange</h4><p>Accepted in payment for goods and services, so you avoid the <b>double coincidence of wants</b> that barter requires.</p></div>
    <div class="card"><div class="ic c-acc">2</div><h4>Unit of account</h4><p>A common measure of value. Every price is quoted in one unit, so comparisons are easy.</p></div>

lesson({

lesson({
  id: 'money-creation', title: 'The Money Creation Process', dur: '3:59', tags: 'fractional reserve banking money multiplier reserve requirement',
  hook: `Here's a secret: most money isn't printed. It's created by ordinary banks when they lend. Deposit $1,000 and, through a chain of loans, the banking system can turn it into much more.`,
  body: () => `
  <div class="steps"><ol>
    <li>You deposit $1,000. The bank must keep a fraction as <b>reserves</b> (say 10%) and can lend out the rest: $900.</li>
    <li>The borrower spends the $900, and it gets deposited in another bank. That bank keeps $90 and lends $810.</li>
    <li>The process repeats, each round smaller. Total new deposits approach $1,000 ÷ 0.10 = $10,000.</li>
  </ol></div>
  <div class="formula"><span class="lbl">Money multiplier</span><b>Money multiplier = 1 ÷ Reserve requirement</b> &nbsp;&nbsp;&nbsp; Total deposits = Initial deposit × multiplier</div>
  ${W('mc')}
  <div class="pit"><p>The real-world multiplier is smaller: people hold some cash instead of redepositing it, and banks may keep <b>excess reserves</b> when they are worried about lending.</p></div>`,
  widgets: {
    mc(el) {
      el.innerHTML = lab('Banking system simulator', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('d', 'Initial deposit ($)', 100, 5000, 100, 1000)}${slider('rr', 'Reserve requirement', 2, 50, 1, 10)}${slider('n', 'Lending rounds shown', 1, 30, 1, 8)}
        <div class="readout">${ro('Multiplier', 'mu')}${ro('Deposits so far', 'ds')}${ro('Maximum deposits', 'mx')}</div></div></div>
        <p class="hint-line"><b>Try:</b> cut the reserve requirement from 20% to 5%. The multiplier jumps from 5× to 20×.</p>`);
      const draw = () => {
        const d = val(el, 'd'), rr = val(el, 'rr') / 100, n = val(el, 'n');
        setO(el, 'd', '$' + fmt0(d)); setO(el, 'rr', pct(rr * 100, 0)); setO(el, 'n', n);
        const dep = []; let x = d; for (let i = 0; i < n; i++) { dep.push(x); x *= (1 - rr); }
        const tot = dep.reduce((a, b) => a + b, 0);
        const Wd = 560, H = 270, bw = Math.min(40, (Wd - 60) / n - 2), sc = 200 / d;
        let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Deposits by round">`;
        dep.forEach((v, i) => { const x0 = 40 + i * (bw + 2); const hR = v * rr * sc, hL = v * (1 - rr) * sc;
          svg += `<rect x="${x0}" y="${230 - hR}" width="${bw}" height="${hR}" class="fs-s"/><rect x="${x0}" y="${230 - hR - hL}" width="${bw}" height="${hL}" class="fa-s" opacity=".75"/>`; });
        svg += `<line x1="36" x2="${Wd - 10}" y1="230" y2="230" class="ax"/><text class="dg-s" x="40" y="250">Bank 1 → Bank ${n}: blue = lent on, yellow = kept as reserves</text></svg>`;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px">${svg}</div>`;
        setT(el, 'mu', fmt(1 / rr, 1) + '×'); setT(el, 'ds', '$' + fmt0(tot)); setT(el, 'mx', '$' + fmt0(d / rr));
        goal(el, 'Set the reserve requirement so the money multiplier reaches 20×.', rr <= .0501);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'With a 20% reserve requirement, a new $500 deposit can create maximum total deposits of…', o: ['$600', '$1,000', '$2,500', '$10,000'], a: 2, why: 'Multiplier = 1/0.20 = 5, so $500 × 5 = $2,500.' }],
  take: ['Banks create money by lending out deposits beyond their reserves.', 'Money multiplier = 1 ÷ reserve requirement.', 'Cash holdings and excess reserves make the real multiplier smaller.']
});

const DM_ROWS = ['Cash (notes & coins)', 'Bank deposit', 'Bitcoin-style crypto', 'Stablecoin', 'CBDC'];

const DM_WHY = [

  ['Few shops accept it, and fees and settlement times vary widely.', 'Almost nothing is priced in bitcoin; its value swings too much to quote prices in.', 'Its price can halve in months, so purchasing power is unreliable.', 'No central issuer: supply follows a fixed protocol, outside any central bank.'],
  ['Used in crypto trading and some cross-border payments, but not widely in shops.', 'Prices are quoted in the dollar or euro it tracks, not in the coin itself.', 'Stable only while its reserves are sound; it can lose its peg in a run.', 'Issued by private firms; regulators may supervise them, but the central bank does not control supply.'],

lesson({
  id: 'digital-money', title: 'Digital Money, Cryptoassets & CBDCs', host: 'penny', labs: 'New lesson', tags: 'bitcoin crypto cryptocurrency stablecoin cbdc central bank digital currency disintermediation blockchain tokens digital euro e-cny',
  hook: `Your grandparents paid in notes and coins. You probably tap a phone. Now there are cryptocurrencies, stablecoins and <b>central bank digital currencies</b> too. Which of them really work as <b>money</b>? Let's test each one against the three functions you already know.`,
  body: () => `
  <div class="idea"><p>Money is defined by what it <b>does</b> (medium of exchange, unit of account, store of value), not by the technology behind it. A new form of money matters for macroeconomics when it changes who issues it and how monetary policy reaches people.</p></div>
  <div class="cards c5">
    <div class="card"><div class="ic c-sun">€</div><h4>Fiat cash</h4><p>Notes and coins issued by the central bank and backed by trust and legal-tender status, not by gold.</p></div>
    <div class="card"><div class="ic c-acc">Bk</div><h4>Bank deposits</h4><p>Most money today. They are liabilities of commercial banks, created when banks lend (remember the multiplier).</p></div>
    <div class="card"><div class="ic c-plu">₿</div><h4>Cryptocurrencies</h4><p>Decentralised tokens with no issuer, recorded on a blockchain. Their extreme <b>volatility</b> limits their role as a unit of account and store of value.</p></div>
    <div class="card"><div class="ic c-min">$1</div><h4>Stablecoins</h4><p>Private tokens pegged to a currency and backed by reserves. They are only as safe as that backing, and they can suffer runs.</p></div>
    <div class="card"><div class="ic c-cor">CB</div><h4>CBDCs</h4><p>A digital form of central bank money available to the public: digital cash. China's e-CNY is live; the euro area is preparing a digital euro.</p></div>
  </div>
  ${W('mx')}
  <h2>What a CBDC could change</h2>
  <div class="cards">
    <div class="card"><h4>Disintermediation risk</h4><p>If households move deposits from banks into CBDC accounts, banks lose cheap funding. They must lend less or borrow at higher cost. In a panic, a <b>digital bank run</b> into the CBDC could take minutes.</p></div>
    <div class="card"><h4>Faster monetary transmission</h4><p>If a CBDC paid interest set by the central bank, rate changes would reach households <b>directly and instantly</b>, instead of waiting for banks to adjust their deposit rates.</p></div>
    <div class="card"><h4>Design safeguards</h4><p><b>Holding limits</b> (e.g. a few thousand euros per person), zero interest, and central bank funding for banks all reduce disintermediation. Privacy and cyber-security are open questions.</p></div>
  </div>
  ${W('cb')}
  ${say('penny', 'Notice the pattern: crypto fails the money test mainly because its price swings so much, and stablecoins only pass it by borrowing the credibility of real currencies. A CBDC passes every test, but it could change how banks work.', 'think')}`,
  widgets: {
    mx(el) {
      const st = DM_ROWS.map(() => DM_COLS.map(() => 0));
      el.innerHTML = lab('Is it money? Fill the matrix', `<p class="hint-line">Click each cell to cycle through <b>Strong → Partial → Weak</b>, then press <b>Check my matrix</b>. Click any cell afterwards to read why.</p>
        <div class="mx-wrap"><table class="mx"><thead><tr><th scope="col">Asset</th>${DM_COLS.map(c => `<th scope="col">${c}</th>`).join('')}</tr></thead>
        <tbody>${DM_ROWS.map((r, i) => `<tr><th scope="row">${r}</th>${DM_COLS.map((c, j) => `<td><button type="button" class="mx-c" data-i="${i}" data-j="${j}" data-v="0" aria-label="${r}, ${c}: not set">?</button></td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <div class="btn-row"><button class="btn sm pri" type="button" id="ck">Check my matrix</button><button class="btn sm" type="button" id="sa">Show answers</button><button class="btn sm" type="button" id="cl">Clear</button></div>
        <div class="verdict" id="v">Fill in all 20 cells, then check.</div>`, 'Game', 'Score at least 16 of 20 cells correct.');
      let checked = false;
      const paint = (b) => { const i = +b.dataset.i, j = +b.dataset.j, v = st[i][j]; b.dataset.v = v; b.textContent = DM_LBL[v]; b.setAttribute('aria-label', `${DM_ROWS[i]}, ${DM_COLS[j]}: ${v ? DM_LBL[v] : 'not set'}`); };
      const check = () => {
        let n = 0;
        $$('.mx-c', el).forEach(b => { const i = +b.dataset.i, j = +b.dataset.j, ok = st[i][j] === DM_KEY[i][j]; if (ok) n++; b.classList.toggle('ok', ok); b.classList.toggle('no', !ok); });
        checked = true;
        $('#v', el).className = 'verdict ' + (n >= 16 ? 'good' : 'warn');
        $('#v', el).innerHTML = `<b>${n} / 20 correct.</b> ${n >= 16 ? 'You can tell money from money-like assets.' : 'Click a red cell to see the reasoning, adjust, and check again.'}`;
        goalSet(el, n >= 16);

      el.addEventListener('click', e => {

          st[i][j] = st[i][j] % 3 + 1; b.classList.remove('ok', 'no'); paint(b);

          return;

        if (e.target.closest('#ck')) check();
        if (e.target.closest('#sa')) { $$('.mx-c', el).forEach(b => { st[+b.dataset.i][+b.dataset.j] = DM_KEY[+b.dataset.i][+b.dataset.j]; paint(b); }); check(); $('#v', el).innerHTML = 'Answers shown. Click any cell to read why.'; goalSet(el, false); }
        if (e.target.closest('#cl')) { $$('.mx-c', el).forEach(b => { st[+b.dataset.i][+b.dataset.j] = 0; b.classList.remove('ok', 'no'); paint(b); }); checked = false; $('#v', el).className = 'verdict'; $('#v', el).textContent = 'Fill in all 20 cells, then check.'; goalSet(el, false); }

        <div class="readout">${ro('Fall in bank lending', 'l')}${ro('Extra bank funding cost', 'c')}</div><div class="verdict" id="v"></div></div></div>

      const draw = () => {

        setO(el, 's', fmt0(s * 100) + '%'); setO(el, 'f', fmt0(f * 100) + '%'); setO(el, 'cap', cap ? 'on (12% max)' : 'off');
        const se = cap ? Math.min(s, .12) : s;

        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 560 210" role="img" aria-label="Bank balance sheet after CBDC adoption">
          ${items.map(([n, v, c], i) => `<text class="dg-t" x="10" y="${34 + i * 46}">${n}</text><rect x="140" y="${16 + i * 46}" width="${Math.max(1, v * .36)}" height="28" class="${c}" rx="3"/><text class="lab-t" x="${146 + v * .36}" y="${35 + i * 46}">${fmt0(v)}</text>`).join('')}</svg></div>`;
        setT(el, 'l', '−' + fmt(drop, 1) + '%'); setT(el, 'c', '+' + fmt(drop * .04, 2) + ' pp');

    { q: 'If households could move bank deposits into CBDC accounts at the central bank, the main risk to the banking system is…', o: ['Higher inflation', 'Disintermediation: banks lose deposit funding and lend less', 'A stronger currency', 'Lower central bank credibility'], a: 1, why: 'Deposits are banks\' cheapest funding. If they flow into the CBDC, banks must shrink lending or pay more for funds, and a digital run could be very fast.' }
