lesson({
  id: 'basic-concepts', title: 'Basic Concepts', dur: '7:43', tags: 'supply demand equilibrium shortage surplus',
  hook: `Think of a busy farmers' market. When strawberries are cheap, shoppers buy armfuls and farmers bring fewer. When they're pricey, the opposite. Somewhere in between, the price settles. That's <b>equilibrium</b>, and the same logic runs the whole economy.`,
  body: () => `
  <div class="idea"><p>Price coordinates buyers and sellers. Demand slopes down, supply slopes up, and the market settles where the quantity people want to buy equals the quantity firms want to sell.</p></div>
  <div class="cards">
    <div class="card"><div class="ic c-acc">D</div><h4>Law of demand</h4><p>When the price rises, quantity demanded falls, all else equal. The demand curve slopes <b>downward</b>.</p></div>
    <div class="card"><div class="ic c-cor">S</div><h4>Law of supply</h4><p>When the price rises, firms supply more because production becomes more profitable. The supply curve slopes <b>upward</b>.</p></div>
    <div class="card"><div class="ic c-sun">E</div><h4>Equilibrium</h4><p>The price where quantity demanded = quantity supplied. No shortage, no surplus, no pressure to change.</p></div>
  </div>
  ${W('sd')}
  <h2>Movement along the curve versus a shift of the curve</h2>
  <p>This distinction is the most common exam trap. A change in the good's <b>own price</b> moves you <b>along</b> a curve. A change in <b>anything else</b> shifts the whole curve.</p>
  <div class="tblw"><table class="tbl"><tr><th>Shifts demand</th><th>Shifts supply</th></tr>
    <tr><td>Income (normal and inferior goods)</td><td>Input prices (wages, raw materials)</td></tr>
    <tr><td>Prices of substitutes and complements</td><td>Technology and productivity</td></tr>
    <tr><td>Tastes and expectations</td><td>Number of sellers, taxes and subsidies</td></tr>
    <tr><td>Number of buyers</td><td>Expectations of future prices</td></tr></table></div>
  <div class="w" data-w="shift"></div>
  <details class="reveal"><summary>Think first: a frost destroys half the coffee harvest. What happens?<span class="hint">tap to reveal</span></summary>
  <div>Supply shifts <b>left</b>. At the old price there is now a shortage, so the price rises and the quantity traded falls. Demand did <b>not</b> shift; buyers simply move up along their existing demand curve.</div></details>`,
  widgets: {
    sd(el) {
      el.innerHTML = lab('The strawberry market', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('dS', 'Demand shift', -3, 3, .1, 0)}${slider('sS', 'Supply shift', -3, 3, .1, 0)}
        <label class="ctl"><span class="ctl-l">Price control</span><output id="pc-o"></output><input type="checkbox" id="pc" style="grid-column:1/-1;justify-self:start;width:20px;height:20px;accent-color:var(--accent)"></label>
        ${slider('pp', 'Set price ($)', 1, 11, .1, 8)}
        <div class="readout">${ro('Eq. price', 'r1')}${ro('Eq. quantity', 'r2')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> 1) push demand right and watch price and quantity both rise. 2) Shift supply left: price up, quantity down. 3) Tick "Price control" and set a price above or below equilibrium to create a surplus or a shortage.</p>`);
      const draw = () => {
        const d = val(el, 'dS'), s = val(el, 'sS'), on = $('#pc', el).checked, P = val(el, 'pp');
        $('#pp', el).disabled = !on;
        const aD = 10 + d, b = .8, aS = 1 - s, k = .6;
        const [Q, Pe] = meet(aD, -b, aS, k);
        const c = chart({ x: [0, 14], y: [0, 13], xl: 'Quantity (crates)', yl: 'Price ($)', xt: [0, 2, 4, 6, 8, 10, 12, 14], yt: [0, 2, 4, 6, 8, 10, 12], grid: true, label: 'Supply and demand' });
        if (d) c.fn(q => 10 - b * q, 'ghost'); if (s) c.fn(q => 1 + k * q, 'ghost');
        c.fn(q => aD - b * q, 'l1').fn(q => aS + k * q, 'l2');
        c.text(Math.min(13.5, (aD - .6) / b), .6, 'D', 'a', 6, 0).text(Math.min(13.4, (12.6 - aS) / k), Math.min(12.6, aS + k * 13.4), 'S', 'c', 8, 4);
        let msg = '', cls = '';
        if (on) {
          const qd = Math.max(0, (aD - P) / b), qs = Math.max(0, (P - aS) / k);
          c.hline(P, 'l4 thin');
          c.dot(qd, P, 'a').dot(qs, P, 'c').text(0, P, `P = $${fmt(P)}`, 's', 6, -8);
          if (Math.abs(qd - qs) > .15) {
            c.add(`<line x1="${c.sx(qd)}" x2="${c.sx(qs)}" y1="${c.sy(P) + 14}" y2="${c.sy(P) + 14}" stroke="${qd > qs ? 'var(--coral)' : 'var(--accent)'}" stroke-width="6" opacity=".5"/>`);
            c.text((qd + qs) / 2, P, qd > qs ? 'Shortage' : 'Surplus', qd > qs ? 'c' : 'a', 0, 30, 'middle');
          }
          if (qd > qs + .15) { msg = `Price is held below equilibrium. Buyers want ${fmt(qd)} crates but sellers offer only ${fmt(qs)}: a <b>shortage</b> of ${fmt(qd - qs)}. Queues form and the price would rise if allowed.`; cls = 'bad'; }
          else if (qs > qd + .15) { msg = `Price is held above equilibrium. Sellers offer ${fmt(qs)} but buyers take only ${fmt(qd)}: a <b>surplus</b> of ${fmt(qs - qd)}. Unsold stock pushes the price down.`; cls = 'warn'; }
          else { msg = 'The controlled price is at equilibrium, so it changes nothing.'; cls = 'good'; }
          setO(el, 'pc', 'on');
        } else {
          c.guide(Q, Pe).dot(Q, Pe, 's', 7);
          msg = d > 0 && s === 0 ? 'Demand rose: <b>price and quantity both rise</b>.' : d < 0 && s === 0 ? 'Demand fell: <b>price and quantity both fall</b>.' : s > 0 && d === 0 ? 'Supply rose: <b>price falls, quantity rises</b>.' : s < 0 && d === 0 ? 'Supply fell: <b>price rises, quantity falls</b>.' : d === 0 && s === 0 ? 'The market clears at the equilibrium price. Move a slider to disturb it.' : 'Both curves moved. The direction of one variable depends on which shift is bigger.';
          cls = ''; setO(el, 'pc', 'off');
        }
        setO(el, 'dS', d > 0 ? 'right +' + fmt(d) : d < 0 ? 'left ' + fmt(d) : 'none');
        setO(el, 'sS', s > 0 ? 'right +' + fmt(s) : s < 0 ? 'left ' + fmt(s) : 'none');
        setO(el, 'pp', '$' + fmt(P));
        setT(el, 'r1', '$' + fmt(Pe, 2)); setT(el, 'r2', fmt(Q, 1));
        const v = $('#v', el); v.className = 'verdict ' + cls; v.innerHTML = msg;
        $('#p', el).innerHTML = c.html();
        goal(el, 'Use the price control to create a shortage of at least 4 crates.', on && ((aD - P) / b - (P - aS) / k) >= 4);
      };
      el.addEventListener('input', draw); draw();
    },
    shift(el) {
      sorter(el, {
        title: 'Shift or movement? (coffee market)', prompt: 'For each event, decide what happens in the market for coffee.',
        bins: ['Demand shifts right', 'Demand shifts left', 'Supply shifts right', 'Supply shifts left', 'Movement along a curve'],
        items: [
          { t: 'The price of coffee itself rises', b: 4, why: 'A change in the good\'s own price never shifts its own curves; it moves along them.' },
          { t: 'The price of tea (a substitute) doubles', b: 0, why: 'Tea is a substitute, so people switch to coffee.' },
          { t: 'A new roasting machine halves production costs', b: 2, why: 'Lower costs make supplying any quantity cheaper, so supply shifts right.' },
          { t: 'Wages of coffee pickers rise sharply', b: 3, why: 'Higher input costs shift supply left.' },
          { t: 'A study says coffee causes insomnia; tastes change', b: 1, why: 'Tastes are a demand shifter.' },
          { t: 'The price of milk and sugar (complements) jumps', b: 1, why: 'Complements are used together, so pricier milk reduces coffee demand.' },
          { t: 'The government gives coffee growers a subsidy', b: 2, why: 'A subsidy works like a cost reduction.' }
        ]
      }, 'ollie');
    }
  },
  check: [
    { q: 'Consumer incomes rise and the good is <b>normal</b>. At the old price, the market now has…', o: ['A surplus, so the price falls', 'A shortage, so the price rises', 'No change because supply is unchanged', 'A leftward shift in supply'], a: 1, why: 'Demand shifts right. At the old price quantity demanded exceeds quantity supplied (a shortage), which bids the price up to a new, higher equilibrium.' },
    { q: 'A government sets a price <b>ceiling</b> below the equilibrium price. The result is…', o: ['A surplus', 'A shortage', 'A rightward supply shift', 'Equilibrium is unaffected'], a: 1, why: 'Below equilibrium, buyers want more than sellers offer, so there is a persistent shortage.' }
  ],
  take: ['Demand slopes down and supply slopes up; equilibrium is where they cross.', 'Own-price changes move you along a curve; everything else shifts it.', 'Below equilibrium you get shortages; above it, surpluses.']
});

lesson({
  id: 'elasticity', title: 'Elasticity Explained', dur: '11:01', tags: 'price income cross elasticity revenue normal inferior substitutes complements',
  hook: `Suppose a cinema raises ticket prices by 10%. Does it earn more or less? It depends on how strongly moviegoers react. Economists measure that reaction with <b>elasticity</b>.`,
  body: () => `
  <div class="idea"><p>Elasticity is a ratio of percentage changes: how much quantity responds, in %, to a 1% change in something else. Because both sides are in percentages, units don't matter.</p></div>
  <div class="formula"><span class="lbl">Own-price elasticity of demand</span><b>E<sub>p</sub></b> = %ΔQ<sub>d</sub> ÷ %ΔP &nbsp;&nbsp;(usually negative; we compare its absolute value)</div>
  <div class="cards">
    <div class="card"><div class="ic c-acc">&gt;1</div><h4>Elastic |E| &gt; 1</h4><p>Quantity reacts more than price. Raising the price <b>lowers</b> total revenue. Typical for goods with close substitutes and luxuries.</p></div>
    <div class="card"><div class="ic c-sun">=1</div><h4>Unit elastic |E| = 1</h4><p>Percentage changes offset exactly. Total revenue is at its <b>maximum</b>.</p></div>
    <div class="card"><div class="ic c-cor">&lt;1</div><h4>Inelastic |E| &lt; 1</h4><p>Quantity barely reacts. Raising the price <b>raises</b> total revenue. Typical for necessities with few substitutes, such as fuel and medicine.</p></div>
  </div>
  ${W('el')}
  ${say('ollie', 'Notice something surprising: on a <b>straight</b> demand line the slope is constant but elasticity is <b>not</b>. Near the top (high price, low quantity) demand is elastic; near the bottom it is inelastic. Elasticity depends on where you stand.', 'think')}
  <h2>Two more elasticities</h2>
  <div class="formula"><span class="lbl">Income elasticity</span>E<sub>I</sub> = %ΔQ<sub>d</sub> ÷ %ΔIncome &nbsp;&nbsp; <b>&gt; 0 normal good</b> (&gt;1 luxury) · <b>&lt; 0 inferior good</b></div>
  <div class="formula"><span class="lbl">Cross-price elasticity</span>E<sub>XY</sub> = %ΔQ<sub>X</sub> ÷ %ΔP<sub>Y</sub> &nbsp;&nbsp; <b>&gt; 0 substitutes</b> · <b>&lt; 0 complements</b></div>
  ${W('cls')}
  <h3>What makes demand more elastic?</h3>
  <ul><li><b>Close substitutes</b> available (one brand of cola versus "drinks" in general).</li><li>A <b>large share of the budget</b> (cars react more than salt).</li><li><b>More time</b> to adjust: long-run demand is more elastic than short-run.</li><li><b>Luxury</b> rather than necessity.</li></ul>`,
  widgets: {
    el(el) {
      el.innerHTML = lab('Cinema tickets: elasticity and revenue', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('P', 'Current ticket price', 1, 19, .5, 14)}${slider('ch', 'Price change', -30, 30, 1, 10)}
        <div class="readout">${ro('|E| at this point', 'e')}${ro('Revenue before', 'r0')}${ro('Revenue after', 'r1')}${ro('Demand is', 'ty')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> start high (price $16) and raise the price by 10%. Revenue falls. Now start low ($5) and do the same: revenue rises. Find the price where the shaded revenue box is biggest.</p>`);
      const draw = () => {
        const P = val(el, 'P'), ch = val(el, 'ch') / 100;
        const Qf = p => Math.max(0, 40 - 2 * p); // Q in hundreds
        const Q = Qf(P), P1 = clamp(P * (1 + ch), 0, 20), Q1 = Qf(P1);
        const E = Q > 0 ? 2 * P / Q : Infinity;
        const c = chart({ x: [0, 42], y: [0, 21], xl: 'Tickets (hundreds)', yl: 'Price ($)', xt: [0, 10, 20, 30, 40], yt: [0, 5, 10, 15, 20], grid: true, label: 'Linear demand with revenue rectangle' });
        c.line([[0, 20], [20, 10]], 'l1').line([[20, 10], [40, 0]], 'l2');
        c.text(4, 18.4, 'elastic', 'a', 0, 0).text(30, 3.6, 'inelastic', 'c', 0, 0).dot(20, 10, 's', 4).text(20, 10, '|E| = 1', 's', 8, -6);
        c.rect(0, 0, Q, P, 'fs');
        c.text(Q / 2, P / 2, `TR $${fmt0(P * Q * 100)}`, '', 0, 4, 'middle');
        if (Math.abs(ch) > .001) { c.guide(Q1, P1, 'guide').dot(Q1, P1, 'm', 5); c.arrow(Q, P, Q1, P1, 'l3'); }
        c.guide(Q, P).dot(Q, P, 's', 7);
        $('#p', el).innerHTML = c.html();
        setO(el, 'P', '$' + fmt(P)); setO(el, 'ch', (ch > 0 ? '+' : '') + fmt(ch * 100, 0) + '%');
        const R0 = P * Q * 100, R1 = P1 * Q1 * 100;
        setT(el, 'e', isFinite(E) ? fmt(E, 2) : '∞'); setT(el, 'r0', '$' + fmt0(R0)); setT(el, 'r1', '$' + fmt0(R1));
        setT(el, 'ty', E > 1.02 ? 'Elastic' : E < .98 ? 'Inelastic' : 'Unit elastic');
        const v = $('#v', el);
        const dq = Q ? (Q1 - Q) / Q * 100 : 0;
        v.className = 'verdict ' + (R1 > R0 + 1 ? 'good' : R1 < R0 - 1 ? 'bad' : '');
        v.innerHTML = Math.abs(ch) < .001 ? 'Choose a price change to see the effect on revenue.' :
          `Price ${ch > 0 ? 'up' : 'down'} ${fmt(Math.abs(ch * 100), 0)}%, quantity ${dq > 0 ? 'up' : 'down'} ${fmt(Math.abs(dq), 1)}%. Revenue ${R1 > R0 ? '<b>rises</b>' : '<b>falls</b>'} by $${fmt0(Math.abs(R1 - R0))}. ${E > 1 ? 'Demand is elastic here, so quantity moves more than price.' : 'Demand is inelastic here, so price moves more than quantity.'}`;
        goal(el, 'Find the ticket price where demand is unit elastic (|E| = 1).', Math.abs(E - 1) < .03);
      };
      el.addEventListener('input', draw); draw();
    },
    cls(el) {
      sorter(el, {
        title: 'Name that relationship', prompt: 'Read the data, compute the sign of the elasticity, and classify.',
        bins: ['Normal good', 'Inferior good', 'Substitutes', 'Complements'],
        items: [
          { t: 'Income +10% → demand for budget noodles −6%', b: 1, why: 'Income elasticity = −0.6 < 0. People switch to better food as they get richer.' },
          { t: 'Income +10% → demand for restaurant meals +15%', b: 0, why: 'Income elasticity = +1.5 > 1: a normal good, and a luxury.' },
          { t: 'Price of butter +20% → margarine sales +8%', b: 2, why: 'Cross elasticity = +0.4 > 0: consumers switch to the substitute.' },
          { t: 'Price of printers +15% → ink cartridge sales −9%', b: 3, why: 'Cross elasticity = −0.6 < 0: goods used together.' },
          { t: 'Income +5% → bus ride demand −2%', b: 1, why: 'Negative income elasticity: richer households drive instead.' },
          { t: 'Price of petrol +30% → demand for large SUVs −12%', b: 3, why: 'Negative cross elasticity: fuel and cars are complements.' },
          { t: 'Income +8% → demand for bread +2%', b: 0, why: 'Positive but small (0.25): a normal necessity.' }
        ]
      }, 'ollie');
    }
  },
  check: [
    { q: 'A 5% price cut raises quantity demanded by 2%. Total revenue will…', o: ['Rise, because demand is elastic', 'Fall, because demand is inelastic', 'Stay the same', 'Rise, because demand is inelastic'], a: 1, why: '|E| = 2/5 = 0.4 < 1, so demand is inelastic. Cutting price loses more revenue per unit than the small gain in units sold.' },
    { q: 'Cross-price elasticity between goods X and Y is −0.8. X and Y are…', o: ['Substitutes', 'Complements', 'Inferior goods', 'Unrelated'], a: 1, why: 'A negative cross elasticity means a higher price of Y reduces demand for X, so they are used together (complements).' }
  ],
  take: ['Elasticity = %Δ quantity ÷ %Δ in a driver (price, income, another price).', 'If demand is elastic, a price rise lowers revenue; if inelastic, it raises revenue. Revenue peaks at unit elasticity.', 'Income elasticity: positive means normal, negative means inferior. Cross elasticity: positive means substitutes, negative means complements.']
});

lesson({
  id: 'what-is-gdp', title: 'What is GDP & How is it Calculated?', dur: '6:03 + 2:08', tags: 'gross domestic product final goods transfer payments owner-occupied value added double counting intermediate',
  hook: `If you wanted one number for the size of an entire economy, what would you count? Every sale? Every job? Economists settled on <b>GDP</b>. The rules for what goes in it are precise, and so is the method for adding it up without counting anything twice.`,
  body: () => `
  <div class="idea"><p><b>Gross Domestic Product</b> is the total market value of all <b>final</b> goods and services produced <b>within a country's borders</b> in a given period, usually a year.</p></div>
  <div class="cards">
    <div class="card"><div class="ic c-acc">$</div><h4>Market value</h4><p>Things are valued at market prices, so apples and haircuts can be added together.</p></div>
    <div class="card"><div class="ic c-min">F</div><h4>Final only</h4><p>Intermediate goods (flour sold to a baker) are excluded to avoid <b>double counting</b>.</p></div>
    <div class="card"><div class="ic c-sun">D</div><h4>Domestic</h4><p>Produced inside the borders, whoever owns the factory.</p></div>
    <div class="card"><div class="ic c-plu">T</div><h4>This period</h4><p>Only current production. A used car resold today was counted when it was new.</p></div>
  </div>
  <h2>Part 1 · What counts?</h2>
  <ul>
    <li><b>Government services</b> (police, teachers) have no market price, so they are valued <b>at cost</b>, mainly the wages paid.</li>
    <li><b>Owner-occupied housing</b>: homeowners don't pay rent, but they consume housing services. GDP adds an <b>imputed rent</b> so GDP doesn't change just because people buy instead of rent.</li>
    <li><b>Transfer payments</b> (unemployment benefits, pensions, welfare) are <b>excluded</b>: they move money around without producing anything.</li>
    <li><b>Financial transactions</b> (buying shares) are excluded, but the broker's fee is a service and counts.</li>
    <li><b>Non-market and underground activity</b> (unpaid housework, illegal trade) is generally left out.</li>
  </ul>
  ${W('gdp')}
  ${say('ollie', 'A quick test I use: <i>"Was something newly produced here, this year, and sold to its final user?"</i> If yes, it goes into GDP.', 'think')}
  <h2>Part 2 · How is it calculated?</h2>
  <p>A loaf of bread costs $3.00. But the farmer, miller, baker and shop all sold something along the way. Adding up <b>all</b> their sales would count the wheat four times. There are two equivalent ways to avoid that: count only the <b>value of final output</b>, or add up the <b>value added</b> at each stage.</p>
  <div class="formula"><span class="lbl">Value added at each stage</span>Value added = Sales price − Cost of intermediate inputs bought from the previous stage</div>
  ${W('va')}
  <h3>Two lenses on the same total</h3>
  <div class="cards">
    <div class="card"><h4>Expenditure approach</h4><p>Add up spending on final goods and services: what households, firms, government and foreigners buy. (Next lessons.)</p></div>
    <div class="card"><h4>Income approach</h4><p>Add up the incomes earned producing it: wages, rents, interest, profits and so on.</p></div>
  </div>
  ${say('ollie', 'Why must spending equal income? Every dollar <b>spent</b> on a final good becomes someone\'s <b>income</b>: wages for the baker, profit for the shop owner, rent for the landlord. Same dollars, counted from the other side.', 'happy')}`,
  widgets: {
    gdp(el) {
      sorter(el, {
        title: 'Does it count in this year\'s GDP?', prompt: 'You are the national statistician. Decide for each transaction.',
        bins: ['Counts in GDP', 'Excluded from GDP'],
        items: [
          { t: 'A new car built and sold this year', b: 0, why: 'A newly produced final good.' },
          { t: 'You buy a 2015 used car from a neighbour', b: 1, why: 'Produced years ago and already counted. A dealer\'s margin would count, though.' },
          { t: 'Government pays a teacher\'s salary', b: 0, why: 'Government services are valued at cost.' },
          { t: 'A retiree receives a state pension', b: 1, why: 'A transfer payment: nothing is produced in exchange.' },
          { t: 'Imputed rent of homes lived in by their owners', b: 0, why: 'Owner-occupied housing services are imputed so GDP is consistent.' },
          { t: 'Flour sold by a mill to a bakery', b: 1, why: 'An intermediate good. Its value is in the price of the bread.' },
          { t: 'You buy 100 shares of a listed company', b: 1, why: 'A financial transaction, ownership changes hands. The broker\'s commission counts.' },
          { t: 'A foreign-owned factory produces phones in the country', b: 0, why: 'Domestic production counts in GDP regardless of who owns the factory.' },
          { t: 'Unemployment benefit cheques', b: 1, why: 'Transfer payment.' }
        ]
      }, 'ollie');
    },
    va(el) {
      const stages = [{ n: 'Farmer', s: 'grows wheat', c: 'fa-s' }, { n: 'Miller', s: 'makes flour', c: 'fs-s' }, { n: 'Baker', s: 'bakes bread', c: 'fc-s' }, { n: 'Shop', s: 'sells the loaf', c: 'fm-s' }];
      el.innerHTML = lab('Follow a loaf of bread', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('s0', 'Farmer sells wheat for', .1, 1.5, .05, .4)}${slider('s1', 'Miller sells flour for', .2, 2.5, .05, 1)}
        ${slider('s2', 'Baker sells bread to shop for', .5, 3.5, .05, 2.2)}${slider('s3', 'Shop sells to you for', 1, 4.5, .05, 3)}
        <div class="readout">${ro('Sum of all sales', 'r1')}${ro('Sum of value added', 'r2')}${ro('Final price', 'r3')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> raise the baker's price. The baker's value added grows, the shop's shrinks, but total value added always equals the final price.</p>`);
      const draw = () => {
        let s = [0, 1, 2, 3].map(i => val(el, 's' + i));
        for (let i = 1; i < 4; i++) if (s[i] < s[i - 1]) { s[i] = s[i - 1]; $('#s' + i, el).value = s[i]; }
        const va = s.map((v, i) => v - (i ? s[i - 1] : 0));
        const Wd = 560, H = 300, base = 260, scale = 200 / 4.5;
        let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Value added chain">`;
        stages.forEach((st, i) => {
          const x = 30 + i * 105; let y = base;
          for (let j = 0; j <= i; j++) { const h = va[j] * scale; y -= h; svg += `<rect x="${x}" y="${y}" width="70" height="${h}" class="${stages[j].c}" opacity="${j === i ? 1 : .35}" rx="3"/>`; }
          svg += `<text class="dg-t" x="${x + 35}" y="${base + 18}" text-anchor="middle">${st.n}</text><text class="dg-s" x="${x + 35}" y="${base + 32}" text-anchor="middle">${st.s}</text>
                  <text class="lab-t" x="${x + 35}" y="${y - 8}" text-anchor="middle">$${fmt(s[i], 2)}</text>`;
        });
        const x = 460; let y = base;
        va.forEach((v, j) => { const h = v * scale; y -= h; svg += `<rect x="${x}" y="${y}" width="80" height="${h}" class="${stages[j].c}" rx="3"/>${h > 14 ? `<text class="lab-t" x="${x + 40}" y="${y + h / 2 + 4}" text-anchor="middle" style="font-size:11px">+$${fmt(v, 2)}</text>` : ''}`; });
        svg += `<text class="dg-t" x="${x + 40}" y="${base + 18}" text-anchor="middle">Value added</text><text class="dg-s" x="${x + 40}" y="${base + 32}" text-anchor="middle">stacked = GDP</text>
          <line x1="20" x2="${Wd - 10}" y1="${base}" y2="${base}" class="ax"/></svg>`;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px">${svg}</div>`;
        [0, 1, 2, 3].forEach(i => setO(el, 's' + i, '$' + fmt(s[i], 2)));
        const tot = s.reduce((a, b) => a + b, 0);
        setT(el, 'r1', '$' + fmt(tot, 2)); setT(el, 'r2', '$' + fmt(va.reduce((a, b) => a + b, 0), 2)); setT(el, 'r3', '$' + fmt(s[3], 2));
        goal(el, 'Make the baker\'s value added the largest of the four stages.', va[2] > Math.max(va[0], va[1], va[3]));
        $('#v', el).innerHTML = `Adding every sale gives $${fmt(tot, 2)}. That double counts by <b>$${fmt(tot - s[3], 2)}</b>. Value added (${va.map(v => '$' + fmt(v, 2)).join(' + ')}) equals the final price of <b>$${fmt(s[3], 2)}</b>.`;
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [
    { q: 'Which item is <b>included</b> in GDP?', o: ['Social security payments', 'The resale of a 10-year-old house', 'The estimated rental value of owner-occupied housing', 'The purchase of government bonds'], a: 2, why: 'Imputed rent of owner-occupied housing is included. Transfers, resales of existing assets and financial transactions are excluded.' },
    { q: 'A farmer sells cotton for $2, a mill turns it into fabric sold for $5, and a tailor sells the shirt for $12. The contribution to GDP is…', o: ['$19', '$12', '$7', '$5'], a: 1, why: 'Value added: 2 + (5−2) + (12−5) = $12, which equals the value of the final good. $19 would double count the cotton and fabric.' }
  ],
  take: ['GDP = market value of final goods and services produced domestically in a period.', 'Government services are valued at cost; owner-occupied housing gets an imputed rent; transfers, intermediate goods, resales and financial trades are excluded.', 'Value of final output = sum of value added at every stage; summing all sales double counts.', 'The expenditure and income approaches measure the same total from opposite sides.']
});

lesson({
  id: 'nominal-real', title: 'Nominal and Real GDP', dur: '9:30', tags: 'gdp deflator inflation real gdp per capita base year',
  hook: `GDP jumped 8% this year. Great news? Maybe not. If prices rose 7%, the economy produced only about 1% more <b>stuff</b>. We need to strip inflation out.`,
  body: () => `
  <div class="idea"><p><b>Nominal GDP</b> values output at <b>current</b> prices. <b>Real GDP</b> values output at <b>base-year</b> prices, so it changes only when quantities change.</p></div>
  <div class="formula"><span class="lbl">The two measures</span>Nominal GDP<sub>t</sub> = Σ P<sub>t</sub> × Q<sub>t</sub> &nbsp;&nbsp;·&nbsp;&nbsp; Real GDP<sub>t</sub> = Σ P<sub>base</sub> × Q<sub>t</sub></div>
  <div class="formula"><span class="lbl">GDP deflator: a price index for everything in GDP</span><b>GDP deflator</b> = (Nominal GDP ÷ Real GDP) × 100 &nbsp;&nbsp;&nbsp; so &nbsp;&nbsp; Real GDP = Nominal GDP ÷ (Deflator ÷ 100)</div>
  ${W('nr')}
  <div class="eg">An economy produces 100 pizzas at $10 in the base year and 105 pizzas at $11 the next year.<br>
  Nominal GDP: $1,000 → $1,155 (+15.5%). Real GDP at base prices: $1,000 → $1,050 (+5%). Deflator = 1,155 / 1,050 × 100 = <b>110</b>, so prices rose 10%.</div>
  <h2>Comparing living standards: real GDP per capita</h2>
  <p>A big economy isn't necessarily a rich one. Dividing real GDP by population gives <b>real GDP per capita</b>, the standard way to compare living standards across countries and over time.</p>
  <div class="formula">Real GDP per capita growth ≈ Real GDP growth − Population growth</div>
  <details class="reveal"><summary>Think first: real GDP grows 2% and population grows 3%. Are people better off?<span class="hint">tap to reveal</span></summary><div>On average, no. Real GDP per capita <b>falls</b> by about 1%. Total output rose, but it is shared among relatively more people.</div></details>`,
  widgets: {
    nr(el) {
      el.innerHTML = lab('Inflation versus real growth', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('pi', 'Inflation per year', 0, 15, .5, 4)}${slider('g', 'Real growth per year', -3, 8, .5, 2)}${slider('n', 'Population growth', -1, 4, .5, 1)}
        <div class="readout">${ro('Nominal GDP, year 10', 'a')}${ro('Real GDP, year 10', 'b')}${ro('Deflator, year 10', 'c')}${ro('Per-capita growth/yr', 'd')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> set real growth to 0 and inflation to 10%. Nominal GDP soars while real GDP stays flat. The gap between the lines <i>is</i> the deflator.</p>`);
      const draw = () => {
        const pi = val(el, 'pi') / 100, g = val(el, 'g') / 100, n = val(el, 'n') / 100;
        const R = t => 1000 * (1 + g) ** t, N = t => R(t) * (1 + pi) ** t;
        const ymax = Math.max(2000, N(10) * 1.08);
        const c = chart({ x: [0, 10], y: [0, ymax], xl: 'Years after base', yl: 'GDP ($bn)', xt: [0, 2, 4, 6, 8, 10], yt: nice(ymax), yf: v => fmt0(v), grid: true, label: 'Nominal and real GDP' });
        const pts = (f) => [...Array(11).keys()].map(t => [t, f(t)]);
        c.poly([...pts(N), ...pts(R).reverse()], 'fs');
        c.line(pts(N), 'l2').line(pts(R), 'l1');
        c.text(10, N(10), 'Nominal', 'c', -4, -10, 'end').text(10, R(10), 'Real', 'a', -4, 18, 'end');
        pts(N).forEach(p => c.dot(p[0], p[1], 'c', 3)); pts(R).forEach(p => c.dot(p[0], p[1], 'a', 3));
        $('#p', el).innerHTML = c.html();
        setO(el, 'pi', pct(pi * 100)); setO(el, 'g', pct(g * 100)); setO(el, 'n', pct(n * 100));
        setT(el, 'a', '$' + fmt0(N(10)) + 'bn'); setT(el, 'b', '$' + fmt0(R(10)) + 'bn'); setT(el, 'c', fmt(100 * (1 + pi) ** 10, 1));
        const pc = ((1 + g) / (1 + n) - 1) * 100; setT(el, 'd', pct(pc, 2));
        $('#v', el).className = 'verdict ' + (pc > 0 ? 'good' : pc < 0 ? 'bad' : '');
        $('#v', el).innerHTML = `Nominal GDP grows about ${pct(((1 + g) * (1 + pi) - 1) * 100)} a year, but only ${pct(g * 100)} of that is more output. Living standards per person ${pc > 0 ? 'rise' : pc < 0 ? 'fall' : 'stay flat'} (${pct(pc, 2)} a year).`;
        goal(el, 'Make nominal GDP grow at least 6% a year while living standards per person fall.', ((1 + g) * (1 + pi) - 1) * 100 >= 6 && pc < 0);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [
    { q: 'Nominal GDP is $1,320bn and the GDP deflator is 120. Real GDP is…', o: ['$1,584bn', '$1,100bn', '$1,200bn', '$1,320bn'], a: 1, why: 'Real GDP = Nominal ÷ (Deflator/100) = 1,320 ÷ 1.20 = $1,100bn.' },
    { q: 'In the base year, the GDP deflator always equals…', o: ['0', '1', '100', 'The inflation rate'], a: 2, why: 'In the base year, current prices equal base prices, so nominal = real and the deflator = 100.' }
  ],
  take: ['Nominal GDP uses current prices; real GDP uses base-year prices and tracks quantities.', 'GDP deflator = Nominal ÷ Real × 100.', 'Compare living standards with real GDP per capita.']
});

lesson({
  id: 'expenditure-approach', title: 'The Expenditure Approach', dur: '8:18 + 3:05', tags: 'consumption investment government spending net exports inventories savings investment identity budget deficit trade deficit twin deficits fiscal balance',
  hook: `Who buys everything the economy produces? Households, businesses, the government and foreigners. Add up what each group spends on final goods and services, and you get GDP. Then we'll use the same equation to link saving, the budget and trade.`,
  body: () => `
  <div class="formula" style="font-size:1.2rem;text-align:center"><b>GDP = C + I + G + (X − M)</b></div>
  <div class="cards">
    <div class="card"><div class="ic c-acc">C</div><h4>Consumption</h4><p>Household spending on goods and services: food, rent, phones, haircuts. Usually the largest part, often 55–70% of GDP.</p></div>
    <div class="card"><div class="ic c-plu">I</div><h4>Investment</h4><p>Business spending on <b>capital goods</b> (machines, buildings, software), new housing, and <b>changes in inventories</b>. Not shares or bonds!</p></div>
    <div class="card"><div class="ic c-sun">G</div><h4>Government</h4><p>Government purchases of goods and services. Excludes transfer payments.</p></div>
    <div class="card"><div class="ic c-min">X−M</div><h4>Net exports</h4><p>Exports add foreign spending on domestic output; imports are subtracted because they are produced abroad.</p></div>
  </div>
  ${W('exp')}
  <div class="pit"><p><b>Inventories:</b> if a firm produces 100 cars and sells only 90, the 10 unsold cars still count in GDP as <b>investment in inventories</b>. GDP measures production, not just sales.</p></div>
  <div class="pit"><p><b>Imports aren't "bad for GDP":</b> they are subtracted only because they were already included inside C, I and G. Subtracting them removes foreign production from the total.</p></div>
  <h2>Saving, the budget and the trade balance</h2>
  <p>Put the spending side and the income side together and an identity appears that links saving, investment, the government budget and the trade balance. It always holds.</p>
  <div class="steps"><ol>
    <li>Spending side: <span class="mono">GDP = C + I + G + (X − M)</span></li>
    <li>Income side: households consume, save or pay taxes: <span class="mono">GDP = C + S + T</span></li>
    <li>Set them equal and cancel C: <span class="mono">S + T = I + G + (X − M)</span></li>
    <li>Rearrange: <span class="mono"><b>S = I + (G − T) + (X − M)</b></span></li>
  </ol></div>
  <div class="formula"><span class="lbl">The fiscal balance version</span><b>(G − T) = (S − I) − (X − M)</b></div>
  <div class="idea"><p>A government deficit (G − T &gt; 0) must be financed by either a private saving surplus (S &gt; I) or by borrowing from abroad, which shows up as a trade deficit (X − M &lt; 0).</p></div>
  ${W('id')}
  ${say('ollie', 'This is an <b>accounting identity</b>, not a theory. It doesn\'t say which variable causes which. But it disciplines your thinking: if the government borrows more, <i>something</i> else in the equation must give.', 'think')}`,
  widgets: {
    exp(el) {
      el.innerHTML = lab('Build a GDP', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('C', 'Consumption (C)', 0, 1500, 10, 1300)}${slider('I', 'Investment (I)', 0, 600, 10, 380)}${slider('G', 'Government (G)', 0, 600, 10, 360)}
        ${slider('X', 'Exports (X)', 0, 600, 10, 220)}${slider('M', 'Imports (M)', 0, 600, 10, 260)}
        <div class="readout">${ro('GDP', 'gdp')}${ro('Net exports', 'nx')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> raise imports above exports. The red net-exports block turns negative and pulls GDP down.</p>`);
      const draw = () => {
        const C = val(el, 'C'), I = val(el, 'I'), G = val(el, 'G'), X = val(el, 'X'), M = val(el, 'M'), NX = X - M, Y = C + I + G + NX;
        ['C', 'I', 'G', 'X', 'M'].forEach(k => setO(el, k, '$' + val(el, k) + 'bn'));
        const Wd = 560, H = 230, mx = 3400, sc = (Wd - 40) / mx;
        const seg = [['C', C, 'fa-s'], ['I', I, 'fp-s'], ['G', G, 'fs-s']];
        let x = 20, svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="GDP stacked bar">`;
        seg.forEach(([n, v, c]) => { svg += `<rect x="${x}" y="40" width="${v * sc}" height="56" class="${c}" rx="3"/>${v * sc > 30 ? `<text x="${x + v * sc / 2}" y="73" text-anchor="middle" class="lab-t">${n}</text>` : ''}`; x += v * sc; });
        if (NX >= 0) { svg += `<rect x="${x}" y="40" width="${NX * sc}" height="56" class="fm-s" rx="3"/>${NX * sc > 30 ? `<text x="${x + NX * sc / 2}" y="73" text-anchor="middle" class="lab-t">NX</text>` : ''}`; x += NX * sc; }
        else { svg += `<rect x="${x + NX * sc}" y="104" width="${-NX * sc}" height="26" class="fc-s" rx="3"/><text x="${x + NX * sc / 2}" y="148" text-anchor="middle" class="lab-t c">NX ${NX}</text>`; x += NX * sc; }
        svg += `<line x1="${x}" x2="${x}" y1="24" y2="170" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3"/><text x="${x}" y="190" text-anchor="middle" class="lab-t">GDP = $${fmt0(Y)}bn</text>`;
        const share = v => Y > 0 ? fmt(v / Y * 100, 0) + '%' : '–';
        svg += `<text x="20" y="24" class="dg-s">Shares: C ${share(C)} · I ${share(I)} · G ${share(G)} · NX ${share(NX)}</text></svg>`;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px">${svg}</div>`;
        setT(el, 'gdp', '$' + fmt0(Y) + 'bn'); setT(el, 'nx', (NX >= 0 ? '+' : '') + NX);
        goal(el, 'Run a trade deficit while keeping GDP above $2,000bn.', NX < 0 && Y > 2000);
        $('#v', el).className = 'verdict ' + (NX < 0 ? 'warn' : '');
        $('#v', el).innerHTML = NX < 0 ? `A <b>trade deficit</b> of $${-NX}bn: the country buys more from abroad than it sells.` : NX > 0 ? `A <b>trade surplus</b> of $${NX}bn adds to domestic demand.` : 'Trade is balanced.';
      };
      el.addEventListener('input', draw); draw();
    },
    id(el) {
      el.innerHTML = lab('Balance the national accounts', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('S', 'Private saving (S)', 100, 500, 10, 300)}${slider('I', 'Investment (I)', 100, 500, 10, 260)}${slider('D', 'Budget deficit (G − T)', -100, 250, 10, 80)}
        <div class="readout">${ro('S − I', 'a')}${ro('Trade balance X − M', 'b')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> raise the budget deficit while keeping S and I fixed. The trade balance is forced into deficit: the "twin deficits".</p>`);
      const draw = () => {
        const S = val(el, 'S'), I = val(el, 'I'), D = val(el, 'D'), NX = S - I - D;
        setO(el, 'S', S); setO(el, 'I', I); setO(el, 'D', D);
        const Wd = 560, H = 250, mid = 280, sc = .42;
        const bar = (y, v, cls, label) => `<rect x="${v >= 0 ? mid : mid + v * sc}" y="${y}" width="${Math.abs(v) * sc}" height="30" class="${cls}" rx="3"/>
          <text class="dg-t" x="${mid - 250}" y="${y + 20}">${label}</text><text class="lab-t" x="${v >= 0 ? mid + v * sc + 6 : mid + v * sc - 6}" y="${y + 20}" text-anchor="${v >= 0 ? 'start' : 'end'}">${v}</text>`;
        let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Saving investment identity">`;
        svg += `<line x1="${mid}" x2="${mid}" y1="10" y2="${H - 20}" class="ax"/>`;
        svg += bar(20, S - I, 'fm-s', 'Private surplus S − I');
        svg += bar(80, -D, 'fs-s', 'Government balance T − G');
        svg += bar(140, NX, NX >= 0 ? 'fa-s' : 'fc-s', 'Trade balance X − M');
        svg += `<text class="dg-s" x="${mid}" y="${H - 6}" text-anchor="middle">(S − I) + (T − G) must equal (X − M)</text></svg>`;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px">${svg}</div>`;
        setT(el, 'a', S - I); setT(el, 'b', (NX > 0 ? '+' : '') + NX);
        goal(el, 'Run a budget deficit of 100 or more while keeping trade exactly balanced.', D >= 100 && NX === 0);
        $('#v', el).className = 'verdict ' + (NX < 0 ? 'warn' : 'good');
        $('#v', el).innerHTML = NX < 0 ? `Domestic saving can't cover investment plus the deficit, so the country borrows <b>${-NX}</b> from abroad: a trade deficit.` : `Domestic saving covers investment and the deficit with ${NX} left over, which is lent abroad: a trade surplus.`;
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [
    { q: 'C = 700, I = 200 (incl. +20 inventories), G = 250, X = 150, M = 180. GDP equals…', o: ['1,300', '1,120', '1,480', '1,280'], a: 1, why: 'GDP = 700 + 200 + 250 + (150 − 180) = 1,120. The inventory change is already inside I.' },
    { q: 'Private saving is 400, investment is 350 and the trade balance is −60. The fiscal balance (G − T) is…', o: ['A deficit of 110', 'A surplus of 110', 'A deficit of 10', 'A surplus of 10'], a: 0, why: 'G − T = (S − I) − (X − M) = 50 − (−60) = 110, a deficit of 110.' }
  ],
  take: ['GDP = C + I + G + (X − M).', 'Investment means new capital goods, residential construction and inventory changes, not financial assets.', 'Imports are subtracted because they were counted inside C, I and G.', 'S = I + (G − T) + (X − M): a government deficit is funded by excess private saving or by foreign borrowing (a trade deficit).']
});

lesson({
  id: 'income-approach', title: 'The Income Approach', dur: '7:24', tags: 'national income capital consumption allowance depreciation personal disposable income statistical discrepancy',
  hook: `Now let's walk the other side of the street. Every dollar of GDP ends up as somebody's income: a worker's wage, a landlord's rent, a firm's profit. Let's build GDP from incomes.`,
  body: () => `
  <div class="formula"><span class="lbl">From national income to GDP</span><b>GDP</b> = National income + Capital consumption allowance (CCA) + Statistical discrepancy</div>
  <div class="cards">
    <div class="card"><h4>National income includes</h4><ul><li>Compensation of employees (wages and benefits)</li><li>Corporate and government enterprise profits before taxes</li><li>Interest income</li><li>Unincorporated business net income (proprietors)</li><li>Rent</li><li>Indirect business taxes less subsidies</li></ul></div>
    <div class="card"><h4>Capital consumption allowance</h4><p>Depreciation: the wear and tear on capital used up in production. It is part of the price of output but nobody's income.</p></div>
    <div class="card"><h4>Statistical discrepancy</h4><p>The expenditure and income totals never match exactly in real data, so a balancing item is added.</p></div>
  </div>
  ${W('inc')}
  <h2>From national income to what households can spend</h2>

lesson({
  id: 'aggregate-demand', title: 'Aggregate Demand', dur: '9:46', tags: 'ad curve wealth effect interest rate effect exchange rate is lm',
  hook: `So far we've measured the economy. Now we model it. The first half of the model is <b>aggregate demand</b>: how much total output everyone wants to buy at each overall price level.`,
  body: () => `
  <div class="idea"><p>The <b>AD curve</b> shows the level of real GDP demanded (C + I + G + NX) at each price level. It slopes <b>downward</b>, but not for the same reason as a single demand curve.</p></div>
  <p>When <i>all</i> prices rise, you can't switch to a "cheaper good" inside the economy. Three economy-wide channels make the curve slope down:</p>
  <div class="cards">
    <div class="card"><div class="ic c-acc">1</div><h4>Wealth effect</h4><p>A higher price level cuts the <b>real value</b> of money and financial wealth. People feel poorer and consume less.</p></div>
    <div class="card"><div class="ic c-plu">2</div><h4>Interest rate effect</h4><p>Higher prices mean people need more money for transactions. Money demand rises, pushing <b>real interest rates</b> up, which reduces investment and big-ticket consumption.</p></div>
    <div class="card"><div class="ic c-min">3</div><h4>Exchange rate effect</h4><p>Domestic goods become pricier relative to foreign goods, so exports fall and imports rise: net exports drop.</p></div>
  </div>
  ${W('ad')}
  <h3>Where AD comes from: goods and money markets</h3>
  <p>In the more formal derivation, the <b>goods market</b> (the IS curve) links output to interest rates: lower rates mean more investment and output. The <b>money market</b> (the LM curve) links interest rates to output for a given real money supply. Raising the price level shrinks the real money supply (M/P), which pushes interest rates up and lowers equilibrium output. Tracing those equilibria as P changes produces the downward-sloping AD curve.</p>`,
  widgets: {
    ad(el) {
      el.innerHTML = lab('Slide the price level along AD', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('P', 'Price level', 80, 130, 1, 100)}
        <div class="readout">${ro('Real wealth index', 'a')}${ro('Real interest rate', 'b')}${ro('Net exports', 'c')}${ro('Real GDP demanded', 'd')}</div>
        <div class="plot" id="bars"></div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> raise the price level and watch every component of spending react, through the three channels.</p>`);
      const draw = () => {
        const P = val(el, 'P'); setO(el, 'P', P);
        const d = (P - 100) / 10;
        const C = 600 - 30 * d, I = 200 - 25 * d, G = 220, NX = 30 - 18 * d, Y = C + I + G + NX;
        const c = chart({ x: [700, 1200], y: [75, 135], xl: 'Real GDP demanded', yl: 'Price level', xt: [800, 900, 1000, 1100], yt: [80, 100, 120], grid: true, label: 'AD curve' });
        c.fn(y => 100 - (y - 1050) / 7.3, 'l1', 700, 1200).text(1170, 100 - (1170 - 1050) / 7.3, 'AD', 'a', 4, -10);
        c.guide(Y, P).dot(Y, P, 's', 7);
        $('#p', el).innerHTML = c.html();
        setT(el, 'a', fmt(10000 / P, 0)); setT(el, 'b', pct(2 + d * .8)); setT(el, 'c', fmt0(NX)); setT(el, 'd', fmt0(Y));
        const bars = [['C', C, 'fa-s'], ['I', I, 'fp-s'], ['G', G, 'fs-s'], ['NX', NX, 'fm-s']];
        $('#bars', el).innerHTML = `<svg viewBox="0 0 300 120" role="img" aria-label="Components">${bars.map(([n, v, cl], i) => `<text class="dg-s" x="4" y="${20 + i * 27}">${n}</text><rect x="34" y="${8 + i * 27}" width="${Math.max(1, v * .38)}" height="18" class="${cl}" rx="3"/><text class="lab-t" x="${40 + Math.max(1, v * .38)}" y="${21 + i * 27}" style="font-size:11px">${fmt0(v)}</text>`).join('')}</svg>`;
        $('#v', el).innerHTML = P > 100 ? 'Higher prices: real wealth falls (C ↓), interest rates rise (I ↓), exports get pricier (NX ↓). Quantity of real GDP demanded falls: a move <b>up along</b> AD.' : P < 100 ? 'Lower prices: real wealth rises, interest rates fall, exports become more competitive. Quantity of real GDP demanded rises: a move <b>down along</b> AD.' : 'Start here, then move the price level.';
        goal(el, 'Raise the price level until real GDP demanded drops below 900.', Y < 900);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Which is <b>not</b> a reason the AD curve slopes downward?', o: ['Wealth effect', 'Interest rate effect', 'Substitution toward cheaper domestic goods', 'Real exchange rate effect'], a: 2, why: 'When the overall price level rises, all domestic goods get pricier together, so there is no cheaper domestic good to switch to. That substitution logic is for single-market demand curves.' }],
  take: ['AD shows real GDP demanded at each price level.', 'It slopes down because of the wealth effect, the interest rate effect and the exchange rate effect.', 'A change in the price level moves the economy along AD; it does not shift it.']
});

lesson({
  id: 'aggregate-supply', title: 'Aggregate Supply', dur: '2:31', tags: 'vsras sras lras potential gdp horizontal vertical',
  hook: `The other half of the model: how much will firms produce at each price level? The answer depends on <b>how much time</b> we give wages and prices to adjust.`,
  body: () => `
  <div class="idea"><p>Aggregate supply has three time horizons. The longer the horizon, the more flexible input prices are, and the steeper the curve becomes.</p></div>
  ${W('as')}
  <div class="tblw"><table class="tbl"><tr><th>Horizon</th><th>Shape</th><th>Why</th></tr>
  <tr><td>Very short run (VSRAS)</td><td>Horizontal</td><td>Firms adjust output (overtime, idle machines) without changing prices.</td></tr>
  <tr><td>Short run (SRAS)</td><td>Upward sloping</td><td>Output prices can change but wages and many input costs are fixed by contracts. Higher prices raise profit margins, so firms produce more.</td></tr>
  <tr><td>Long run (LRAS)</td><td>Vertical at potential GDP</td><td>All prices, including wages, fully adjust. Output is set by labour, capital and technology, not by the price level.</td></tr></table></div>
  ${say('cog', 'From the factory floor: in the very short run, I just spin faster. In the short run, the boss notices our prices rose but my wage contract didn\'t, so he hires more. In the long run my wage catches up, and we\'re back to normal output.', 'joy', true)}`,
  widgets: {
    as(el) {
      el.innerHTML = lab('Three time horizons', `${segHTML('h', ['Very short run', 'Short run', 'Long run'], 1)}<div class="lab-grid"><div class="plot" id="p"></div><div class="verdict" id="v"></div></div>`);
      let h = 1;
      const txt = ['<b>VSRAS is horizontal.</b> Prices are fixed; firms meet any change in demand by varying output.', '<b>SRAS slopes upward.</b> A higher price level with sticky wages raises profits per unit, so firms expand output.', '<b>LRAS is vertical</b> at potential GDP. Once wages catch up with prices, real costs are unchanged, so output returns to what resources and technology allow.'];
      const draw = () => {
        const c = chart({ x: [0, 10], y: [0, 10], xl: 'Real GDP', yl: 'Price level', label: 'Aggregate supply horizons' });
        c.xtick(6, 'Y* (potential)');
        c.hline(5, h === 0 ? 'l4' : 'ghost', .5, 9.5).text(9.5, 5, 'VSRAS', h === 0 ? 's' : 'mu', 0, -8, 'end');
        c.fn(x => 1.4 + .6 * x, h === 1 ? 'l2' : 'ghost', .5, 9.5).text(9.3, 1.4 + .6 * 9.3, 'SRAS', h === 1 ? 'c' : 'mu', 0, -10, 'end');
        c.vline(6, h === 2 ? 'l3' : 'ghost', .5, 9.5).text(6, 9.5, 'LRAS', h === 2 ? 'm' : 'mu', 6, 6);
        $('#p', el).innerHTML = c.html(); $('#v', el).innerHTML = txt[h];
      };
      segBind(el, 'h', i => { h = i; draw(); }); draw();
    }
  },
  check: [{ q: 'The long-run aggregate supply curve is vertical because…', o: ['Firms cannot change output in the long run', 'Input prices fully adjust to the price level, so output depends only on real resources', 'The government fixes output', 'Demand is perfectly inelastic'], a: 1, why: 'In the long run wages and other input prices catch up with output prices. Real costs are unchanged, so output returns to potential GDP whatever the price level.' }],
  take: ['VSRAS is horizontal, SRAS slopes up, LRAS is vertical at potential GDP.', 'The shape depends on how flexible input prices are over the horizon.']
});

/* Shared AD/AS shifter widget factory */
function shifterWidget(el, factors, opts) {
  el.innerHTML = lab(opts.title, `<p class="hint-line">${opts.prompt}</p><div class="chips" id="ch">${factors.map((f, i) => `<button type="button" class="chip" data-i="${i}">${f.t}</button>`).join('')}</div>
    <div class="lab-grid"><div class="plot" id="p"></div><div class="ctls"><div class="verdict" id="v">Pick an event above.</div><button class="btn sm" type="button" id="rs">Reset</button></div></div>`);
  let sel = -1;
  const draw = () => {
    const f = factors[sel] || { ad: 0, sr: 0, lr: 0 };
    const ad = f.ad || 0, sr = f.sr || 0, lr = f.lr || 0;
    const c = chart({ x: [0, 12], y: [0, 12], xl: 'Real GDP', yl: 'Price level', label: 'AD AS shifts' });
    const AD = s => (y => 10.8 + s - .8 * y), SR = s => (y => 1.2 - s + .8 * y);
    c.xtick(6 + lr, 'Y*');
    if (ad) c.fn(AD(0), 'ghost', 1, 12); if (sr) c.fn(SR(0), 'ghost', 0, 12); if (lr) c.vline(6, 'ghost', .5, 11.5);
    c.vline(6 + lr, 'l3', .5, 11.5).text(6 + lr, 11.5, 'LRAS', 'm', 6, 6);
    c.fn(AD(ad), 'l1', 1, 12).text(11.6, AD(ad)(11.6), 'AD', 'a', 0, -10, 'end');
    c.fn(SR(sr), 'l2', 0, 12).text(11.4, Math.min(11.6, SR(sr)(11.4)), 'SRAS', 'c', -4, -8, 'end');
    const [x0, y0] = meet(10.8, -.8, 1.2, .8), [x1, y1] = meet(10.8 + ad, -.8, 1.2 - sr, .8);
    if (ad || sr) c.dot(x0, y0, '', 4);
    c.guide(x1, y1).dot(x1, y1, 's', 7);
    if (f.move) { const yy = 6 + f.move; const pp = AD(0)(yy); c.dot(yy, pp, 'p', 7).arrow(6, 6, yy - .3 * Math.sign(f.move), pp + .24 * Math.sign(f.move), 'l5'); }
    $('#p', el).innerHTML = c.html();
  };
  $('#ch', el).addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    sel = +b.dataset.i; $$('.chip', el).forEach(x => x.classList.toggle('on', x === b));
    const f = factors[sel];
    $('#v', el).className = 'verdict ' + (f.move ? 'warn' : '');
    $('#v', el).innerHTML = f.why; draw();
  });
  $('#rs', el).onclick = () => { sel = -1; $$('.chip', el).forEach(x => x.classList.remove('on')); $('#v', el).className = 'verdict'; $('#v', el).textContent = 'Pick an event above.'; draw(); };
  draw();
}

lesson({
  id: 'ad-shifts', title: 'Shifts in Aggregate Demand', dur: '5:37', tags: 'wealth expectations capacity utilization monetary fiscal exchange rate global growth',
  hook: `A change in the price level only slides us <b>along</b> AD. But plenty of other things can push the whole curve left or right. Let's poke the economy and see.`,

  <div class="tblw"><table class="tbl"><tr><th>Factor</th><th>Shifts AD right (increase) when…</th></tr>

  <tr><td>Consumer expectations</td><td>Consumers expect higher future incomes</td></tr>

        { t: 'Price level rises (trap!)', move: -1.5, why: '<b>No shift.</b> A higher price level moves the economy <b>along</b> the existing AD curve to a lower quantity of real GDP demanded (purple dot).' }
      ], { title: 'Shock the economy: demand side', prompt: 'Click an event and watch which curve moves. The grey dashed line is where it started.' });
    }
  },
  check: [{ q: 'Which event shifts aggregate demand to the <b>left</b>?', o: ['An increase in government spending', 'A depreciation of the domestic currency', 'A fall in household wealth', 'A cut in the policy interest rate'], a: 2, why: 'Lower wealth reduces consumption at every price level. The other three all increase AD.' }],

  },
  check: [{ q: 'An increase in the stock of physical capital will shift…', o: ['Only SRAS to the right', 'Only LRAS to the right', 'Both SRAS and LRAS to the right', 'AD to the left'], a: 2, why: 'More capital raises the economy\'s productive capacity (LRAS) and lowers costs at any output (SRAS).' }],
  take: ['Input prices, taxes, subsidies, expectations and exchange rates shift SRAS only.', 'Labour, capital, human capital, natural resources and technology shift both LRAS and SRAS.']
});

lesson({
  id: 'macro-equilibrium', title: 'The Macroeconomic Equilibrium', dur: '6:15', tags: 'recessionary gap inflationary gap stagflation full employment long run',
  hook: `Now we put AD, SRAS and LRAS on one graph. Where they meet tells us whether the economy is in a slump, overheating, or just right, and what happens next.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-min">=</div><h4>Long-run equilibrium</h4><p>AD and SRAS cross <b>on</b> LRAS. Output equals potential; unemployment is at its natural rate.</p></div>
    <div class="card"><div class="ic c-acc">&lt;</div><h4>Recessionary gap</h4><p>Output is <b>below</b> potential, often after AD falls. Unemployment rises and inflation slows.</p></div>
    <div class="card"><div class="ic c-cor">&gt;</div><h4>Inflationary gap</h4><p>Output is <b>above</b> potential after AD rises. Labour is scarce; wages and prices climb.</p></div>
    <div class="card"><div class="ic c-sun">!</div><h4>Stagflation</h4><p>SRAS shifts left (an input-price shock): output <b>falls</b> while prices <b>rise</b>. The worst of both.</p></div>
  </div>
  ${W('eq')}
  <h2>The long-run self-correction</h2>
  <ol><li><b>Recessionary gap</b>: unemployment pushes wages down over time, SRAS shifts right, and output returns to potential at a lower price level. Governments often don't wait and use stimulus instead.</li>
  <li><b>Inflationary gap</b>: tight labour markets push wages up, SRAS shifts left, and output returns to potential at a higher price level.</li></ol>`,
  widgets: {
    eq(el) {
      el.innerHTML = lab('Diagnose the economy', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('a', 'AD shift', -3, 3, .1, 0)}${slider('s', 'SRAS shift (− = cost shock)', -3, 3, .1, 0)}
        <button class="btn sm pri" type="button" id="lr">Let the long run play out</button>
        <div class="readout">${ro('Real GDP', 'y')}${ro('Price level', 'pl')}${ro('Output gap', 'g')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> 1) push AD left for a recession, then click the long-run button and watch wages adjust. 2) Pull SRAS left to create stagflation.</p>`);
      const host = $('#v', el);
      const draw = () => {
        const a = val(el, 'a'), s = val(el, 's');
        setO(el, 'a', fmt(a)); setO(el, 's', fmt(s));
        const c = chart({ x: [0, 12], y: [0, 12], xl: 'Real GDP', yl: 'Price level', label: 'Macroeconomic equilibrium' });
        c.xtick(6, 'Y*');
        c.vline(6, 'l3', .5, 11.5).text(6, 11.5, 'LRAS', 'm', 6, 6);
        if (a || s) { c.fn(y => 10.8 - .8 * y, 'ghost', 1, 12); c.fn(y => 1.2 + .8 * y, 'ghost', 0, 12); }
        c.fn(y => 10.8 + a - .8 * y, 'l1', 1, 12).text(11.6, 10.8 + a - .8 * 11.6, 'AD', 'a', 0, -10, 'end');
        c.fn(y => 1.2 - s + .8 * y, 'l2', 0, 12).text(11.2, Math.min(11.6, 1.2 - s + .8 * 11.2), 'SRAS', 'c', -4, -8, 'end');
        const [Y, P] = meet(10.8 + a, -.8, 1.2 - s, .8);
        const gap = (Y - 6) / 6 * 100;
        if (Math.abs(Y - 6) > .05) c.poly([[6, P], [Y, P], [Y, 0], [6, 0]], Y < 6 ? 'fa' : 'fc');
        c.guide(Y, P).dot(Y, P, 's', 7);
        $('#p', el).innerHTML = c.html();
        setT(el, 'y', fmt(Y, 2)); setT(el, 'pl', fmt(P / 6 * 100, 1)); setT(el, 'g', (gap > 0 ? '+' : '') + pct(gap));
        let m, cl;
        if (Math.abs(Y - 6) < .08) { m = '<b>Long-run equilibrium.</b> Output at potential, unemployment at its natural rate.'; cl = 'good'; }
        else if (Y < 6 && s < -.05 && P > 6.05) { m = '<b>Stagflation.</b> A cost shock has cut output <i>and</i> raised prices. Stimulating demand would worsen inflation; fighting inflation would deepen the slump.'; cl = 'bad'; }
        else if (Y < 6) { m = '<b>Recessionary gap.</b> Output below potential; unemployment above the natural rate. Over time wages fall and SRAS drifts right.'; cl = 'warn'; }
        else { m = '<b>Inflationary gap.</b> Output above potential. Labour shortages drive wages up, so SRAS will drift left.'; cl = 'bad'; }
        host.className = 'verdict ' + cl; host.innerHTML = m;
        goal(el, 'Create stagflation: output below potential while the price level rises above 100.', Y < 5.95 && s < -.05 && P > 6.05);
      };
      el.addEventListener('input', draw); draw();
      $('#lr', el).onclick = () => {
        const sEl = $('#s', el), target = -val(el, 'a');
        const start = +sEl.value, t0 = performance.now(), dur = 1400;
        const step = t => { const k = Math.min(1, (t - t0) / dur); sEl.value = start + (target - start) * (1 - (1 - k) ** 3); draw(); if (k < 1) requestAnimationFrame(step); };
        requestAnimationFrame(step);
      };
    }
  },
  check: [
    { q: 'An economy has real GDP above potential. In the long run, without policy action, we expect…', o: ['Wages to fall and SRAS to shift right', 'Wages to rise and SRAS to shift left', 'LRAS to shift right', 'AD to shift right'], a: 1, why: 'In an inflationary gap labour markets are tight, so nominal wages rise. That shifts SRAS left until output returns to potential at a higher price level.' },
    { q: 'Stagflation is most likely caused by…', o: ['A large increase in AD', 'A leftward shift of SRAS from a rise in input prices', 'A rightward shift of LRAS', 'A fall in the money supply'], a: 1, why: 'A cost shock shifts SRAS left: output falls while the price level rises at the same time.' }
  ],
  take: ['Equilibrium is where AD meets SRAS; it is a long-run equilibrium only on LRAS.', 'Recessionary gap: Y < Y*. Inflationary gap: Y > Y*. Stagflation: SRAS shifts left, so output falls and prices rise.', 'Wage adjustment moves SRAS and returns the economy to potential in the long run.']
});

lesson({
  id: 'combined-changes', title: 'The Effects of Combined Changes in AD and AS', dur: '1:31', tags: 'simultaneous shifts indeterminate ambiguous',
  hook: `In real life, demand and supply often move at once. When they do, one outcome is certain and the other depends on which shift is bigger. Let's find out which is which.`,
  body: () => `
  ${W('cb')}
  <div class="tblw"><table class="tbl"><tr><th>AD</th><th>AS</th><th>Real GDP</th><th>Unemployment</th><th>Price level</th></tr>
  <tr><td>Increase</td><td>Increase</td><td>Increases</td><td>Decreases</td><td>Indeterminate</td></tr>
  <tr><td>Decrease</td><td>Decrease</td><td>Decreases</td><td>Increases</td><td>Indeterminate</td></tr>
  <tr><td>Increase</td><td>Decrease</td><td>Indeterminate</td><td>Indeterminate</td><td>Increases</td></tr>
  <tr><td>Decrease</td><td>Increase</td><td>Indeterminate</td><td>Indeterminate</td><td>Decreases</td></tr></table></div>
  ${say('ollie', 'Memory trick: when AD and AS move in the <b>same</b> direction, they agree on output, so output is certain and price is not. When they move in <b>opposite</b> directions, they agree on price, so price is certain and output is not.', 'joy')}`,
  widgets: {
    cb(el) {
      el.innerHTML = lab('Move both curves at once', `${segHTML('ad', ['AD increases', 'AD decreases'])} ${segHTML('as', ['AS increases', 'AS decreases'])}
        <div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('r', 'Relative size: AD shift vs AS shift', .2, 3, .1, 1)}
        <div class="readout">${ro('Real GDP', 'y')}${ro('Price level', 'pl')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> pick a combination, then change the relative size. One variable always moves the same way; the other flips depending on size.</p>`);
      let ad = 1, as = 1;
      const draw = () => {
        const r = val(el, 'r'); setO(el, 'r', fmt(r, 1) + '×');
        const da = ad * 1.5 * Math.sqrt(r), ds = as * 1.5 / Math.sqrt(r);
        const c = chart({ x: [0, 12], y: [0, 12], xl: 'Real GDP', yl: 'Price level', label: 'Combined shifts' });
        c.fn(y => 10.8 - .8 * y, 'ghost', 1, 12).fn(y => 1.2 + .8 * y, 'ghost', 0, 12);
        c.fn(y => 10.8 + da - .8 * y, 'l1', 1, 12).text(11.6, 10.8 + da - .8 * 11.6, 'AD₂', 'a', 0, -10, 'end');
        c.fn(y => 1.2 - ds + .8 * y, 'l2', 0, 12).text(11.2, Math.min(11.6, 1.2 - ds + .8 * 11.2), 'AS₂', 'c', -4, -8, 'end');
        const [Y, P] = meet(10.8 + da, -.8, 1.2 - ds, .8);
        c.dot(6, 6, '', 4).guide(Y, P).dot(Y, P, 's', 7).arrow(6, 6, Y - (Y - 6) * .15, P - (P - 6) * .15, 'l4');
        $('#p', el).innerHTML = c.html();
        const dir = v => Math.abs(v) < .05 ? 'unchanged' : v > 0 ? 'up' : 'down';
        setT(el, 'y', dir(Y - 6)); setT(el, 'pl', dir(P - 6));
        const same = ad === as;
        $('#v', el).innerHTML = same ? `Both move the same way, so <b>real GDP ${ad > 0 ? 'rises' : 'falls'}</b> for sure. The price level is <b>indeterminate</b>: right now it went ${dir(P - 6)} because the ${Math.abs(da) > Math.abs(ds) ? 'AD' : 'AS'} shift is bigger.`
          : `They move in opposite directions, so <b>the price level ${ad > 0 ? 'rises' : 'falls'}</b> for sure. Real GDP is <b>indeterminate</b>: right now it went ${dir(Y - 6)} because the ${Math.abs(da) > Math.abs(ds) ? 'AD' : 'AS'} shift is bigger.`;
        goal(el, 'Make the price level fall while real GDP rises.', P < 5.95 && Y > 6.05);
      };
      segBind(el, 'ad', i => { ad = i ? -1 : 1; draw(); }); segBind(el, 'as', i => { as = i ? -1 : 1; draw(); });
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Government spending rises at the same time as oil prices surge. Which outcome is certain?', o: ['Real GDP rises', 'Real GDP falls', 'The price level rises', 'The price level falls'], a: 2, why: 'AD shifts right and SRAS shifts left. Both push the price level up; their effects on output offset, so output is indeterminate.' }],
  take: ['Same-direction shifts make output certain and the price level ambiguous.', 'Opposite-direction shifts make the price level certain and output ambiguous.']
});

lesson({
  id: 'growth-sources', title: 'Sources, Measurement, and Sustainability of Economic Growth', dur: '8:43', tags: 'potential gdp labor productivity capital technology human capital natural resources growth accounting',
  host: 'cog',
  hook: `I'm <b>Cog</b>. Business cycles are the waves; growth is the tide. Over decades, the only thing that really raises living standards is producing more with what we have. Here's where growth comes from.`,
  body: () => `
  <div class="idea"><p>Long-run, sustainable growth means growth in <b>potential GDP</b>: the output the economy can produce when all resources are fully employed. It shifts LRAS to the right.</p></div>
  <div class="formula"><span class="lbl">Two ways to slice potential GDP growth</span>Potential GDP growth = Labour force growth + Labour productivity growth<br>Growth accounting: <b>%ΔY = %ΔA + α·%ΔK + (1 − α)·%ΔL</b></div>
  <div class="cards">
    <div class="card"><h4>Labour</h4><p>Population growth, labour force participation and average hours worked.</p></div>
    <div class="card"><h4>Human capital</h4><p>Education, training and health make each worker more productive.</p></div>
    <div class="card"><h4>Physical capital</h4><p>Machines, buildings and infrastructure, accumulated through investment.</p></div>
    <div class="card"><h4>Technology</h4><p>Better ways of combining inputs, measured as total factor productivity (TFP).</p></div>
    <div class="card"><h4>Natural resources</h4><p>Renewable and non-renewable. Helpful, but not decisive: many resource-poor countries are rich.</p></div>
  </div>
  ${W('ga')}
  <h2>Is the growth sustainable?</h2>
  <p>Growth from adding more workers runs into demographic limits, and growth from piling up capital runs into <b>diminishing returns</b>. Only rising <b>productivity</b>, especially technological progress, can sustain higher living standards indefinitely. That's why economists watch labour productivity so closely.</p>
  <details class="reveal"><summary>Think first: why is labour productivity the key to living standards?<span class="hint">tap to reveal</span></summary><div>Output per person depends on output per worker. If the number of workers grows with the population, only higher output per worker (productivity) raises income per person.</div></details>`,
  widgets: {
    ga(el) {
      el.innerHTML = lab('Growth accounting simulator', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('L', 'Labour growth %ΔL', -1, 3, .1, 1)}${slider('K', 'Capital growth %ΔK', 0, 8, .1, 3)}${slider('A', 'TFP growth %ΔA', 0, 3, .1, 1)}${slider('al', 'Capital share α', .2, .5, .01, .35)}
        <div class="readout">${ro('Potential GDP growth', 'g')}${ro('Labour productivity growth', 'lp')}${ro('Years to double', 'd')}</div></div></div>
        <p class="hint-line"><b>Try:</b> set TFP growth to zero. Growth now relies only on piling up inputs. Then compare: an extra 1% of TFP adds a full 1% to growth.</p>`);
      const draw = () => {
        const L = val(el, 'L'), K = val(el, 'K'), A = val(el, 'A'), al = val(el, 'al');
        setO(el, 'L', pct(L)); setO(el, 'K', pct(K)); setO(el, 'A', pct(A)); setO(el, 'al', fmt(al, 2));
        const parts = [['TFP', A, 'fp-s'], ['Capital α·%ΔK', al * K, 'fa-s'], ['Labour (1−α)·%ΔL', (1 - al) * L, 'fs-s']];
        const g = A + al * K + (1 - al) * L;
        const c = chart({ x: [0, 30], y: [0, 4], xl: 'Years', yl: 'Potential GDP (index, start = 1)', xt: [0, 10, 20, 30], yt: [1, 2, 3, 4], grid: true, h: 300, label: 'Potential GDP path' });
        c.fn(t => (1.02) ** t, 'ghost', 0, 30).text(30, 1.02 ** 30, '2% benchmark', 'mu', -4, 16, 'end');
        c.fn(t => (1 + g / 100) ** t, 'l3', 0, 30).text(Math.min(30, Math.log(3.9) / Math.log(1 + Math.max(.001, g) / 100)), Math.min(3.9, (1 + g / 100) ** 30), 'Your economy', 'm', -4, -10, 'end');
        let bars = `<svg viewBox="0 0 560 70" role="img" aria-label="Growth contributions">`; let x = 10; const sc = 500 / 10;
        parts.forEach(([n, v, cl]) => { if (v > 0) { bars += `<rect x="${x}" y="10" width="${v * sc}" height="26" class="${cl}" rx="3"/>${v * sc > 60 ? `<text x="${x + v * sc / 2}" y="28" text-anchor="middle" class="lab-t" style="font-size:11px">${fmt(v, 2)}</text>` : ''}`; x += v * sc; } });
        bars += `<text x="10" y="58" class="dg-s">Contributions: purple = TFP, blue = capital, yellow = labour · total ${fmt(g, 2)}%</text></svg>`;
        $('#p', el).innerHTML = c.html() + `<div style="margin-top:8px;background:var(--chart-bg);border:1px solid var(--line);border-radius:12px">${bars}</div>`;
        setT(el, 'g', pct(g, 2)); setT(el, 'lp', pct(g - L, 2)); setT(el, 'd', g > 0 ? fmt(70 / g, 0) + ' yrs' : 'never');
        goal(el, 'Reach at least 3% potential growth with TFP growth of 1% or less.', g >= 3 && A <= 1);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Labour force growth is 1% and labour productivity growth is 2%. Potential GDP growth is approximately…', o: ['1%', '2%', '3%', '0.5%'], a: 2, why: 'Potential GDP growth ≈ labour force growth + labour productivity growth = 1% + 2% = 3%.' }],
  take: ['Sustainable growth = growth of potential GDP (a rightward LRAS shift).', 'Sources: labour, human capital, physical capital, technology, natural resources.', 'Productivity, above all technology, is the only lasting source of higher living standards.']
});

lesson({
  id: 'production-function', title: 'The Production Function', dur: '5:07', tags: 'cobb douglas total factor productivity diminishing marginal returns capital deepening ai artificial intelligence automation robots income share j-curve',
  host: 'cog',
  hook: `Give my factory one more machine and we produce a lot more. Give it a hundredth more machine with the same workers and it barely helps. That's <b>diminishing returns</b>, and it's built into the production function. At the end, we'll ask what AI does to it.`,
  body: () => `
  <div class="formula"><span class="lbl">Neoclassical (Cobb-Douglas) production function</span><b>Y = A · K<sup>α</sup> · L<sup>1−α</sup></b> &nbsp;&nbsp;&nbsp; per worker: <b>y = A · k<sup>α</sup></b> where k = K/L</div>
  <div class="cards">
    <div class="card"><h4>A: total factor productivity</h4><p>Technology and efficiency. It's measured as the residual: the growth not explained by K and L.</p></div>
    <div class="card"><h4>α: capital share</h4><p>The share of income paid to capital, typically around 0.3–0.4. Labour gets 1 − α. Since α &lt; 1, returns to capital diminish.</p></div>
    <div class="card"><h4>Capital deepening</h4><p>Raising capital per worker (k) moves you <b>along</b> the curve, with smaller and smaller gains.</p></div>
    <div class="card"><h4>Technological progress</h4><p>Raising A shifts the <b>whole curve</b> up, so every level of capital produces more.</p></div>
  </div>
  ${W('pf')}
  ${say('cog', 'This is why growth through capital alone eventually stalls. A rich country with lots of capital per worker gains little from more of it. Only a higher A keeps the curve moving up.', 'think', true)}
  <h2>AI, automation and the production function</h2>
  <p>Artificial intelligence and robotics are the newest test of this model. Economists expect them to work through three channels:</p>
  <div class="cards">
    <div class="card"><div class="ic c-plu">A↑</div><h4>A boost to TFP</h4><p>AI that writes code, drafts documents or optimises logistics lets the same workers and machines produce more. That raises <b>A</b> and shifts the curve up.</p></div>
    <div class="card"><div class="ic c-acc">α↑</div><h4>A shift toward capital</h4><p>If AI systems substitute for tasks people used to do, a larger share of income goes to the owners of capital: <b>α rises</b> and labour's share (1 − α) falls, even if total labour income grows.</p></div>
    <div class="card"><div class="ic c-cor">SR</div><h4>Short-run displacement</h4><p>Workers in exposed jobs face <b>structural unemployment</b> while they retrain. Firms also need time to reorganise, so measured productivity can dip before it rises: the <b>productivity J-curve</b>.</p></div>
  </div>
  ${W('jc')}
  <details class="reveal"><summary>Think first: if labour's share of income falls, must workers be worse off?<span class="hint">tap to reveal</span></summary><div>Not necessarily. Labour income per worker is (1 − α) × y. If AI raises output per worker y enough, workers can get a <b>smaller slice of a bigger pie</b> and still earn more. The lab above shows both numbers. The distribution question is real, though: the gains go disproportionately to capital owners unless policy (education, taxes, transfers) spreads them.</div></details>`,
  widgets: {
    pf(el) {
      el.innerHTML = lab('Capital deepening, technology and AI', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('k', 'Capital per worker (k)', .5, 20, .5, 4)}${slider('A', 'Technology (A)', .6, 2, .05, 1)}${slider('al', 'Capital share (α)', .2, .6, .01, .33)}
        <div class="btn-row"><button class="btn sm pri" type="button" id="ai">AI adoption shock</button><button class="btn sm" type="button" id="rs">Reset</button></div>
        <div class="readout">${ro('Output per worker y', 'y')}${ro('MPK (slope)', 'mp')}${ro('Gain from +1 k', 'gn')}</div>
        <div class="plot" id="sh"></div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> slide k from 1 to 20 and watch the slope (MPK) shrink. Then press <b>AI adoption shock</b>: A jumps 30% and α rises by 0.07. The grey curve is the starting economy.</p>`, 'Try it', 'Raise output per worker at k = 4 by at least 40% compared with the starting economy (A = 1, α = 0.33).');
      const y0 = x => x ** .33;
      const draw = () => {
        const k = val(el, 'k'), A = val(el, 'A'), al = val(el, 'al');
        setO(el, 'k', fmt(k, 1)); setO(el, 'A', fmt(A, 2)); setO(el, 'al', fmt(al, 2));
        const f = x => A * x ** al, y = f(k), mpk = al * A * k ** (al - 1);
        const ymax = Math.max(4, 2.05 * 21 ** al);
        const c = chart({ x: [0, 21], y: [0, ymax], xl: 'Capital per worker k', yl: 'Output per worker y', xt: [0, 5, 10, 15, 20], yt: nice(ymax), grid: true, label: 'Per-worker production function' });
        c.fn(y0, 'ghost', 0, 21).text(20, y0(20), 'start', 'mu', 0, 16, 'end');
        c.fn(f, 'l5', 0.01, 21).text(20.5, f(20.5), 'y = A·k^α', 'p', 0, -10, 'end');
        c.line([[k - 3, y - 3 * mpk], [k + 3, y + 3 * mpk]], 'l4 thin');
        c.guide(k, y).dot(k, y, 's', 7);
        $('#p', el).innerHTML = c.html();
        setT(el, 'y', fmt(y, 2)); setT(el, 'mp', fmt(mpk, 3)); setT(el, 'gn', '+' + fmt(f(k + 1) - y, 3));
        const ls0 = .67 * y0(k), ls = (1 - al) * y;
        $('#sh', el).innerHTML = `<svg viewBox="0 0 300 74" role="img" aria-label="Income shares: capital ${fmt0(al * 100)} percent, labour ${fmt0((1 - al) * 100)} percent">
          <text class="dg-s" x="0" y="12">Income shares</text>
          <rect x="0" y="20" width="${al * 300}" height="22" class="fa-s" rx="3"/><rect x="${al * 300}" y="20" width="${(1 - al) * 300}" height="22" class="fs-s" rx="3"/>
          <line x1="99" x2="99" y1="16" y2="46" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2"/>
          <text class="lab-t" x="4" y="36" style="font-size:11px">Capital ${fmt0(al * 100)}%</text><text class="lab-t" x="296" y="36" text-anchor="end" style="font-size:11px">Labour ${fmt0((1 - al) * 100)}%</text>
          <text class="dg-s" x="0" y="64">Dashed line = starting capital share (33%)</text></svg>`;
        const dy = (y / y0(k) - 1) * 100, dl = (ls / ls0 - 1) * 100;
        $('#v', el).innerHTML = `At k = ${fmt(k, 1)}: output per worker is <b>${dy >= 0 ? '+' : ''}${fmt(dy, 0)}%</b> versus the starting economy. Labour's share is ${fmt0((1 - al) * 100)}% (was 67%), and labour income per worker is <b>${dl >= 0 ? '+' : ''}${fmt(dl, 0)}%</b>.${al > .34 && dl > 0 ? ' A smaller slice of a bigger pie.' : ''}`;
        goal(el, 'Raise output per worker at k = 4 by at least 40% compared with the starting economy (A = 1, α = 0.33).', Math.abs(k - 4) < .01 && y >= 1.4 * y0(4));
      };
      const tween = (to) => {
        const from = { A: val(el, 'A'), al: val(el, 'al') }, t0 = performance.now();
        const step = t => { const p = Math.min(1, (t - t0) / 900), e = 1 - (1 - p) ** 3;
          $('#A', el).value = from.A + (to.A - from.A) * e; $('#al', el).value = from.al + (to.al - from.al) * e; draw(); if (p < 1) requestAnimationFrame(step); };
        requestAnimationFrame(step);
      };
      $('#ai', el).onclick = () => { $('#k', el).value = 4; tween({ A: Math.min(2, val(el, 'A') * 1.3), al: Math.min(.6, val(el, 'al') + .07) }); };
      $('#rs', el).onclick = () => { $('#k', el).value = 4; tween({ A: 1, al: .33 }); };
      el.addEventListener('input', draw); draw();
    },
    jc(el) {
      el.innerHTML = lab('The productivity J-curve', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('inv', 'Complementary investment (reskilling, reorganisation)', 0, 100, 5, 30)}
        <div class="readout">${ro('Payoff starts after', 'l')}${ro('Long-run productivity gain', 'g')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> AI needs new skills, data and workflows before it pays off. Raise complementary investment and watch the dip get shallower and the payoff arrive sooner.</p>`, 'Try it', 'Get the productivity payoff to start within 3 years of AI adoption.');
      const draw = () => {
        const inv = val(el, 'inv') / 100; setO(el, 'inv', fmt0(inv * 100) + '%');
        const L = 6 - 4 * inv, D = 1.2 - .8 * inv, G = 1 + 1.5 * inv;
        const J = t => t < L ? -D * Math.sin(Math.PI * t / L) : G * (1 - Math.exp(-(t - L) / 2.5));
        const U = t => 1.5 * Math.exp(-t / (2 + 4 * (1 - inv)));
        const c = chart({ x: [0, 15], y: [-1.5, 3], xl: 'Years after AI adoption', yl: 'Percentage points', xt: [0, 5, 10, 15], yt: [-1, 0, 1, 2, 3], grid: true, h: 280, label: 'Productivity J-curve' });
        c.hline(0, 'gridl').fn(J, 'l5', 0, 15, 150).fn(U, 'l2', 0, 15, 150).vline(L, 'guide', -1.5, 3);
        c.text(15, J(15), 'productivity vs trend', 'p', -4, -10, 'end').text(.4, U(.4), 'displaced workers (structural unemployment)', 'c', 0, -10);
        $('#p', el).innerHTML = c.html();
        setT(el, 'l', fmt(L, 1) + ' yrs'); setT(el, 'g', '+' + fmt(G, 1) + ' pp');
        $('#v', el).innerHTML = `Productivity dips by up to ${fmt(D, 1)} pp while firms reorganise, turns positive after about ${fmt(L, 1)} years, and settles ${fmt(G, 1)} pp above trend. Displaced workers find new roles faster when retraining is funded.`;
        goal(el, 'Get the productivity payoff to start within 3 years of AI adoption.', L <= 3);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [
    { q: 'In the neoclassical model, an increase in total factor productivity…', o: ['Moves the economy along the per-worker production function', 'Shifts the production function upward', 'Raises α above 1', 'Has no effect on long-run growth'], a: 1, why: 'Higher A means more output from every combination of capital and labour, so the whole curve shifts up. More capital per worker would be a movement along it.' },
    { q: 'AI raises total factor productivity and also raises the capital share α. Which outcome is most consistent with the Cobb-Douglas model?', o: ['Output per worker falls', 'Output per worker rises while labour\'s share of income falls', 'Labour\'s share rises', 'Diminishing returns to capital disappear'], a: 1, why: 'Higher A shifts the curve up; a higher α means capital receives a larger fraction of income, so labour\'s share 1 − α falls even as output grows.' }
  ],
  take: ['Y = A·K^α·L^(1−α); per worker y = A·k^α.', 'Because α < 1, each extra unit of capital per worker adds less output: diminishing marginal returns.', 'Sustained growth in output per worker requires technological progress (rising A).', 'AI can raise A and shift income toward capital (higher α), with short-run displacement and a productivity J-curve before long-run gains.']
});
