          <button type="button" data-act="png" class="kn-pri">${ico('save')}<span>Save PNG</span></button>
          <button type="button" data-act="close" aria-label="Close notes (Esc)">${ico('x')}<span>Close</span></button>
        </div>
      </div>
      <div class="kn-wrap"><canvas class="kn-c" aria-label="Drawing area for your notes"></canvas><textarea class="kn-ta" rows="1" aria-label="Type a note, press Enter to place it" hidden></textarea></div>
      <div class="kn-foot"><span class="kn-status" aria-live="polite"></span><span class="kn-tip">Draw with a mouse, pen or finger · Text tool: click, type, Enter · Shift+Enter for a new line</span></div>
      <div class="kn-prev" hidden><div class="kn-prev-box"><div class="kn-prev-h"><b>Your PNG is ready</b><button type="button" data-act="prevclose">Close</button></div>
        <p>If the download did not start, right-click the image (or long-press on a phone) and choose <b>Save image</b>.</p><img alt="Exported notes page"></div></div>`;
    document.body.appendChild(root);
    cv = root.querySelector('.kn-c'); ctx = cv.getContext('2d'); ta = root.querySelector('.kn-ta');
    root.querySelector('.kn-title').textContent = 'Notes · ' + cfg.title;

    root.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.tool) setTool(b.dataset.tool);
      else if (b.dataset.color) { color = b.dataset.color; if (tool === 'er') setTool('pen'); sync(); }
      else if (b.dataset.size) { size = +b.dataset.size; sync(); }
      else act(b.dataset.act, b);
    });
    root.querySelector('.kn-paper select').addEventListener('change', e => { paper = e.target.value; applyPaper(); persist(); });
    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', moveP);
    window.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); }
      if (e.key === 'Escape') { e.stopPropagation(); ta.value = ''; ta.hidden = true; }
      autosize();
    });
    ta.addEventListener('input', autosize);
    ta.addEventListener('blur', () => { const tok = ta.dataset.tok; setTimeout(() => { if (ta.dataset.tok === tok) commitText(); }, 0); });
    root.addEventListener('keydown', e => {
      if (e.target === ta) return;
      const k = e.key.toLowerCase();
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); act(e.shiftKey ? 'redo' : 'undo'); }
      else if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); act('redo'); }
      else if (!e.ctrlKey && !e.metaKey && !e.altKey && { p: 'pen', h: 'hl', e: 'er', t: 'tx' }[k]) setTool({ p: 'pen', h: 'hl', e: 'er', t: 'tx' }[k]);
      else if (e.key === 'Tab') trap(e);
    });
    window.addEventListener('resize', () => { if (!root.hidden) fit(); });
  }
  function trap(e) {
    const f = [...root.querySelectorAll('button, select, textarea:not([hidden]), canvas')].filter(x => !x.closest('[hidden]'));
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
  function setTool(t) { if (ta && !ta.hidden) commitText(); tool = t; sync(); }
  function sync() {
    root.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === tool));
    root.querySelectorAll('[data-color]').forEach(b => b.setAttribute('aria-pressed', b.dataset.color === color));
    root.querySelectorAll('[data-size]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.size === size));
    root.querySelector('.kn-paper select').value = paper;
    root.querySelector('.kn-pg').textContent = `Page ${page + 1} / ${data.pages.length}`;
    cv.style.cursor = tool === 'tx' ? 'text' : 'crosshair';
  }
  function applyPaper() { root.querySelector('.kn-wrap').dataset.paper = paper; }
  function fit() {
    const r = cv.parentElement.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
    cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }
  function pt(e) { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * 10) / 10, Math.round((e.clientY - r.top) * 10) / 10, e.pressure && e.pointerType === 'pen' ? e.pressure : .5]; }
  function strokeStyle(c, op) {
    c.lineCap = 'round'; c.lineJoin = 'round';
    if (op.tool === 'er') { c.globalCompositeOperation = 'destination-out'; c.strokeStyle = '#000'; c.lineWidth = op.w * 5; c.globalAlpha = 1; }
    else if (op.tool === 'hl') { c.globalCompositeOperation = 'multiply'; c.strokeStyle = op.c; c.lineWidth = op.w * 4 + 6; c.globalAlpha = .28; }
    else { c.globalCompositeOperation = 'source-over'; c.strokeStyle = op.c; c.lineWidth = op.w; c.globalAlpha = 1; }
  }
  function drawOp(c, op) {
    c.save();
    if (op.t === 'x') {
      c.globalCompositeOperation = 'source-over'; c.fillStyle = op.c; c.font = `${op.s}px "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif`; c.textBaseline = 'top';
      op.text.split('\n').forEach((line, i) => c.fillText(line, op.x, op.y + i * op.s * 1.3));
    } else {
      strokeStyle(c, op);
      const p = op.pts;
      c.beginPath(); c.moveTo(p[0][0], p[0][1]);
      if (p.length === 1) c.lineTo(p[0][0] + .1, p[0][1] + .1);
      for (let i = 1; i < p.length - 1; i++) { const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2; c.quadraticCurveTo(p[i][0], p[i][1], mx, my); }
      if (p.length > 1) c.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
      c.stroke();
    }
    c.restore();
  }
  function redraw() { const w = cv.width, h = cv.height; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h); ctx.restore(); P().ops.forEach(op => drawOp(ctx, op)); }
  function down(e) {
    if (e.button && e.button !== 0) return;
    if (tool === 'tx') { e.preventDefault(); placeText(e); return; }
    cv.setPointerCapture(e.pointerId);
    const [x, y] = pt(e);
    drawing = { t: 's', tool, c: color, w: size, pts: [[x, y]] };
    e.preventDefault();
  }
  function moveP(e) {
    if (!drawing) return;
    const co = e.getCoalescedEvents ? e.getCoalescedEvents() : null, evs = co && co.length ? co : [e];
    evs.forEach(ev => { const [x, y] = pt(ev), l = drawing.pts[drawing.pts.length - 1]; if (Math.hypot(x - l[0], y - l[1]) >= 1.2) drawing.pts.push([x, y]); });
    redraw(); drawOp(ctx, drawing);
  }
  function up() {
    if (!drawing) return;
    P().ops.push(drawing); P().redo = []; drawing = null; redraw(); persist();
  }
  function placeText(e) {
    if (!ta.hidden) commitText();
    const [x, y] = pt(e), s = size * 3 + 10;
    ta.hidden = false; ta.value = '';
    Object.assign(ta.style, { left: x + 'px', top: y + 'px', fontSize: s + 'px', color, width: '240px' });
    ta.dataset.tok = String(Date.now() + Math.random()); ta.dataset.x = x; ta.dataset.y = y; ta.dataset.s = s; ta.dataset.c = color;
    setTimeout(() => ta.focus(), 0);
  }
  function autosize() { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; const lines = ta.value.split('\n'); ta.style.width = Math.max(120, Math.min(600, Math.max(...lines.map(l => l.length)) * +ta.dataset.s * .6 + 30)) + 'px'; }
  function commitText() {
    if (ta.hidden) return;
    const text = ta.value.replace(/\s+$/, '');
    ta.hidden = true;
    if (!text) return;
    P().ops.push({ t: 'x', x: +ta.dataset.x, y: +ta.dataset.y, s: +ta.dataset.s, c: ta.dataset.c, text });
    P().redo = []; ta.value = ''; redraw(); persist();
  }
  function act(a, btn) {
    if (a === 'undo') { const op = P().ops.pop(); if (op) P().redo.push(op); redraw(); persist(); }
    else if (a === 'redo') { const op = P().redo.pop(); if (op) P().ops.push(op); redraw(); persist(); }
    else if (a === 'clear') {
      if (Date.now() - clearArm < 3000) { P().redo = P().ops.reverse().concat(P().redo); P().ops = []; clearArm = 0; btn.textContent = 'Clear page'; redraw(); persist(); status('Page cleared. Undo brings it back.'); }
      else { clearArm = Date.now(); btn.textContent = 'Click again to clear'; setTimeout(() => { if (btn.textContent !== 'Clear page' && Date.now() - clearArm >= 2900) btn.textContent = 'Clear page'; }, 3000); }
    }
    else if (a === 'prev' && page > 0) { page--; redraw(); sync(); persist(); }
    else if (a === 'next' && page < data.pages.length - 1) { page++; redraw(); sync(); persist(); }
    else if (a === 'add') { data.pages.push({ ops: [], redo: [] }); page = data.pages.length - 1; redraw(); sync(); persist(); }
    else if (a === 'png') exportPNG();
    else if (a === 'close') close();
    else if (a === 'prevclose') root.querySelector('.kn-prev').hidden = true;
  }
  function paperOn(c, w, h) {
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(43,89,195,.16)'; c.fillStyle = 'rgba(43,89,195,.28)'; c.lineWidth = 1;
    if (paper === 'grid') { for (let x = 24; x < w; x += 24) { c.beginPath(); c.moveTo(x + .5, 0); c.lineTo(x + .5, h); c.stroke(); } for (let y = 24; y < h; y += 24) { c.beginPath(); c.moveTo(0, y + .5); c.lineTo(w, y + .5); c.stroke(); } }
    if (paper === 'lines') { for (let y = 40; y < h; y += 32) { c.beginPath(); c.moveTo(0, y + .5); c.lineTo(w, y + .5); c.stroke(); } c.strokeStyle = 'rgba(207,71,50,.35)'; c.beginPath(); c.moveTo(60.5, 0); c.lineTo(60.5, h); c.stroke(); }
    if (paper === 'dots') for (let y = 24; y < h; y += 24) for (let x = 24; x < w; x += 24) c.fillRect(x - 1, y - 1, 2, 2);
  }
  function exportPNG() {
    commitText();
    const r = cv.getBoundingClientRect(), w = Math.round(r.width), h = Math.round(r.height), scale = 2;
    const out = document.createElement('canvas'); out.width = w * scale; out.height = h * scale;
    const c = out.getContext('2d'); c.scale(scale, scale);
    paperOn(c, w, h);
    const layer = document.createElement('canvas'); layer.width = w * scale; layer.height = h * scale;
    const lc = layer.getContext('2d'); lc.scale(scale, scale); P().ops.forEach(op => drawOp(lc, op));
    c.drawImage(layer, 0, 0, w, h);
    const d = new Date(), stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    c.fillStyle = 'rgba(21,34,47,.45)'; c.font = '12px "JetBrains Mono", monospace'; c.textAlign = 'right';
    c.fillText(`${cfg.title} · page ${page + 1} · ${stamp}`, w - 12, h - 12);
    let url;
    try { url = out.toDataURL('image/png'); } catch (e) { status('The browser blocked the export.'); return; }
    const slug = (cfg.title || 'notes').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
    const name = `${slug}-notes-page${page + 1}-${stamp}.png`;
    const preview = () => { const pv = root.querySelector('.kn-prev'); pv.querySelector('img').src = url; pv.hidden = false; pv.querySelector('[data-act="prevclose"]').focus(); };
    if (DL) {
      out.toBlob(blob => {
        DL.save({ filename: name, data: blob }).then(() => status('PNG saved: ' + name))
          .catch(err => { if (err && err.code === 'declined') status('Save cancelled.'); else { status('Saving is not available here. Right-click the image to save it.'); preview(); } });
      }, 'image/png');
      return;
    }
    try { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { /* downloads blocked */ }
    preview();
    status('PNG exported: ' + name);
  }
  function open() {
    build(); load();
    lastFocus = document.activeElement;
    root.hidden = false; document.documentElement.classList.add('kn-open');
    applyPaper(); sync(); fit();
    status(data.pages.some(p => p.ops.length) ? 'Your notes for this course are loaded.' : 'A fresh board. Your notes save automatically in this browser.');
    root.querySelector(`[data-tool="${tool}"]`).focus();
  }
  function close() {
    if (!built || root.hidden) return;
    commitText(); persist(true);
    root.hidden = true; root.querySelector('.kn-prev').hidden = true; document.documentElement.classList.remove('kn-open');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function init(c) {
    cfg = Object.assign(cfg, c || {});
    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if ((e.key === 'n' || e.key === 'N') && !(built && !root.hidden)) {
        const t = e.target, tag = t && t.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable) || (t && t.tagName === 'CANVAS')) return;
        e.preventDefault(); open();
      }
    });
  }
  return { init, open, close, toggle: () => (built && !root.hidden ? close() : open()) };
})();

boot();
</script>

</body>
