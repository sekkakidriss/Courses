<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive macroeconomics course: every concept explained with graphs, simulations, games and friendly guides.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap">
<style>
/* Layout: fixed course-map sidebar on the left, a reading column on graph paper on the right; labs break out slightly wider than the text column. */
:root {
  --bg: #EDF1F5;
  --paper: #F6F8FA;
  --surface: #FFFFFF;
  --surface-2: #E7EDF3;
  --ink: #15222F;
  --muted: #536375;
  --line: #D2DBE4;
  --grid: rgba(43, 89, 195, .065);
  --accent: #2B59C3;
  --accent-ink: #FFFFFF;
  --accent-soft: #DFE7FA;
  --sun: #C97F06;
  --sun-fill: #F2B53A;
  --sun-soft: #FCEFD6;
  --coral: #CF4732;
  --coral-soft: #FBE3DE;
  --mint: #16865F;
  --mint-soft: #D9F2E8;
  --plum: #7547B0;
  --plum-soft: #ECE3F8;
  --shadow: 0 1px 2px rgba(21, 34, 47, .06), 0 6px 20px rgba(21, 34, 47, .06);
  --chart-bg: #FFFFFF;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
  --side: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1823; --paper: #111D2A; --surface: #172636; --surface-2: #1E3044;
    --ink: #E6EDF4; --muted: #9DB1C4; --line: #2A3F55; --grid: rgba(127, 164, 255, .06);
    --accent: #86A8FF; --accent-ink: #0E1823; --accent-soft: #1F3156;
    --sun: #F5BF5B; --sun-fill: #F2B53A; --sun-soft: #3A2E17;
    --coral: #FF8A76; --coral-soft: #42231F; --mint: #52D3A3; --mint-soft: #16372C;
    --plum: #BD9BF2; --plum-soft: #2D2343;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    --chart-bg: #142232;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1823; --paper: #111D2A; --surface: #172636; --surface-2: #1E3044;
  --ink: #E6EDF4; --muted: #9DB1C4; --line: #2A3F55; --grid: rgba(127, 164, 255, .06);
  --accent: #86A8FF; --accent-ink: #0E1823; --accent-soft: #1F3156;
  --sun: #F5BF5B; --sun-fill: #F2B53A; --sun-soft: #3A2E17;
  --coral: #FF8A76; --coral-soft: #42231F; --mint: #52D3A3; --mint-soft: #16372C;
  --plum: #BD9BF2; --plum-soft: #2D2343;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  --chart-bg: #142232;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.scrim { display: none; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px));
  overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line);
  padding: 18px 14px 40px max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); padding: 4px 6px; }
.brand svg { width: 44px; height: 44px; flex: none; }
.brand b { font-family: var(--f-display); font-size: 1.2rem; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: .78rem; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: inherit; font-size: .9rem; }
.prog-mini { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--paper); border-radius: 10px; font-size: .85rem; color: var(--muted); }
.prog-mini .bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.prog-mini .bar i { display: block; height: 100%; background: var(--mint); border-radius: 99px; transition: width .4s; }
.nav-unit { border-top: 1px solid var(--line); padding-top: 10px; }
.nav-unit > button {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 6px; border-radius: 8px; font-family: var(--f-display); font-weight: 600; font-size: .95rem;
}
.nav-unit > button:hover { background: var(--paper); }
.nav-unit > button .u-n { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); width: 1.6em; }
.nav-unit > button .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
.nav-unit.closed > button .chev { transform: rotate(-90deg); }
.nav-unit.closed ul { display: none; }
.nav-unit ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 1px; }
.nav-unit li a {
  display: flex; gap: 8px; align-items: flex-start; padding: 5px 8px 5px 10px; border-radius: 8px;
  text-decoration: none; color: var(--ink); font-size: .87rem; line-height: 1.35;
}
.nav-unit li a:hover { background: var(--paper); }
.nav-unit li a.on { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.nav-unit li a .tick {
  flex: none; width: 16px; height: 16px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--line);
  display: grid; place-items: center;
}
.nav-unit li a.done .tick { background: var(--mint); border-color: var(--mint); }
.nav-unit li a.done .tick::after { content: ""; width: 6px; height: 3px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.nav-unit li a.practice { color: var(--plum); font-weight: 700; }
.nav-unit li.hide { display: none; }

.main {
  min-width: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.topbar { display: none; }
.view { max-width: 980px; margin: 0 auto; padding-block: 36px 80px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.themebtn { position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; display: grid; place-items: center; }
.themebtn svg { width: 20px; height: 20px; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 40; inset: 0 auto 0 0; width: min(320px, 88vw); height: 100%; transform: translateX(-102%); transition: transform .25s; box-shadow: var(--shadow); padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .app.drawer .side { transform: none; }
  .app.drawer .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, .35); }
  .topbar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .topbar button { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-weight: 700; }
  .topbar b { font-family: var(--f-display); }
  .view { padding-block: 22px 70px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body { font-size: 16px; }
}

/* ---------- Characters & speech ---------- */
.say { display: flex; gap: 14px; align-items: flex-end; margin: 22px 0; max-width: 760px; }
.say-av { flex: none; width: 76px; }
.say-av svg { width: 76px; height: 76px; display: block; }
.say-b { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 12px 16px; box-shadow: var(--shadow); min-width: 0; }
.say-n { font-family: var(--f-display); font-weight: 700; font-size: .82rem; letter-spacing: .02em; color: var(--muted); margin-bottom: 2px; }
.say-ollie .say-n { color: var(--accent); }
.say-penny .say-n { color: var(--sun); }
.say-kip .say-n { color: var(--mint); }
.say-cog .say-n { color: var(--plum); }
.say.right { flex-direction: row-reverse; }
.say.right .say-b { border-radius: 18px 18px 4px 18px; }
.ch .blink { animation: blink 5s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.ch.bob { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .ch .blink, .ch.bob, .pulse, .flowdot { animation: none !important; } * { transition: none !important; } }

/* ---------- Home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 34px; }
.hero h1 { font-size: clamp(2.1rem, 5vw, 3.4rem); font-weight: 800; letter-spacing: -.025em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lede { font-size: 1.12rem; color: var(--muted); margin-top: 14px; max-width: 34em; }
.hero .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.hero-stage { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 14px; }
.hero-stage svg { width: 100%; height: auto; display: block; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 18px; border-radius: 12px; font-weight: 700; text-decoration: none; cursor: pointer; font-size: .95rem; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { padding: 6px 12px; font-size: .85rem; border-radius: 10px; }
.cast { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 10px 0 36px; }
.cast-c { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-align: center; }
.cast-c svg { width: 78px; height: 78px; }
.cast-c b { display: block; font-family: var(--f-display); font-size: 1.05rem; }
.cast-c span { color: var(--muted); font-size: .85rem; line-height: 1.35; display: block; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 14px; flex-wrap: wrap; }
.sec-h h2 { font-size: 1.5rem; }
.sec-h span { color: var(--muted); font-size: .9rem; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; }
.ucard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--ink); transition: transform .15s, border-color .15s; }
.ucard:hover { transform: translateY(-2px); border-color: var(--accent); }
.ucard .uh { display: flex; gap: 12px; align-items: center; }
.ucard .uh svg { width: 52px; height: 52px; flex: none; }
.ucard .eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ucard h3 { font-size: 1.15rem; }
.ucard p { color: var(--muted); font-size: .92rem; line-height: 1.45; }
.ucard .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: auto; }
.ucard .bar i { display: block; height: 100%; background: var(--mint); }
.ucard .ufoot { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }
.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0 0 36px; }
.howto div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.howto b { font-family: var(--f-display); display: block; margin-bottom: 4px; }
.howto p { font-size: .9rem; color: var(--muted); line-height: 1.45; }
@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .cast { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .howto { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- Lesson ---------- */
.crumbs { font-family: var(--f-mono); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.lesson > h1 { font-size: clamp(1.9rem, 4.4vw, 2.7rem); font-weight: 800; margin: 10px 0 6px; letter-spacing: -.02em; }
.lesson .meta { display: flex; gap: 14px; color: var(--muted); font-size: .88rem; flex-wrap: wrap; }
.lesson .meta span { display: inline-flex; gap: 6px; align-items: center; }
.body { display: grid; gap: 18px; }
.body > p, .body > ul, .body > ol, .body > h2, .body > h3 { max-width: 44em; }
.body h2 { font-size: 1.45rem; margin-top: 14px; }
.body h3 { font-size: 1.15rem; margin-top: 6px; }
.body ul, .body ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.body strong { color: var(--ink); }
.k { font-weight: 700; color: var(--accent); }
.idea { background: var(--accent-soft); border-radius: var(--r); padding: 16px 20px; max-width: 44em; }
.idea::before { content: "The big idea"; display: block; font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.idea p { font-size: 1.08rem; }
.pit { background: var(--coral-soft); border-radius: var(--r); padding: 14px 18px; max-width: 44em; }
.pit::before { content: "Watch out"; display: block; font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--coral); font-weight: 700; margin-bottom: 4px; }
.eg { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 18px; max-width: 44em; }
.eg::before { content: "Example"; display: block; font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--mint); font-weight: 700; margin-bottom: 4px; }
.formula { font-family: var(--f-mono); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px 18px; font-size: 1rem; overflow-x: auto; max-width: 44em; line-height: 1.7; }
.formula .lbl { display: block; font-family: var(--f-body); font-size: .8rem; color: var(--muted); }
.formula b { color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.card h4 { font-size: 1rem; margin-bottom: 4px; }
.card p, .card li { font-size: .92rem; color: var(--muted); line-height: 1.45; }
.card ul { padding-left: 1.1em; margin: 6px 0 0; }
.card .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 8px; font-family: var(--f-display); font-weight: 800; }
.c-acc { background: var(--accent-soft); color: var(--accent); }
.c-sun { background: var(--sun-soft); color: var(--sun); }
.c-cor { background: var(--coral-soft); color: var(--coral); }
.c-min { background: var(--mint-soft); color: var(--mint); }
.c-plu { background: var(--plum-soft); color: var(--plum); }
.tblw { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tbl th, .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { font-family: var(--f-display); background: var(--surface-2); font-size: .88rem; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.n, .tbl th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
details.reveal { background: var(--surface); border: 1.5px solid var(--sun); border-radius: var(--r); max-width: 44em; }
details.reveal summary { cursor: pointer; padding: 12px 16px; font-weight: 700; list-style: none; display: flex; gap: 10px; align-items: center; }
details.reveal summary::-webkit-details-marker { display: none; }
details.reveal summary::before { content: "?"; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--sun-soft); color: var(--sun); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; }
details.reveal[open] summary::before { content: "!"; }
details.reveal summary .hint { margin-left: auto; font-weight: 400; font-size: .8rem; color: var(--muted); }
details.reveal > div { padding: 0 16px 14px 50px; color: var(--ink); }

/* ---------- Lab (interactive) ---------- */
.lab { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.lab-h { display: flex; align-items: center; gap: 10px; padding: 11px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.lab-h .tag { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 3px 8px; border-radius: 6px; font-weight: 700; }
.lab-h b { font-family: var(--f-display); font-size: 1.02rem; }
.lab-in { padding: 16px; display: grid; gap: 14px; }
.lab-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .lab-grid { grid-template-columns: minmax(0, 1fr); } }
.plot svg { width: 100%; height: auto; display: block; background: var(--chart-bg); border-radius: 12px; border: 1px solid var(--line); touch-action: none; }
.ctls { display: grid; gap: 12px; align-content: start; min-width: 0; }
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; font-size: .88rem; }
.ctl .ctl-l { font-weight: 700; }
.ctl output { font-family: var(--f-mono); font-size: .85rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.ctl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.ctl input[type=number] { grid-column: 1/-1; width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font-family: var(--f-mono); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.ro { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.ro small { display: block; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: var(--f-mono); }
.ro b { font-family: var(--f-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.verdict { padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); font-size: .93rem; line-height: 1.45; }
.verdict.good { background: var(--mint-soft); }
.verdict.bad { background: var(--coral-soft); }
.verdict.warn { background: var(--sun-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 99px; padding: 6px 13px; font-size: .86rem; cursor: pointer; font-weight: 700; color: var(--ink); }

.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }

/* chart marks */

.thin { stroke-width: 1.8; }
.dot { fill: var(--ink); stroke: var(--chart-bg); stroke-width: 2; }
.dot.a { fill: var(--accent); } .dot.c { fill: var(--coral); } .dot.m { fill: var(--mint); } .dot.s { fill: var(--sun); } .dot.p { fill: var(--plum); }
.lab-t { fill: var(--ink); font-family: var(--f-body); font-size: 12.5px; font-weight: 700; paint-order: stroke; stroke: var(--chart-bg); stroke-width: 4px; stroke-linejoin: round; }
.lab-t.a { fill: var(--accent); } .lab-t.c { fill: var(--coral); } .lab-t.m { fill: var(--mint); } .lab-t.s { fill: var(--sun); } .lab-t.p { fill: var(--plum); } .lab-t.mu { fill: var(--muted); font-weight: 400; }
.fa { fill: var(--accent); opacity: .16; } .fc { fill: var(--coral); opacity: .2; } .fm { fill: var(--mint); opacity: .2; } .fs { fill: var(--sun-fill); opacity: .3; } .fp { fill: var(--plum); opacity: .2; }
.fa-s { fill: var(--accent); } .fc-s { fill: var(--coral); } .fm-s { fill: var(--mint); } .fs-s { fill: var(--sun-fill); } .fp-s { fill: var(--plum); } .fmu-s { fill: var(--muted); }
.drag { cursor: grab; }
.handle { fill: var(--surface); stroke: var(--accent); stroke-width: 3; cursor: grab; }

.pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }

/* ---------- Diagram boxes ---------- */

/* ---------- Sorter game ---------- */
.sorter { display: grid; gap: 12px; }
.sort-card { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 16px 18px; font-size: 1.05rem; font-weight: 700; min-height: 64px; display: flex; align-items: center; gap: 12px; }

/* ---------- Quiz ---------- */
.check, .take { margin-top: 34px; }
.check > h2, .take > h2 { font-size: 1.35rem; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }

.qopts { display: grid; gap: 8px; }

.take li::before { content: ""; position: absolute; left: 14px; top: 15px; width: 14px; height: 14px; border-radius: 4px; background: var(--mint); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; flex-wrap: wrap; align-items: center; }
.pager a { text-decoration: none; }
.pager .pn { display: grid; gap: 2px; padding: 12px 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); max-width: 300px; }

.donebtn.is { background: var(--mint); border-color: var(--mint); color: var(--surface); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 12px; font-weight: 700; transition: .3s; z-index: 60; pointer-events: none; }

/* ---------- v2: challenge badges ---------- */
.goal { display: flex; gap: 10px; align-items: center; padding: 9px 14px; border-radius: 12px; border: 1.5px dashed var(--sun); background: var(--sun-soft); font-size: .9rem; line-height: 1.4; transition: background .25s, border-color .25s; }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- v2: mobile lesson dock ---------- */
.dock { display: none; }
.tb-theme { margin-left: auto; display: grid; place-items: center; padding: 6px 9px !important; }

    display: flex; align-items: center; gap: 10px; position: sticky; z-index: 15;

    background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 8px;
  }

}

<body>
<div class="app">

<script>
/* ================= Core engine ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } }
};
const fmt = (v, d = 1) => (Math.round(v * 10 ** d) / 10 ** d).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt0 = v => Math.round(v).toLocaleString('en-US');
const pct = (v, d = 1) => fmt(v, d) + '%';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function nice(max, n = 4) {
  const raw = max / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const out = []; for (let v = 0; v <= max + 1e-9; v += step) out.push(+v.toFixed(6)); return out;
}

const UNITS = [];
const LESSONS = {};
const ORDER = [];
function unit(def) { UNITS.push(Object.assign({ lessons: [] }, def)); }
function lesson(def) {
  const u = UNITS[UNITS.length - 1];
  def.unit = u.id;
  def.host = def.host || u.host;
  u.lessons.push(def.id);
  LESSONS[def.id] = def;
  ORDER.push(def.id);
}

/* ================= Characters ================= */
const CAST = {
  ollie: { name: 'Ollie', role: 'Owl professor. Explains the big models and never skips a step.' },
  penny: { name: 'Penny', role: 'A coin who knows prices, money and central banks from the inside.' },
  cog:   { name: 'Cog', role: 'A gear from the factory floor. Thinks about output, jobs and growth.' },
  kip:   { name: 'Kip', role: 'A shipping container who has crossed every border. Trade expert.' }
};
function eyes(cx1, cx2, cy, r, mood, pr) {
  const off = mood === 'think' ? [2.5, -3] : mood === 'sad' ? [0, 2] : [1, 0];
  const pr2 = mood === 'wow' ? pr * 0.8 : pr;
  if (mood === 'happy') {
    // smiling closed-ish eyes are reserved for 'joy'; happy uses open eyes
  }
  if (mood === 'joy') {
    return `<path d="M${cx1 - r * .6},${cy + 1} Q${cx1},${cy - r * .8} ${cx1 + r * .6},${cy + 1}" stroke="#1C2430" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M${cx2 - r * .6},${cy + 1} Q${cx2},${cy - r * .8} ${cx2 + r * .6},${cy + 1}" stroke="#1C2430" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }
  return [cx1, cx2].map(cx => `<g class="blink"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.5"/>
    <circle cx="${cx + off[0]}" cy="${cy + off[1]}" r="${pr2}" fill="#1C2430"/>
    <circle cx="${cx + off[0] + pr2 * .4}" cy="${cy + off[1] - pr2 * .45}" r="${pr2 * .35}" fill="#FFFFFF"/></g>`).join('');
}
function mouth(cx, cy, w, mood) {
  if (mood === 'wow') return `<ellipse cx="${cx}" cy="${cy + 2}" rx="${w * .3}" ry="${w * .38}" fill="#1C2430"/>`;
  if (mood === 'sad') return `<path d="M${cx - w / 2},${cy + 5} Q${cx},${cy - 3} ${cx + w / 2},${cy + 5}" stroke="#1C2430" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (mood === 'think') return `<path d="M${cx - w / 2.5},${cy + 3} L${cx + w / 2.5},${cy}" stroke="#1C2430" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `<path d="M${cx - w / 2},${cy} Q${cx},${cy + w * .55} ${cx + w / 2},${cy}" stroke="#1C2430" stroke-width="3" fill="#E9604E" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function charSVG(who, mood = 'happy', cls = '') {
  let g = '';
  if (who === 'ollie') {
    const brow = mood === 'think' ? 'M26,30 L42,28 M58,26 L74,32' : mood === 'sad' ? 'M26,28 L42,32 M58,32 L74,28' : mood === 'wow' ? 'M26,24 L42,22 M58,22 L74,24' : 'M27,29 Q34,25 42,28 M58,28 Q66,25 73,29';
    g = `<ellipse cx="50" cy="94" rx="26" ry="4" fill="#1C2430" opacity=".12"/>
      <ellipse cx="18" cy="62" rx="9" ry="20" fill="#6E4529" transform="rotate(18 18 62)"/>
      <ellipse cx="82" cy="62" rx="9" ry="20" fill="#6E4529" transform="rotate(-18 82 62)"/>
      <ellipse cx="50" cy="58" rx="33" ry="35" fill="#8A5A3B"/>
      <ellipse cx="50" cy="70" rx="21" ry="21" fill="#F3D9B1"/>
      <path d="M40,66 q4,4 8,0 M52,72 q4,4 8,0 M42,78 q4,4 8,0" stroke="#D9B98A" stroke-width="2" fill="none"/>
      <circle cx="36" cy="44" r="14" fill="#F3D9B1"/><circle cx="64" cy="44" r="14" fill="#F3D9B1"/>
      ${eyes(36, 64, 44, 10, mood, 5)}
      <path d="${brow}" stroke="#4A2E1A" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M45,53 L55,53 L50,62 Z" fill="#F2B53A" stroke="#C98A12" stroke-width="1.2" stroke-linejoin="round"/>
      ${mood === 'wow' ? '<ellipse cx="50" cy="63" rx="3" ry="2" fill="#1C2430"/>' : ''}
      <ellipse cx="40" cy="92" rx="6" ry="3" fill="#F2B53A"/><ellipse cx="60" cy="92" rx="6" ry="3" fill="#F2B53A"/>
      <path d="M24,22 L50,11 L76,22 L50,32 Z" fill="#253247"/>
      <rect x="38" y="24" width="24" height="8" rx="2" fill="#253247"/>
      <path d="M76,22 L78,36" stroke="#F2B53A" stroke-width="2"/><circle cx="78" cy="38" r="3" fill="#F2B53A"/>`;
  } else if (who === 'penny') {
    g = `<ellipse cx="50" cy="95" rx="24" ry="4" fill="#1C2430" opacity=".12"/>
      <path d="M38,82 L34,93 M62,82 L66,93" stroke="#8A5A10" stroke-width="4" stroke-linecap="round"/>
      <path d="M17,56 Q6,50 9,40 M83,56 Q94,50 91,40" stroke="#8A5A10" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="50" cy="52" r="36" fill="#F2B53A" stroke="#C98A12" stroke-width="5"/>
      <circle cx="50" cy="52" r="27" fill="none" stroke="#C98A12" stroke-width="1.6" stroke-dasharray="3 4" opacity=".7"/>
      <path d="M30,30 Q38,22 48,21" stroke="#FFF3D1" stroke-width="4" stroke-linecap="round" fill="none" opacity=".8"/>
      ${eyes(40, 60, 46, 8, mood, 4)}
      <circle cx="31" cy="60" r="4" fill="#E9604E" opacity=".35"/><circle cx="69" cy="60" r="4" fill="#E9604E" opacity=".35"/>
      ${mouth(50, 62, 16, mood)}`;
  } else if (who === 'cog') {
    let pts = [];
    const n = 10;
    for (let i = 0; i < n * 2; i++) {
      const a = (Math.PI * i) / n - Math.PI / 2;
      const r1 = i % 2 === 0 ? 40 : 33;
      const a1 = a - 0.13, a2 = a + 0.13;
      pts.push(`${(50 + r1 * Math.cos(a1)).toFixed(1)},${(52 + r1 * Math.sin(a1)).toFixed(1)}`);
      pts.push(`${(50 + r1 * Math.cos(a2)).toFixed(1)},${(52 + r1 * Math.sin(a2)).toFixed(1)}`);
    }
    g = `<ellipse cx="50" cy="96" rx="24" ry="3.5" fill="#1C2430" opacity=".12"/>
      <polygon points="${pts.join(' ')}" fill="#7D62B3" stroke="#5A4390" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="50" cy="52" r="27" fill="#A48BD6"/>
      <path d="M30,40 Q36,30 48,28" stroke="#E2D6FA" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".8"/>
      ${eyes(40, 60, 48, 8, mood, 4)}
      ${mouth(50, 62, 15, mood)}`;
  } else if (who === 'kip') {
    g = `<ellipse cx="50" cy="94" rx="30" ry="4" fill="#1C2430" opacity=".12"/>
      <rect x="14" y="26" width="72" height="62" rx="6" fill="#2F8F7A" stroke="#1F6655" stroke-width="2"/>
      ${[24, 34, 66, 76].map(x => `<line x1="${x}" y1="31" x2="${x}" y2="83" stroke="#1F6655" stroke-width="3" opacity=".55"/>`).join('')}
      <rect x="14" y="26" width="10" height="8" rx="2" fill="#1F6655"/><rect x="76" y="26" width="10" height="8" rx="2" fill="#1F6655"/>
      <rect x="14" y="80" width="10" height="8" rx="2" fill="#1F6655"/><rect x="76" y="80" width="10" height="8" rx="2" fill="#1F6655"/>
      <rect x="36" y="34" width="28" height="44" rx="5" fill="#E8F6F1"/>
      ${eyes(44, 56, 48, 5.5, mood, 3)}
      ${mouth(50, 62, 12, mood)}
      <path d="M50,26 L50,14 M44,14 L56,14" stroke="#1F6655" stroke-width="3" stroke-linecap="round"/>`;
  }
  return `<svg class="ch ${cls}" viewBox="0 0 100 100" role="img" aria-label="${CAST[who].name}">${g}</svg>`;
}
function say(who, html, mood = 'happy', right = false) {
  return `<div class="say say-${who}${right ? ' right' : ''}"><div class="say-av" aria-hidden="true">${charSVG(who, mood, 'bob')}</div>
    <div class="say-b"><div class="say-n">${CAST[who].name}</div><div class="say-t">${html}</div></div></div>`;
}

/* ================= Chart toolkit ================= */
let CHART_ID = 0;
function chart(o) {
  const W = o.w || 560, H = o.h || 360;
  const m = Object.assign({ l: 50, r: 22, t: 18, b: 46 }, o.m || {});
  const [x0, x1] = o.x, [y0, y1] = o.y;
  const sx = v => m.l + ((v - x0) / (x1 - x0)) * (W - m.l - m.r);
  const sy = v => H - m.b - ((v - y0) / (y1 - y0)) * (H - m.t - m.b);
  const P = p => `${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`;
  const parts = [], over = [];
  const id = 'clip' + (++CHART_ID);
  const api = {
    sx, sy, W, H, m,
    add(s) { parts.push(s); return api; },
    top(s) { over.push(s); return api; },
    line(pts, cls = 'l1', attrs = '') { parts.push(`<polyline class="${cls}" fill="none" points="${pts.map(P).join(' ')}" ${attrs}/>`); return api; },
    fn(f, cls = 'l1', a = x0, b = x1, n = 90) {
      const pts = [];
      for (let i = 0; i <= n; i++) { const x = a + ((b - a) * i) / n; const y = f(x); if (isFinite(y)) pts.push([x, y]); }
      return api.line(pts, cls);
    },
    poly(pts, cls = 'fa') { parts.push(`<polygon class="${cls}" points="${pts.map(P).join(' ')}"/>`); return api; },
    rect(xa, ya, xb, yb, cls = 'fa', attrs = '') {
      const X = Math.min(sx(xa), sx(xb)), Y = Math.min(sy(ya), sy(yb));
      parts.push(`<rect class="${cls}" x="${X.toFixed(1)}" y="${Y.toFixed(1)}" width="${Math.abs(sx(xb) - sx(xa)).toFixed(1)}" height="${Math.abs(sy(yb) - sy(ya)).toFixed(1)}" ${attrs}/>`); return api;
    },
    dot(x, y, cls = '', r = 5.5, attrs = '') { over.push(`<circle class="dot ${cls}" cx="${sx(x).toFixed(1)}" cy="${sy(y).toFixed(1)}" r="${r}" ${attrs}/>`); return api; },
    text(x, y, t, cls = '', dx = 0, dy = 0, anchor = 'start') { over.push(`<text class="lab-t ${cls}" x="${(sx(x) + dx).toFixed(1)}" y="${(sy(y) + dy).toFixed(1)}" text-anchor="${anchor}">${t}</text>`); return api; },
    guide(x, y, cls = 'guide') { parts.push(`<polyline class="${cls}" fill="none" points="${P([x0, y])} ${P([x, y])} ${P([x, y0])}"/>`); return api; },
    vline(x, cls = 'guide', ya = y0, yb = y1) { parts.push(`<line class="${cls}" x1="${sx(x)}" x2="${sx(x)}" y1="${sy(ya)}" y2="${sy(yb)}"/>`); return api; },
    hline(y, cls = 'guide', xa = x0, xb = x1) { parts.push(`<line class="${cls}" x1="${sx(xa)}" x2="${sx(xb)}" y1="${sy(y)}" y2="${sy(y)}"/>`); return api; },
    arrow(xa, ya, xb, yb, cls = 'l4') {
      const X1 = sx(xa), Y1 = sy(ya), X2 = sx(xb), Y2 = sy(yb);
      const a = Math.atan2(Y2 - Y1, X2 - X1), L = 9;
      over.push(`<g class="${cls}"><line x1="${X1}" y1="${Y1}" x2="${X2}" y2="${Y2}" stroke="currentColor"/>
        <path d="M${X2},${Y2} L${X2 - L * Math.cos(a - .45)},${Y2 - L * Math.sin(a - .45)} M${X2},${Y2} L${X2 - L * Math.cos(a + .45)},${Y2 - L * Math.sin(a + .45)}" fill="none"/></g>`);
      return api;
    },
    xtick(v, label) { over.push(`<g class="tick"><line class="ax" x1="${sx(v)}" x2="${sx(v)}" y1="${sy(y0)}" y2="${sy(y0) + 5}"/><text x="${sx(v)}" y="${sy(y0) + 18}" text-anchor="middle">${label == null ? v : label}</text></g>`); return api; },
    ytick(v, label) { over.push(`<g class="tick"><line class="ax" x1="${sx(x0) - 5}" x2="${sx(x0)}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${sx(x0) - 8}" y="${sy(v) + 4}" text-anchor="end">${label == null ? v : label}</text></g>`); return api; },
    html() {
      let ax = `<line class="ax" x1="${sx(x0)}" y1="${sy(y0)}" x2="${sx(x1) + 6}" y2="${sy(y0)}"/><line class="ax" x1="${sx(x0)}" y1="${sy(y0)}" x2="${sx(x0)}" y2="${sy(y1) - 6}"/>`;
      if (o.grid) {
        (o.xt || []).forEach(v => { ax = `<line class="gridl" x1="${sx(v)}" x2="${sx(v)}" y1="${sy(y0)}" y2="${sy(y1)}"/>` + ax; });
        (o.yt || []).forEach(v => { ax = `<line class="gridl" x1="${sx(x0)}" x2="${sx(x1)}" y1="${sy(v)}" y2="${sy(v)}"/>` + ax; });
      }
      (o.xt || []).forEach(v => api.xtick(v, o.xf ? o.xf(v) : v));
      (o.yt || []).forEach(v => api.ytick(v, o.yf ? o.yf(v) : v));
      const xl = o.xl ? `<text class="axl" x="${sx(x1)}" y="${H - 8}" text-anchor="end">${o.xl}</text>` : '';
      const yl = o.yl ? `<text class="axl" x="${sx(x0) + 8}" y="${m.t + 4}" text-anchor="start">${o.yl}</text>` : '';
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label || 'Interactive chart'}">
        <defs><clipPath id="${id}"><rect x="${m.l}" y="${m.t - 4}" width="${W - m.l - m.r + 4}" height="${H - m.t - m.b + 4}"/></clipPath></defs>
        ${ax}<g clip-path="url(#${id})">${parts.join('')}</g>${over.join('')}${xl}${yl}</svg>`;
    }
  };
  return api;
}
/* Find intersection of two lines y = a1 + b1 x and y = a2 + b2 x */
const meet = (a1, b1, a2, b2) => { const x = (a2 - a1) / (b1 - b2); return [x, a1 + b1 * x]; };

/* Add a challenge badge to an existing lab (once) and update its state */
function goal(el, text, ok) {

/* Turn a lab's challenge badge green while its target condition holds */

function ro(label, id) { return `<div class="ro"><small>${label}</small><b id="${id}">–</b></div>`; }

const setO = (el, id, t) => { const o = el.querySelector('#' + id + '-o'); if (o) o.textContent = t; };

function segBind(el, id, cb) {

/* Drag helper: maps pointer to chart coords */
function draggable(el, c, onMove) {
  const svg = el.querySelector('svg');
  let active = null;
  const toData = e => {
    const r = svg.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * c.W, py = ((e.clientY - r.top) / r.height) * c.H;
    return [px, py];
  };
  svg.addEventListener('pointerdown', e => {
    const h = e.target.closest('[data-h]'); if (!h) return;
    active = h.dataset.h; svg.setPointerCapture(e.pointerId); e.preventDefault();
  });
  svg.addEventListener('pointermove', e => { if (active) onMove(active, ...toData(e)); });
  svg.addEventListener('pointerup', () => { active = null; });
  svg.addEventListener('pointercancel', () => { active = null; });
}

function quizList(el, qs, host, opts = {}) {
  let answered = 0, right = 0;
  const L = 'ABCDE';
  el.innerHTML = qs.map((q, i) => `<div class="qcard" data-q="${i}">
      <div class="qn">${opts.practice ? 'Question ' + (i + 1) + ' of ' + qs.length : 'Check ' + (i + 1)}</div>
      <div class="qq">${q.q}</div>
      <div class="qopts">${q.o.map((o, j) => `<button type="button" class="qopt" data-j="${j}"><span class="ql">${L[j]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="qfb"></div></div>`).join('') + (opts.practice ? `<div class="score" id="qscore"></div>` : '');
  const sc = el.querySelector('#qscore');
  const upd = () => {
    if (!sc) return;
    const mood = answered === qs.length ? (right / qs.length >= .7 ? 'joy' : 'think') : 'happy';
    const msg = answered < qs.length ? `Answered ${answered} of ${qs.length}. Take your time and read each explanation.`
      : right / qs.length >= .7 ? 'Great work. You are ready for the next unit.' : 'Good effort. Revisit the lessons linked in the explanations, then try again.';
    sc.innerHTML = `<div style="width:64px">${charSVG(host, mood)}</div><div><b class="num">${right} / ${qs.length}</b><div>${msg}</div></div>
      ${answered === qs.length ? '<button class="btn sm" type="button" id="qreset">Try again</button>' : ''}`;
    const rb = sc.querySelector('#qreset'); if (rb) rb.onclick = () => quizList(el, qs, host, opts);
  };
  upd();
  if (el._qh) el.removeEventListener('click', el._qh);
  el._qh = e => {
    const b = e.target.closest('.qopt'); if (!b || b.disabled) return;
    const card = b.closest('.qcard'); const q = qs[+card.dataset.q]; const j = +b.dataset.j;
    $$('.qopt', card).forEach(x => { x.disabled = true; if (+x.dataset.j === q.a) x.classList.add('right'); });
    const ok = j === q.a;
    if (!ok) b.classList.add('wrong');
    answered++; if (ok) right++;
    card.querySelector('.qfb').innerHTML = say(host, `<b>${ok ? pick(['Exactly right!', 'Spot on!', 'Yes, nicely done!', 'Correct!']) : pick(['Not quite.', 'Close, but no.', 'Good try, let us look again.'])}</b> ${q.why}`, ok ? 'joy' : 'think');
    upd();
    if (opts.onDone && answered === qs.length) opts.onDone(right, qs.length);
  };
  el.addEventListener('click', el._qh);
}
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ================= Sorter game ================= */
function sorter(el, cfg, host) {
  if (window.QQ_CAPTURE) window.QQ_CAPTURE.push(cfg); /* lets Quiz Quest reuse sorting games as questions */
  let i = 0, score = 0;
  const items = cfg.shuffle === false ? cfg.items.slice() : cfg.items.slice().sort(() => Math.random() - .5);
  const log = [];
  el.innerHTML = lab(cfg.title, `<p class="hint-line">${cfg.prompt}</p><div class="sorter">
    <div class="sort-card" id="sc"></div><div class="sort-bins" id="sb">${cfg.bins.map((b, k) => `<button type="button" data-k="${k}">${b}</button>`).join('')}</div>
    <div class="sort-fb" id="sf"></div><div class="sort-log" id="sl"></div></div>`, 'Game');
  const card = $('#sc', el), fb = $('#sf', el), lg = $('#sl', el), bins = $('#sb', el);
  const show = () => {
    if (i >= items.length) {
      card.innerHTML = `<span>Finished. You scored <span class="num">${score} / ${items.length}</span>.</span><button class="btn sm" type="button" id="sr" style="margin-left:auto">Play again</button>`;
      bins.hidden = true;
      $('#sr', el).onclick = () => sorter(el, cfg, host);
      return;
    }
    bins.hidden = false;
    card.innerHTML = `<span>${items[i].t}</span><span class="cnt">${i + 1} / ${items.length}</span>`;
  };
  bins.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || i >= items.length) return;
    const it = items[i]; const ok = +b.dataset.k === it.b;
    if (ok) score++;
    fb.innerHTML = `<div class="verdict ${ok ? 'good' : 'bad'}"><b>${ok ? 'Correct' : 'Not quite'}: ${cfg.bins[it.b]}.</b> ${it.why || ''}</div>`;
    log.push(`<span class="${ok ? '' : 'x'}">${it.t.length > 34 ? it.t.slice(0, 32) + '…' : it.t}</span>`);
    lg.innerHTML = log.join('');
    i++; show();
  });
  show();
}

  const next = new Set([...old].filter(id => LESSONS[id] && !/^practice-/.test(id)));

const SFX = (() => {
  let ctx = null, on = store.get('macro-sound', true), nb = null;

    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
  };
  const tone = (f, d, type = 'square', v = .05, at = 0, f2 = 0) => {
    if (!on || !ctx) return;
    const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + d + .03);
  };
  const noise = (d, v = .06, at = 0, hp = 900) => {
    if (!on || !ctx) return;
    if (!nb) { nb = ctx.createBuffer(1, ctx.sampleRate * .5, ctx.sampleRate); const a = nb.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }

    s.buffer = nb; f.type = 'highpass'; f.frequency.value = hp; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(f); f.connect(g); g.connect(ctx.destination); s.start(t); s.stop(t + d + .03);
  };

/* ---------- Mode switch: game (default) or classic list ---------- */
function quiz(el, qs, host, opts = {}) {
  if (el._qq) { el._qq.stop(); el._qq = null; }
  const box = document.createElement('div');
  el.innerHTML = ''; el.appendChild(box);
  if (store.get('macro-quizmode', 'game') === 'list') {
    quizList(box, qs, host, opts);
    box.insertAdjacentHTML('afterbegin', `<div class="qq-switch"><button class="btn sm" type="button">Play as Quiz Quest game</button><span class="hint-line">Same questions, as an adventure with coins, weapons and monsters.</span></div>`);
    box.querySelector('.qq-switch button').onclick = () => { store.set('macro-quizmode', 'game'); quiz(el, qs, host, opts); };
    return;
  }
  quizGame(box, qs, host, opts);
  el._qq = box._qq;
}

unit({ id: 'u0', title: 'Welcome to the course', short: 'Welcome', host: 'ollie', blurb: 'What macroeconomics studies, how the course is built, and how the pieces connect.' });

  <div class="idea"><p><b>Microeconomics</b> studies single markets: one product, one firm, one household. <b>Macroeconomics</b> zooms out to the whole economy: total output, the overall price level, unemployment, interest rates and trade with the rest of the world.</p></div>
  ${W('map')}
  <h2>Six stops on the route</h2>
