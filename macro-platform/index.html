lesson({
  id: 'fiscal-multiplier', title: 'Modeling the Impact of Taxes and Government Spending', dur: '7:01', host: 'ollie', tags: 'fiscal multiplier mpc marginal propensity to consume balanced budget multiplier',
  hook: `If the government spends $1bn on a bridge, GDP rises by more than $1bn. The builders spend their wages, the shopkeepers spend their profits, and so on. That chain is the <b>multiplier</b>.`,
  body: () => `
  <div class="formula"><span class="lbl">Fiscal multiplier (with a proportional income tax t)</span><b>Multiplier = 1 ÷ [1 − c(1 − t)]</b> &nbsp;&nbsp; where c = marginal propensity to consume (MPC)</div>
  <div class="steps"><ol><li>The government spends ΔG. That is someone's income.</li><li>They pay tax t on it and spend fraction c of the rest: c(1−t)ΔG.</li><li>That spending is another person's income… and so on. The rounds sum to ΔG ÷ [1 − c(1−t)].</li></ol></div>
  ${W('mu')}
  <h2>Inequality and who gets the money</h2>
  <p>The single MPC above hides a lot. Households differ. A family living paycheque to paycheque, with no savings and no access to credit, spends almost every extra dollar (MPC ≈ 0.9). A wealthy household that already consumes what it wants saves most of a windfall (MPC ≈ 0.2).</p>
  <div class="formula"><span class="lbl">First round depends on who receives the money</span>ΔGDP ≈ MPC<sub>recipient</sub> × Package × 1 ÷ [1 − c(1 − t)]</div>
  ${W('tg')}
  ${say('ollie', 'So the <b>design</b> of a stimulus matters as much as its size. Transfers to low-income, credit-constrained households give the most GDP per dollar. Broad tax cuts for high earners give the least, though they may be chosen for other reasons, such as incentives to work or invest.', 'think')}
  <h2>The balanced budget multiplier</h2>
  <p>If the government raises spending and taxes by the <b>same</b> amount, GDP still rises. The spending enters income in full, but households pay part of the tax increase out of saving, so consumption falls by less. The balanced budget multiplier is <b>positive</b> (exactly 1 in the simplest model).</p>
  <div class="eg">MPC = 0.9, no income tax: spending multiplier = 1 ÷ 0.1 = 10. A lump-sum tax rise of 100 cuts consumption by 90, so ΔY from tax = −90 × 10 = −900. Spending +100 gives +1,000. Net +100: the balanced budget multiplier is 1.</div>`,
  widgets: {
    tg(el) {
      el.innerHTML = lab('Who gets the money?', `${segHTML('k', ['Targeted low-income transfer (MPC 0.9)', 'High-income tax cut (MPC 0.2)'])}
        <div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('sz', 'Package size ($bn)', 20, 200, 10, 100)}${slider('c2', 'Economy-wide MPC in later rounds', .5, .9, .01, .75)}${slider('t2', 'Tax rate', 0, .4, .01, .2)}
        <div class="readout">${ro('First-round spending', 'f')}${ro('Total ΔGDP', 'y')}${ro('Effective multiplier', 'm')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> keep the package at $100bn and switch between the two designs. Same cost to the budget, very different boost to GDP.</p>`, 'Try it', 'Generate at least $250bn of extra GDP from a $100bn package.');
      let k = 0;
      const draw = () => {
        const sz = val(el, 'sz'), c = val(el, 'c2'), t = val(el, 't2');
        setO(el, 'sz', '$' + sz + 'bn'); setO(el, 'c2', fmt(c, 2)); setO(el, 't2', pct(t * 100, 0));
        const mult = 1 / (1 - c * (1 - t));
        const opts = [{ n: 'Targeted transfer', mpc: .9, cl: 'fm-s' }, { n: 'High-income tax cut', mpc: .2, cl: 'fc-s' }].map(o => Object.assign(o, { first: o.mpc * sz, dy: o.mpc * sz * mult }));
        const mx = Math.max(...opts.map(o => o.dy)) * 1.15, H = 250, base = 210, sc = 180 / mx;
        let svg = `<svg viewBox="0 0 420 ${H}" role="img" aria-label="GDP effect of a targeted transfer versus a high-income tax cut">`;
        opts.forEach((o, i) => {
          const x = 60 + i * 180, on = i === k;
          svg += `<rect x="${x}" y="${base - o.first * sc}" width="110" height="${o.first * sc}" class="${o.cl}" opacity="${on ? 1 : .4}" rx="3"/>
            <rect x="${x}" y="${base - o.dy * sc}" width="110" height="${(o.dy - o.first) * sc}" class="fa-s" opacity="${on ? .75 : .3}" rx="3"/>
            <text class="lab-t" x="${x + 55}" y="${base - o.dy * sc - 8}" text-anchor="middle">+$${fmt0(o.dy)}bn</text>
            <text class="dg-t" x="${x + 55}" y="${base + 18}" text-anchor="middle">${o.n}</text><text class="dg-s" x="${x + 55}" y="${base + 33}" text-anchor="middle">MPC ${o.mpc}</text>`;
        });
        svg += `<line x1="40" x2="400" y1="${base}" y2="${base}" class="ax"/><text class="dg-s" x="40" y="16">Lower block = first-round spending · blue = induced rounds</text></svg>`;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px">${svg}</div>`;
        const o = opts[k];
        setT(el, 'f', '$' + fmt0(o.first) + 'bn'); setT(el, 'y', '$' + fmt0(o.dy) + 'bn'); setT(el, 'm', fmt(o.dy / sz, 2) + '×');
        $('#v', el).className = 'verdict ' + (k ? 'warn' : 'good');
        $('#v', el).innerHTML = k ? `High earners save 80% of the cut, so only $${fmt0(o.first)}bn is spent in round one. The package lifts GDP by $${fmt0(o.dy)}bn: <b>${fmt(opts[0].dy / o.dy, 1)}× less</b> than the targeted transfer.`
          : `Liquidity-constrained households spend 90% at once, so $${fmt0(o.first)}bn enters the economy in round one and GDP rises by <b>$${fmt0(o.dy)}bn</b>.`;
        goal(el, 'Generate at least $250bn of extra GDP from a $100bn package.', sz === 100 && o.dy >= 250);
      };
      segBind(el, 'k', i => { k = i; draw(); });
      el.addEventListener('input', draw); draw();
    },
    mu(el) {
      el.innerHTML = lab('Multiplier rounds', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('c', 'MPC (c)', .5, .95, .01, .8)}${slider('t', 'Tax rate (t)', 0, .5, .01, .25)}${slider('g', 'Extra government spending ΔG ($bn)', 10, 200, 10, 100)}
        <div class="readout">${ro('Multiplier', 'm')}${ro('Total ΔGDP', 'y')}${ro('Tax-cut multiplier', 'tm')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> raise the MPC to 0.95 and set taxes to zero. Each round leaks less, so the multiplier soars. Higher taxes and saving are <b>leakages</b> that shrink it.</p>`);
      const draw = () => {
        const c = val(el, 'c'), t = val(el, 't'), g = val(el, 'g'); setO(el, 'c', fmt(c, 2)); setO(el, 't', pct(t * 100, 0)); setO(el, 'g', '$' + g + 'bn');
        const k = c * (1 - t), m = 1 / (1 - k);
        const rounds = []; let x = g; for (let i = 0; i < 12; i++) { rounds.push(x); x *= k; }
        const Wd = 560, H = 250, bw = 38, sc = 180 / g; let cum = 0;
        let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Multiplier rounds">`;
        rounds.forEach((v, i) => { const x0 = 30 + i * (bw + 6); svg += `<rect x="${x0}" y="${210 - v * sc}" width="${bw}" height="${v * sc}" class="${i ? 'fa-s' : 'fs-s'}" rx="3"/><text class="dg-s" x="${x0 + bw / 2}" y="228" text-anchor="middle">${i + 1}</text>`; cum += v; });
        svg += `<line x1="24" x2="${Wd - 10}" y1="210" y2="210" class="ax"/><text class="dg-s" x="30" y="246">Spending round (yellow = initial ΔG; blue = induced consumption)</text></svg>`;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px">${svg}</div>`;
        setT(el, 'm', fmt(m, 2) + '×'); setT(el, 'y', '$' + fmt0(g * m) + 'bn'); setT(el, 'tm', fmt(c * m, 2) + '×');
        $('#v', el).innerHTML = `Each round, ${fmt(k * 100, 0)}% of new income is re-spent. $${g}bn of spending becomes <b>$${fmt0(g * m)}bn</b> of GDP. A tax cut has a smaller multiplier (${fmt(c * m, 2)}×), because part of it is saved before the first round.`;
        goal(el, 'Reach a fiscal multiplier of at least 3.', m >= 3);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'MPC = 0.8 and the tax rate is 25%. The fiscal multiplier is…', o: ['5.0', '2.5', '4.0', '1.25'], a: 1, why: '1 ÷ [1 − 0.8 × 0.75] = 1 ÷ 0.4 = 2.5.' },
    { q: 'A government has $50bn for stimulus. Which design will most likely raise GDP the most?', o: ['A tax cut for the top 1% of earners', 'Transfers to low-income, liquidity-constrained households', 'Paying down existing debt', 'A cut in the corporate tax rate on retained profits'], a: 1, why: 'Low-income households have a high MPC (around 0.9), so far more of the money is spent in the first round and multiplied through the economy.' }],
  take: ['Multiplier = 1 ÷ [1 − c(1 − t)]; higher MPC raises it, higher taxes lower it.', 'Targeted transfers to high-MPC, low-income households raise GDP far more per dollar than tax cuts for low-MPC, high-income savers.', 'A tax change has a smaller multiplier than an equal spending change.', 'The balanced budget multiplier is positive.']
});

lesson({
  id: 'ricardian', title: 'The Ricardian Equivalence', dur: '2:54', host: 'ollie', tags: 'tax cut debt future taxes saving barro',
  hook: `The government cuts your taxes today but borrows to pay for it. A very far-sighted person thinks: "That debt means higher taxes later. I'd better save this." If everyone thinks that way, the tax cut does nothing.`,
  body: () => `
  <div class="idea"><p><b>Ricardian equivalence</b>: if households are fully forward-looking, a debt-financed tax cut leads them to save the whole cut to pay future taxes. Consumption and AD don't change, so the timing of taxes is irrelevant.</p></div>
  <p>In practice equivalence usually fails, at least partly, because:</p>
  <ul><li>People are <b>myopic</b> or don't think about future government budgets.</li><li>Some households are <b>credit-constrained</b> and will spend any extra cash.</li><li>Future taxes may fall on <b>future generations</b>, not on today's taxpayers.</li></ul>
  ${W('r')}`,
  widgets: {
    r(el) {
      el.innerHTML = lab('How Ricardian are your citizens?', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('tc', 'Debt-financed tax cut ($bn)', 10, 200, 10, 100)}${slider('rc', 'Share of households who are Ricardian', 0, 100, 5, 40)}${slider('c', 'MPC of non-Ricardian households', .5, .95, .05, .8)}
        <div class="readout">${ro('Extra consumption', 'cn')}${ro('Extra saving', 'sv')}</div><div class="verdict" id="v"></div></div></div>`);
      const draw = () => {
        const tc = val(el, 'tc'), r = val(el, 'rc') / 100, c = val(el, 'c'); setO(el, 'tc', '$' + tc + 'bn'); setO(el, 'rc', fmt0(r * 100) + '%'); setO(el, 'c', fmt(c, 2));
        const cn = tc * (1 - r) * c, sv = tc - cn;
        const sc = 440 / 200;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 560 140" role="img" aria-label="Tax cut split"><rect x="20" y="30" width="${cn * sc}" height="44" class="fa-s" rx="3"/><rect x="${20 + cn * sc}" y="30" width="${sv * sc}" height="44" class="fm-s" rx="3"/>
          <text class="lab-t" x="24" y="22">Tax cut of $${tc}bn splits into…</text><text class="dg-s" x="20" y="100">blue = spent (boosts AD) · green = saved (for future taxes, or out of habit)</text></svg></div>`;
        setT(el, 'cn', '$' + fmt(cn, 1) + 'bn'); setT(el, 'sv', '$' + fmt(sv, 1) + 'bn');
        $('#v', el).innerHTML = r >= .99 ? '<b>Full Ricardian equivalence:</b> the whole cut is saved. AD is unchanged.' : `Only $${fmt(cn, 1)}bn reaches spending. The more Ricardian households are, the weaker the stimulus.`;
        goal(el, 'With at least half of households Ricardian, still get $40bn or more of extra spending.', r >= .5 && cn >= 40);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'If Ricardian equivalence holds fully, a debt-financed tax cut will…', o: ['Raise consumption by the full amount', 'Have no effect on consumption, as it is all saved', 'Reduce saving', 'Raise interest rates sharply'], a: 1, why: 'Households anticipate future taxes and save the entire cut, so aggregate demand is unchanged.' }],
  take: ['Ricardian equivalence: forward-looking households save debt-financed tax cuts.', 'It fails when people are myopic, credit-constrained, or expect future generations to pay.']
});

lesson({
  id: 'debt-gdp', title: 'National Debt to GDP: Does It Matter?', dur: '4:35', host: 'ollie', tags: 'debt sustainability crowding out interest rate growth rate primary deficit',
  hook: `Government debt above 100% of GDP sounds terrifying. But Japan has carried far more for decades. When does debt actually become a problem? The answer hinges on two numbers: <b>r</b> and <b>g</b>.`,
  body: () => `
  <div class="cards">
    <div class="card"><h4>Reasons to worry</h4><ul><li>High debt may mean future <b>tax rises</b> that discourage work and investment.</li><li>Investors may lose confidence: higher borrowing costs, even <b>default</b> risk.</li><li>Pressure on the central bank to print money and inflate the debt away.</li><li><b>Crowding out</b>: government borrowing pushes up interest rates and squeezes private investment.</li></ul></div>
    <div class="card"><h4>Reasons for less concern</h4><ul><li>Debt owed to <b>domestic</b> citizens is, in part, money we owe ourselves.</li><li>Borrowing for productive <b>capital investment</b> can pay for itself in future growth.</li><li>Private saving may rise to offset (Ricardian equivalence).</li><li>Deficits can help in a deep recession by reducing unemployment.</li></ul></div>
  </div>
  <div class="formula"><span class="lbl">Debt dynamics (approximate)</span>Change in debt/GDP ≈ (r − g) × debt/GDP + primary deficit/GDP</div>
  ${W('d')}`,
  widgets: {
    d(el) {
      el.innerHTML = lab('Debt ratio simulator', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('d0', 'Starting debt / GDP', 20, 200, 5, 90)}${slider('r', 'Interest rate on debt (r)', 0, 8, .25, 3)}${slider('g', 'Nominal GDP growth (g)', 0, 8, .25, 4)}${slider('pd', 'Primary deficit (% GDP)', -3, 6, .25, 2)}
        <div class="readout">${ro('Debt/GDP in 30 years', 'e')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> set r above g with a primary deficit and watch debt snowball. Then set g above r: even large debts can shrink as a share of GDP.</p>`);
      const draw = () => {
        const d0 = val(el, 'd0'), r = val(el, 'r') / 100, g = val(el, 'g') / 100, pd = val(el, 'pd');
        setO(el, 'd0', d0 + '%'); setO(el, 'r', pct(r * 100, 2)); setO(el, 'g', pct(g * 100, 2)); setO(el, 'pd', pct(pd, 2));
        const pts = []; let d = d0; for (let t = 0; t <= 30; t++) { pts.push([t, d]); d = d * (1 + r) / (1 + g) + pd; }
        const mx = Math.max(250, ...pts.map(p => p[1]));
        const c = chart({ x: [0, 30], y: [0, Math.min(400, mx)], xl: 'Years', yl: 'Debt / GDP (%)', xt: [0, 10, 20, 30], yt: nice(Math.min(400, mx)), grid: true, label: 'Debt to GDP path' });
        c.hline(d0, 'guide').line(pts, 'l2'); c.dot(30, Math.min(400, pts[30][1]), 'c', 6);
        $('#p', el).innerHTML = c.html();
        const e = pts[30][1]; setT(el, 'e', fmt0(e) + '%');
        $('#v', el).className = 'verdict ' + (e > d0 + 10 ? 'bad' : e < d0 - 10 ? 'good' : '');
        $('#v', el).innerHTML = `r − g = ${fmt((r - g) * 100, 2)} pp. ${r > g ? 'Interest outpaces growth, so the debt ratio tends to rise unless the government runs a primary <b>surplus</b>.' : 'Growth outpaces interest, so the economy can "grow out" of debt as long as primary deficits are modest.'}`;
        goal(el, 'Hold the debt ratio within 5 points of where it started over 30 years, even though r > g.', r > g && Math.abs(e - d0) <= 5);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Which is an argument that a high national debt is <b>less</b> of a concern?', o: ['It may lead to higher future taxes', 'It is largely owed to domestic citizens', 'It may crowd out private investment', 'It may lead to higher interest rates'], a: 1, why: 'Debt owed internally transfers resources between citizens rather than sending them abroad. The others are reasons to worry.' }],
  take: ['High debt can mean future tax rises, higher rates, crowding out and default risk.', 'Concern is lower when debt is owed domestically or funds productive investment.', 'If interest exceeds growth (r > g), debt ratios snowball without primary surpluses.']
});

lesson({
  id: 'fiscal-limits', title: 'Fiscal Policy Limitations', dur: '1:52', host: 'ollie', tags: 'recognition lag action lag impact lag crowding out',
  hook: `By the time a government notices a recession, agrees a stimulus, and the money reaches the economy, the recession may already be over. Timing is fiscal policy's biggest weakness.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-acc">1</div><h4>Recognition lag</h4><p>Data arrive late and get revised, so it takes time to realise a downturn has started.</p></div>
    <div class="card"><div class="ic c-sun">2</div><h4>Action lag</h4><p>Agreeing and legislating a response takes time, especially with political disagreement.</p></div>
    <div class="card"><div class="ic c-cor">3</div><h4>Impact lag</h4><p>Once enacted, spending and tax changes take time to work through the economy.</p></div>
  </div>
  <p>Other limits: uncertainty about where the economy really is relative to potential, crowding out of private investment, supply constraints (if the economy is at capacity, stimulus only raises prices), conflicting goals, and governments being reluctant to raise taxes or cut spending in booms.</p>
  ${W('lg')}`,
  widgets: {
    lg(el) {
      el.innerHTML = lab('Stimulus timing', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('l', 'Total lag before stimulus hits (quarters)', 0, 10, 1, 5)}<div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> with a short lag, stimulus fills the hole (green). With a long lag, it lands in the recovery and pushes the economy into overheating.</p>`);
      const draw = () => {
        const L = val(el, 'l'); setO(el, 'l', L + ' q');
        const gap = t => -4 * Math.sin(Math.PI * t / 10) * (t <= 10 ? 1 : 0);
        const stim = t => (t >= 1 + L && t <= 7 + L) ? 3 * Math.sin(Math.PI * (t - 1 - L) / 6) : 0;
        const c = chart({ x: [0, 20], y: [-5, 5], xl: 'Quarters', yl: 'Output gap (%)', xt: [0, 5, 10, 15, 20], yt: [-4, -2, 0, 2, 4], grid: true, h: 280, label: 'Policy lag effect' });
        c.hline(0, 'l3 thin').fn(gap, 'ghost', 0, 20, 200).fn(t => gap(t) + stim(t), 'l1', 0, 20, 200).fn(stim, 'l4 thin', 0, 20, 200);
        c.text(5, -4, 'no policy', 'mu', 0, 18, 'middle').text(1 + L + 3, 3, 'stimulus', 's', 0, -8, 'middle');
        $('#p', el).innerHTML = c.html();
        let worst = 0; for (let t = 0; t <= 20; t += .1) worst = Math.max(worst, gap(t) + stim(t));
        $('#v', el).className = 'verdict ' + (L <= 2 ? 'good' : worst > 1 ? 'bad' : 'warn');
        $('#v', el).innerHTML = L <= 2 ? 'Well-timed: the stimulus offsets much of the slump.' : worst > 1 ? `Badly timed: the stimulus arrives during recovery and pushes output <b>${fmt(worst, 1)}%</b> above potential. That is pro-cyclical policy.` : 'The stimulus helps only partly; much of it arrives late.';
        goal(el, 'Time the stimulus so output never overshoots potential by more than 0.5%.', worst <= .5);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'The delay between deciding on a fiscal measure and its effect on the economy is the…', o: ['Recognition lag', 'Action lag', 'Impact lag', 'Inside lag'], a: 2, why: 'The impact lag runs from implementation to effect. Recognition and action lags come earlier.' }],
  take: ['Fiscal policy suffers recognition, action and impact lags.', 'Badly timed stimulus can amplify the cycle.', 'Crowding out, uncertainty and capacity limits also constrain it.']
});

lesson({
  id: 'fiscal-stance', title: 'Expansionary or Contractionary Fiscal Policy?', dur: '2:38', host: 'ollie', tags: 'structural deficit cyclically adjusted budget automatic stabilizers stance',
  hook: `The budget deficit jumps from 2% to 5% of GDP. Did the government loosen policy? Not necessarily. A recession can do that on its own. We need to look underneath.`,
  body: () => `
  <div class="formula"><span class="lbl">Splitting the deficit</span>Actual deficit = <b>Structural (cyclically adjusted) deficit</b> + Cyclical deficit</div>
  <p>The <b>structural deficit</b> is what the deficit would be at full employment. It reflects deliberate policy. The <b>cyclical</b> part comes from automatic stabilisers. To judge the fiscal stance, look at changes in the <b>structural</b> balance.</p>
  ${W('st')}
  <div class="pit"><p>Changes in the actual deficit can mislead: a widening deficit in a recession may be entirely cyclical, with no change in policy.</p></div>`,
  widgets: {
    st(el) {
      el.innerHTML = lab('Decompose the deficit', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('s0', 'Structural deficit last year (% GDP)', -2, 6, .25, 2)}${slider('s1', 'Structural deficit this year', -2, 6, .25, 2)}${slider('g', 'Output gap this year', -6, 4, .5, -4)}
        <div class="readout">${ro('Cyclical deficit', 'cy')}${ro('Actual deficit', 'ac')}</div><div class="verdict" id="v"></div></div></div>`);
      const draw = () => {
        const s0 = val(el, 's0'), s1 = val(el, 's1'), g = val(el, 'g'); setO(el, 's0', pct(s0, 2)); setO(el, 's1', pct(s1, 2)); setO(el, 'g', pct(g));
        const cy = -.5 * g, ac = s1 + cy, sc = 30;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 560 140" role="img" aria-label="Deficit decomposition">
          <text class="dg-t" x="10" y="45">This year</text><rect x="120" y="25" width="${Math.max(0, s1) * sc}" height="32" class="fa-s" rx="3"/><rect x="${120 + Math.max(0, s1) * sc}" y="25" width="${Math.max(0, cy) * sc}" height="32" class="fs-s" rx="3"/>
          <text class="lab-t" x="${126 + (Math.max(0, s1) + Math.max(0, cy)) * sc}" y="46">${pct(ac, 2)} actual</text>
          <text class="dg-s" x="10" y="100">blue = structural (policy choice) · yellow = cyclical (automatic stabilisers)</text></svg></div>`;
        setT(el, 'cy', pct(cy, 2)); setT(el, 'ac', pct(ac, 2));
        const d = s1 - s0;
        $('#v', el).innerHTML = Math.abs(d) < .1 ? `Structural deficit unchanged: the stance is <b>neutral</b>, even though the actual deficit is ${pct(ac, 2)}.` : d > 0 ? `Structural deficit up ${fmt(d, 2)} pp: <b>expansionary</b> fiscal policy.` : `Structural deficit down ${fmt(-d, 2)} pp: <b>contractionary</b> fiscal policy.`;
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'In a recession the actual budget deficit rises but the structural deficit is unchanged. Fiscal policy is…', o: ['Expansionary', 'Contractionary', 'Neutral; the rise is cyclical', 'Impossible to judge'], a: 2, why: 'The increase comes from automatic stabilisers. The deliberate (structural) stance has not changed.' }],
  take: ['Judge the fiscal stance by the structural (cyclically adjusted) balance.', 'Actual deficits move with the cycle through automatic stabilisers.']
});

lesson({
  id: 'policy-mix', title: 'Interaction between Monetary and Fiscal Policy', dur: '2:40', host: 'penny', tags: 'policy mix easy tight crowding out public private sector',
  hook: `The central bank and the government are steering the same car. If both press the accelerator, we zoom. If one brakes while the other accelerates, interest rates and the size of the public sector tell the story.`,
  body: () => `${W('mx')}
  <div class="tblw"><table class="tbl"><tr><th></th><th>Easy monetary</th><th>Tight monetary</th></tr>
  <tr><th>Easy fiscal</th><td>Interest rates low, AD strongly up; private and public sectors both expand</td><td>Interest rates high; public sector grows relative to private (crowding out)</td></tr>
  <tr><th>Tight fiscal</th><td>Interest rates low; private sector grows relative to public</td><td>Interest rates high, AD falls; both sectors contract</td></tr></table></div>`,
  widgets: {
    mx(el) {
      const R = {
        '00': ['Easy fiscal + easy monetary', 'Low', '▲▲ Strong increase', 'Both expand', 'Highly expansionary. Risk of inflation if the economy is near capacity.'],
        '01': ['Easy fiscal + tight monetary', 'High', '▲ Increase (smaller)', 'Public share grows', 'Government borrowing at high rates crowds out private investment.'],
        '10': ['Tight fiscal + easy monetary', 'Low', '▲ Increase (smaller)', 'Private share grows', 'Cheap credit lets the private sector expand while the government shrinks.'],
        '11': ['Tight fiscal + tight monetary', 'High', '▼▼ Decrease', 'Both contract', 'Strongly contractionary: used to crush inflation or repair public finances.']
      };
      el.innerHTML = lab('Choose the policy mix', `<div style="display:flex;gap:10px;flex-wrap:wrap"><div><div class="hint-line">Fiscal policy</div>${segHTML('f', ['Easy', 'Tight'])}</div><div><div class="hint-line">Monetary policy</div>${segHTML('m', ['Easy', 'Tight'])}</div></div>
        <div id="o"></div>`, 'Lab');
      let f = 0, m = 0;
      const draw = () => { const r = R['' + f + m];
        $('#o', el).innerHTML = `<div class="readout">${ro('Interest rates', 'a')}${ro('Aggregate demand', 'b')}${ro('Public vs private', 'c')}</div>${say(f === m ? 'ollie' : 'penny', `<b>${r[0]}.</b> ${r[4]}`, m === 1 && f === 1 ? 'sad' : 'happy')}`;
        setT(el, 'a', r[1]); setT(el, 'b', r[2]); setT(el, 'c', r[3]); };
      segBind(el, 'f', i => { f = i; draw(); }); segBind(el, 'm', i => { m = i; draw(); }); draw();
    }
  },
  check: [{ q: 'Expansionary fiscal policy combined with restrictive monetary policy most likely leads to…', o: ['Low interest rates and a larger private sector', 'High interest rates and a larger public sector share of GDP', 'Falling AD', 'No change in interest rates'], a: 1, why: 'Government borrowing raises demand for funds while the central bank keeps money tight, so rates rise and private investment is crowded out.' }],
  take: ['Easy-easy: strongly expansionary. Tight-tight: strongly contractionary.', 'Easy fiscal + tight money: high rates, public sector grows relative to private.', 'Tight fiscal + easy money: low rates, private sector grows relative to public.']
});

lesson({
  id: 'climate-transition', title: 'Climate Risk & The Green Transition', host: 'ollie', labs: 'New lesson', tags: 'climate change carbon tax green subsidies physical risk transition risk stranded assets emissions net zero esg',
  hook: `Climate change is a macroeconomic problem twice over. The <b>damage</b> from a warming climate hits supply. The <b>policies</b> to stop it change costs, prices and investment across the whole economy. Cog and I will show you both sides with the AD-AS tools you already have.`,
  body: () => `
  <div class="idea"><p>Economists separate two kinds of climate risk. <b>Physical risks</b> come from the climate itself. <b>Transition risks</b> come from the shift to a low-carbon economy. Both move aggregate supply, but on different timescales.</p></div>
  <div class="cards">
    <div class="card"><div class="ic c-cor">P</div><h4>Physical risk</h4><ul><li><b>Acute</b>: floods, storms and wildfires destroy capital, so <b>LRAS shifts left</b>.</li><li>Droughts and heatwaves hit harvests and energy: supply shocks, so <b>SRAS shifts left</b> and food prices jump.</li><li><b>Chronic</b>: heat lowers labour productivity; rising seas threaten coastal assets.</li></ul></div>
    <div class="card"><div class="ic c-sun">T</div><h4>Transition risk</h4><ul><li><b>Carbon taxes</b> and regulation raise energy costs, so <b>SRAS shifts left</b> in the short run.</li><li><b>Stranded assets</b>: fossil-fuel reserves and plants lose value, which hits wealth, bank balance sheets and AD.</li><li>Green <b>R&D and infrastructure</b> raise investment now (AD) and productive capacity later (<b>LRAS shifts right</b>).</li></ul></div>
  </div>
  ${W('rk')}
  <h2>Green Transition Simulator</h2>
  <p>You are the finance minister. Combine a <b>carbon tax</b> (fast emission cuts, a short-run cost shock, and revenue) with <b>green subsidies</b> (slower, but they build capacity). Track output, prices, emissions and the budget over 20 years. Output is shown relative to a no-policy path that suffers growing physical damage.</p>
  ${W('gt')}
  ${say('cog', 'Two things surprised me here. First, the carbon tax raises the <b>price level</b> once, like any cost shock, but it isn\'t ongoing inflation unless wages and expectations chase it. Second, its revenue <b>shrinks</b> as emissions fall: a successful carbon tax erodes its own base. Plan the budget for that!', 'wow', true)}
  <div class="pit"><p>Carbon taxes are <b>regressive</b> before redistribution: poorer households spend a bigger share of income on energy. Many countries return the revenue as equal per-person dividends or cut other taxes, which protects low-income households while keeping the price signal.</p></div>`,
  widgets: {
    rk(el) {
      sorter(el, {
        title: 'Physical or transition risk?', prompt: 'Classify each event that could hit an economy or a bank\'s loan book.',
        bins: ['Physical risk', 'Transition risk'],
        items: [
          { t: 'A hurricane destroys port infrastructure', b: 0, why: 'Direct damage from an extreme weather event.' },
          { t: 'A new emissions law makes coal plants unprofitable', b: 1, why: 'Policy change strands fossil-fuel assets.' },
          { t: 'A drought cuts the wheat harvest by a third', b: 0, why: 'A climate-driven supply shock.' },
          { t: 'Investors dump oil company shares after a carbon tax is announced', b: 1, why: 'Repricing driven by the low-carbon transition.' },
          { t: 'Coastal homes become uninsurable as sea levels rise', b: 0, why: 'A chronic physical hazard destroying asset values.' },
          { t: 'Electric cars make petrol-engine factories obsolete', b: 1, why: 'Technology shift in the transition.' }
        ]
      }, 'ollie');
    },
    gt(el) {
      el.innerHTML = lab('Green Transition Simulator (20 years)', `<div class="lab-grid"><div class="ctls"><div class="plot" id="p1"></div><div class="plot" id="p2"></div></div><div class="ctls">
        ${slider('tau', 'Carbon tax ($ per tonne CO₂)', 0, 200, 10, 50)}${slider('sig', 'Green R&D and infrastructure subsidy (% of GDP)', 0, 3, .25, .5)}${slider('yr', 'Year shown', 0, 20, 1, 3)}
        <div class="readout">${ro('Emissions vs today', 'e')}${ro('Real GDP vs no policy', 'g')}${ro('Price level vs no policy', 'p')}${ro('Budget: tax − subsidy', 'b')}</div>
        <div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> a big carbon tax alone cuts emissions fast but costs output early. Subsidies alone are slow and expensive for the budget. Look for a mix, then drag the year slider to see the short run versus the long run.</p>`, 'Try it', 'By year 20, cut emissions by at least 50% with real GDP at or above the no-policy path.');
      const model = (tau, sig) => {
        const k = .00015 * tau + .012 * sig;
        const E = t => 100 * Math.exp(-k * t);
        const cum = t => k > 0 ? 100 * (1 - Math.exp(-k * t)) / k : 100 * t;
        const dmgB = t => .0015 * 100 * t, dmg = t => .0015 * cum(t);
        const SR = t => .8 * (tau / 100) * Math.exp(-t / 4), LR = t => .6 * sig * (1 - Math.exp(-t / 8));
        const gap = t => (dmgB(t) - dmg(t)) - SR(t) + LR(t);
        const P = t => 3 * (tau / 100) * (1 - Math.exp(-t / 1.5)) + .3 * sig * Math.exp(-t / 5) * Math.min(1, t);
        const rev = t => .012 * tau * E(t) / 100;
        return { E, gap, P, rev, SR, LR, dmgB, dmg };
      };
      const draw = () => {
        const tau = val(el, 'tau'), sig = val(el, 'sig'), yr = val(el, 'yr');
        setO(el, 'tau', '$' + tau); setO(el, 'sig', pct(sig, 2)); setO(el, 'yr', 'year ' + yr);
        const M = model(tau, sig);
        const c1 = chart({ x: [0, 20], y: [0, 110], xl: 'Years', yl: 'Emissions (today = 100)', xt: [0, 5, 10, 15, 20], yt: [0, 25, 50, 75, 100], grid: true, h: 210, label: 'Emissions path' });
        c1.hline(100, 'ghost').hline(50, 'l3 thin').text(20, 50, '−50%', 'm', -4, 16, 'end').fn(M.E, 'l2', 0, 20).vline(yr, 'guide', 0, 110).dot(yr, M.E(yr), 'c', 6);
        c1.text(20, 100, 'no policy', 'mu', -4, -8, 'end');
        const c2 = chart({ x: [0, 20], y: [-3, 4], xl: 'Years', yl: 'Real GDP vs no-policy path (%)', xt: [0, 5, 10, 15, 20], yt: [-2, 0, 2, 4], grid: true, h: 210, label: 'Output relative to baseline' });
        c2.hline(0, 'ghost').fn(M.gap, 'l1', 0, 20).vline(yr, 'guide', -3, 4).dot(yr, M.gap(yr), 'a', 6);
        $('#p1', el).innerHTML = c1.html(); $('#p2', el).innerHTML = c2.html();
        const e = M.E(yr) - 100, g = M.gap(yr), p = M.P(yr), b = M.rev(yr) - sig;
        setT(el, 'e', (e > 0 ? '+' : '') + fmt(e, 0) + '%'); setT(el, 'g', (g >= 0 ? '+' : '') + fmt(g, 2) + '%'); setT(el, 'p', (p >= 0 ? '+' : '') + fmt(p, 2) + '%'); setT(el, 'b', (b >= 0 ? '+' : '') + fmt(b, 2) + '% GDP');
        let m;
        if (!tau && !sig) m = 'No policy: emissions stay flat and physical damage grows every year, quietly shrinking potential output (LRAS shifts left).';
        else if (yr <= 3 && M.SR(yr) > M.LR(yr) + .1) m = `Short run: the carbon tax acts as a <b>cost-push shock</b> (SRAS left). Output is ${fmt(Math.abs(g), 2)}% ${g < 0 ? 'below' : 'above'} the no-policy path and prices are ${fmt(p, 2)}% higher.`;
        else m = `Year ${yr}: emissions ${e < 0 ? 'down ' + fmt(-e, 0) + '%' : 'flat'}. Avoided climate damage and green capacity (LRAS right) leave output ${g >= 0 ? fmt(g, 2) + '% above' : fmt(-g, 2) + '% below'} the no-policy path. ${b < 0 ? 'The budget is paying ' + fmt(-b, 2) + '% of GDP for the subsidies.' : 'Carbon revenue still covers the subsidies.'}`;
        $('#v', el).className = 'verdict ' + (g >= 0 && e < -20 ? 'good' : g < 0 ? 'warn' : '');
        $('#v', el).innerHTML = m;
        goal(el, 'By year 20, cut emissions by at least 50% with real GDP at or above the no-policy path.', M.E(20) <= 50 && M.gap(20) >= 0);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [
    { q: 'A government introduces a large carbon tax. In the AD-AS model, the most likely <b>short-run</b> effect is…', o: ['LRAS shifts right', 'SRAS shifts left: higher price level, lower output', 'AD shifts right', 'No effect on prices'], a: 1, why: 'A carbon tax raises energy and production costs, which is a cost-push shock. Green investment shifts LRAS right only over time.' },
    { q: 'Banks holding loans to coal mines suffer losses after a new emissions law. This is an example of…', o: ['Physical risk', 'Transition risk', 'Cyclical unemployment', 'Ricardian equivalence'], a: 1, why: 'The loss comes from the policy-driven shift to a low-carbon economy, which strands fossil-fuel assets.' }
  ],
  take: ['Physical risks (extreme weather, chronic heat) destroy capital and cause supply shocks: SRAS and LRAS shift left.', 'Transition risks (carbon taxes, regulation, stranded assets) raise costs in the short run and reprice fossil-fuel wealth.', 'A carbon tax is a one-off cost-push shock that also raises revenue, but that revenue shrinks as emissions fall.', 'Green R&D and infrastructure shift LRAS right over the long run and reduce future physical damage.']
});

lesson({
  id: 'practice-5', title: 'Practice Questions + Answers', dur: '0:01', practice: true, tags: 'quiz exam unit 5',
  hook: `Unit 5 review: taxes, spending, multipliers, debt and the green transition. Ten questions, let's go!`,
  body: () => `<p>Ten questions. Score 7 or more to mark the set as learned.</p>`,
  check: [
    { q: 'Which is an automatic stabiliser?', o: ['A new infrastructure programme', 'A one-off tax rebate approved by parliament', 'Progressive income taxes', 'A central bank rate cut'], a: 2, why: 'Progressive tax receipts fall automatically as incomes drop. (Roles of fiscal policy)' },
    { q: 'VAT is an example of…', o: ['A direct tax', 'An indirect tax', 'A transfer payment', 'Capital spending'], a: 1, why: 'VAT is levied on spending, not directly on income or wealth. (Fiscal tools)' },
    { q: 'MPC = 0.75, tax rate = 20%. The fiscal multiplier is…', o: ['4.0', '2.5', '1.67', '3.0'], a: 1, why: '1 ÷ [1 − 0.75 × 0.8] = 1 ÷ 0.4 = 2.5. (Fiscal multiplier)' },
    { q: 'A $100bn package goes either to low-income households (MPC 0.9) or to high-income households (MPC 0.2). Compared with the high-income tax cut, the targeted transfer raises GDP…', o: ['By the same amount', 'About 4.5 times as much', 'Less, because poor households pay less tax', 'Only if interest rates are zero'], a: 1, why: 'First-round spending is 90 vs 20, and both are multiplied by the same later-round multiplier: 0.9 ÷ 0.2 = 4.5. (Fiscal multiplier: who gets the money)' },
    { q: 'If Ricardian equivalence holds, a debt-financed tax cut will…', o: ['Raise consumption', 'Be fully saved', 'Raise inflation', 'Reduce national saving'], a: 1, why: 'People save it to pay anticipated future taxes. (Ricardian equivalence)' },

    { q: 'The best measure of a government\'s discretionary fiscal stance is the change in…', o: ['The actual budget deficit', 'The structural budget deficit', 'Tax revenue', 'The debt-to-GDP ratio'], a: 1, why: 'The structural balance strips out cyclical effects. (Fiscal stance)' },
    { q: 'Tight fiscal policy combined with easy monetary policy is likely to lead to…', o: ['High rates, larger public sector', 'Low rates, larger private sector relative to public', 'Strongly falling AD', 'Hyperinflation'], a: 1, why: 'Low rates support private demand while government shrinks. (Policy interaction)' },
    { q: 'A carbon tax combined with green infrastructure spending is most likely to…', o: ['Shift LRAS left permanently', 'Shift SRAS left in the short run and LRAS right in the long run', 'Shift AD left only', 'Have no effect on the price level'], a: 1, why: 'The tax is a short-run cost shock; green investment and avoided climate damage raise capacity over time. (Climate risk and the green transition)' }
  ]
});

lesson({
  id: 'gdp-gnp', title: 'Gross Domestic Product vs. Gross National Product', dur: '2:14', tags: 'gnp gni residents factor income abroad',
  hook: `Kip here! Picture a Japanese-owned car factory in the UK. Its output counts in UK <b>GDP</b>, because it's made in the UK. But the profit belongs to Japanese owners, so it counts in Japan's <b>GNP</b>. Location versus ownership.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-acc">D</div><h4>GDP: where?</h4><p>Value of output produced <b>within the country's borders</b>, by anyone.</p></div>
    <div class="card"><div class="ic c-min">N</div><h4>GNP: who?</h4><p>Value of output produced by the country's <b>residents and their capital</b>, wherever it's located.</p></div>
  </div>
  <div class="formula"><span class="lbl">The link</span><b>GNP = GDP + factor income received from abroad − factor income paid to foreigners</b></div>
  ${W('s')}
  <p>For most large economies the two are close. They differ a lot for countries with many workers abroad sending remittances, or with heavy foreign ownership of domestic industry.</p>`,
  widgets: {
    s(el) {
      sorter(el, {
        title: 'GDP, GNP, or both? (from Country A\'s point of view)', prompt: 'Decide whether the income counts in Country A\'s GDP, its GNP, or both.',
        bins: ['GDP only', 'GNP only', 'Both GDP and GNP'],
        items: [
          { t: 'Profit of a foreign-owned factory located in A', b: 0, why: 'Produced in A (GDP) but earned by foreigners (not A\'s GNP).' },
          { t: 'Salary a citizen of A earns working temporarily in another country', b: 1, why: 'Earned by A\'s resident (GNP) but produced abroad (not A\'s GDP).' },
          { t: 'Wages of A\'s citizens at a domestic A-owned firm', b: 2, why: 'Domestic production by residents.' },
          { t: 'Dividends A\'s residents receive from shares in foreign companies', b: 1, why: 'Factor income received from abroad.' },
          { t: 'Interest paid by A\'s firms to foreign bondholders', b: 0, why: 'Produced in A, but the income goes abroad.' }
        ]
      }, 'kip');
    }
  },
  check: [{ q: 'A country\'s residents earn large incomes from investments abroad, while foreigners own little in the country. Then…', o: ['GDP > GNP', 'GNP > GDP', 'GDP = GNP always', 'GNP is negative'], a: 1, why: 'Net factor income from abroad is positive, so GNP exceeds GDP.' }],
  take: ['GDP measures production by location; GNP measures it by ownership.', 'GNP = GDP + net factor income from abroad.']
});

lesson({
  id: 'trade-costs-benefits', title: 'Costs and Benefits of International Trade', dur: '4:10', tags: 'gains from trade consumer surplus winners losers specialization',
  hook: `Open your kitchen cupboard: coffee from Brazil, rice from Thailand, a phone assembled in Vietnam. Trade makes us richer overall. But "overall" hides winners and losers.`,
  body: () => `
  <div class="cards">
    <div class="card"><h4>Benefits</h4><ul><li>Gains from <b>specialisation</b> and exchange (comparative advantage)</li><li><b>Economies of scale</b> from selling to bigger markets</li><li>More <b>variety</b> and lower prices for consumers</li><li><b>Competition</b> pushes domestic firms to become more efficient</li><li>Spread of technology and ideas</li></ul></div>
    <div class="card"><h4>Costs</h4><ul><li>Job losses and lower wages in <b>import-competing</b> industries</li><li>Adjustment can be slow and painful for workers and regions</li><li>Possible rise in <b>income inequality</b></li><li>Dependence on foreign suppliers for strategic goods</li></ul></div>
  </div>
  ${W('o')}
  ${say('kip', 'Economists broadly agree the gains outweigh the losses for the country as a whole. The policy challenge is helping the people who lose: retraining, support and job search help.', 'think')}`,
  widgets: {
    o(el) {
      el.innerHTML = lab('Open the border: the shoe market', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('pw', 'World price ($)', 2, 10, .1, 4)}
        <div class="readout">${ro('Imports', 'im')}${ro('Consumer gain', 'cg')}${ro('Producer loss', 'pl')}${ro('Net national gain', 'ng')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> lower the world price. Consumers gain much more than domestic producers lose; the net gain is the green triangle.</p>`);
      const draw = () => {
        const pw = val(el, 'pw'); setO(el, 'pw', '$' + fmt(pw, 2));
        const D = p => (12 - p) / .8, S = p => (p - 2) / .6; // Q
        const pa = meet(12, -.8, 2, .6)[1], qa = meet(12, -.8, 2, .6)[0];
        const c = chart({ x: [0, 14], y: [0, 13], xl: 'Shoes (m pairs)', yl: 'Price ($)', xt: [0, 4, 8, 12], yt: [0, 4, 8, 12], grid: true, label: 'Free trade' });
        c.fn(q => 12 - .8 * q, 'l1', 0, 14).fn(q => 2 + .6 * q, 'l2', 0, 14).text(13.5, 12 - .8 * 13.5, 'D', 'a', 0, -8).text(13.8, Math.min(12.7, 2 + .6 * 13.8), 'S', 'c', -10, 4);
        if (pw < pa) {
          const qd = D(pw), qs = Math.max(0, S(pw));
          c.poly([[qs, pw], [qa, pa], [qd, pw]], 'fm');
          c.hline(pw, 'l4', 0, 14).text(14, pw, 'world price', 's', -4, -8, 'end');
          c.dot(qs, pw, 'c').dot(qd, pw, 'a');
          c.add(`<line x1="${c.sx(qs)}" x2="${c.sx(qd)}" y1="${c.sy(pw) + 12}" y2="${c.sy(pw) + 12}" stroke="var(--sun-fill)" stroke-width="5"/>`).text((qs + qd) / 2, pw, 'imports', 's', 0, 28, 'middle');
          const cg = (pa - pw) * (qa + qd) / 2, pl = (pa - pw) * (qa + qs) / 2;
          setT(el, 'im', fmt(qd - qs, 1) + 'm'); setT(el, 'cg', '+$' + fmt(cg, 1) + 'm'); setT(el, 'pl', '−$' + fmt(pl, 1) + 'm'); setT(el, 'ng', '+$' + fmt(cg - pl, 1) + 'm');
          $('#v', el).className = 'verdict good'; $('#v', el).innerHTML = `Domestic output falls from ${fmt(qa, 1)}m to ${fmt(qs, 1)}m pairs, so some shoe workers lose jobs. But consumers gain more than producers lose: <b>net gain $${fmt(cg - pl, 1)}m</b>.`;
          goal(el, 'Lower the world price until the net national gain from trade exceeds $5m.', cg - pl > 5);
        } else {
          c.hline(pw, 'l4', 0, 14).text(14, pw, 'world price', 's', -4, -8, 'end');
          ['im', 'cg', 'pl', 'ng'].forEach(k => setT(el, k, '–'));
          $('#v', el).className = 'verdict'; $('#v', el).innerHTML = 'The world price is above the domestic price, so this country would <b>export</b> shoes instead (producers gain, consumers pay more). Lower the world price to see imports.';
          goal(el, 'Lower the world price until the net national gain from trade exceeds $5m.', false);
        }
        c.dot(qa, pa, '', 4);
        $('#p', el).innerHTML = c.html();
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'When a country opens to imports at a world price below its domestic price…', o: ['Domestic producers and consumers both gain', 'Consumers gain, domestic producers lose, and the net effect is positive', 'Consumers lose, producers gain', 'Nobody is affected'], a: 1, why: 'Lower prices raise consumer surplus by more than the fall in producer surplus.' }],
  take: ['Trade brings specialisation, scale, variety, competition and lower prices.', 'Import-competing workers and firms lose, and inequality may rise.', 'The total gains exceed the losses, so winners could compensate losers.']
});

lesson({
  id: 'comparative-advantage', title: 'Comparative Advantage vs. Absolute Advantage', dur: '6:15', tags: 'opportunity cost ppf specialization terms of trade',
  hook: `Suppose one country is better at making <b>everything</b>. Should it still trade? Yes! What matters isn't who's best, it's who gives up the least. That's <b>comparative advantage</b>.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-acc">A</div><h4>Absolute advantage</h4><p>Producing a good with <b>fewer resources</b> (e.g. fewer labour hours) than another country.</p></div>
    <div class="card"><div class="ic c-min">C</div><h4>Comparative advantage</h4><p>Producing a good at a <b>lower opportunity cost</b>: giving up less of the other good. This decides who should specialise in what.</p></div>
  </div>
  <div class="formula"><span class="lbl">Opportunity cost of 1 unit of X</span>= Units of Y given up = (Hours per unit of X) ÷ (Hours per unit of Y)</div>
  ${W('ca')}
  <div class="pit"><p>A country can have an absolute advantage in both goods but can <b>never</b> have a comparative advantage in both. Opportunity costs are mirror images.</p></div>`,
  widgets: {
    ca(el) {
      el.innerHTML = lab('Two countries, two goods', `<p class="hint-line">Each country has 1,000 labour hours. Set the hours needed to make one unit of each good.</p>
        <div class="lab-grid"><div class="ctls">
          <b>Country A</b>${slider('aw', 'Hours per tonne of wheat', 1, 20, 1, 5)}${slider('ac', 'Hours per bolt of cloth', 1, 20, 1, 10)}
          <b>Country B</b>${slider('bw', 'Hours per tonne of wheat', 1, 20, 1, 10)}${slider('bc', 'Hours per bolt of cloth', 1, 20, 1, 12)}
        </div><div class="ctls"><div class="plot" id="p"></div></div></div><div id="t"></div><div class="verdict" id="v"></div>
        <p class="hint-line"><b>Try:</b> A starts better at both goods (absolute advantage in both), but look at opportunity costs. Change B's hours until the pattern flips.</p>`);
      const draw = () => {
        const aw = val(el, 'aw'), ac = val(el, 'ac'), bw = val(el, 'bw'), bc = val(el, 'bc');
        ['aw', 'ac', 'bw', 'bc'].forEach(k => setO(el, k, val(el, k) + ' h'));
        const H = 1000, Aw = H / aw, Ac = H / ac, Bw = H / bw, Bc = H / bc;
        const ocA = aw / ac, ocB = bw / bc; // cloth per wheat
        const mx = Math.max(Aw, Bw, Ac, Bc) * 1.08;
        const c = chart({ x: [0, mx], y: [0, mx], xl: 'Wheat (t)', yl: 'Cloth (bolts)', xt: nice(mx, 3), yt: nice(mx, 3), grid: true, h: 300, w: 420, label: 'Production possibility frontiers' });
        c.line([[0, Ac], [Aw, 0]], 'l1').line([[0, Bc], [Bw, 0]], 'l2');
        c.text(Aw, 0, 'A', 'a', -4, -8, 'end').text(Bw, 0, 'B', 'c', 4, -8);
        $('#p', el).innerHTML = c.html();
        const absW = aw < bw ? 'A' : aw > bw ? 'B' : 'neither', absC = ac < bc ? 'A' : ac > bc ? 'B' : 'neither';
        $('#t', el).innerHTML = `<div class="tblw"><table class="tbl"><tr><th></th><th class="n">Max wheat</th><th class="n">Max cloth</th><th class="n">Opp. cost of 1 wheat</th><th class="n">Opp. cost of 1 cloth</th></tr>
          <tr><td><b>Country A</b></td><td class="n">${fmt(Aw, 0)}</td><td class="n">${fmt(Ac, 0)}</td><td class="n">${fmt(ocA, 2)} cloth</td><td class="n">${fmt(1 / ocA, 2)} wheat</td></tr>
          <tr><td><b>Country B</b></td><td class="n">${fmt(Bw, 0)}</td><td class="n">${fmt(Bc, 0)}</td><td class="n">${fmt(ocB, 2)} cloth</td><td class="n">${fmt(1 / ocB, 2)} wheat</td></tr></table></div>`;
        goal(el, 'Change the hours so that Country B has the comparative advantage in wheat.', ocB < ocA - .001);
        const v = $('#v', el);
        if (Math.abs(ocA - ocB) < .001) { v.className = 'verdict warn'; v.innerHTML = `Opportunity costs are identical, so there is <b>no comparative advantage</b> and no gain from specialising.`; return; }
        const wheatC = ocA < ocB ? 'A' : 'B', clothC = wheatC === 'A' ? 'B' : 'A';
        const lo = Math.min(ocA, ocB), hi = Math.max(ocA, ocB);
        v.className = 'verdict good';
        v.innerHTML = `Absolute advantage: wheat → <b>${absW}</b>, cloth → <b>${absC}</b>.<br>Comparative advantage: <b>${wheatC}</b> should specialise in wheat (lower opportunity cost, ${fmt(lo, 2)} cloth), <b>${clothC}</b> in cloth. Both gain if they trade at any price between <b>${fmt(lo, 2)} and ${fmt(hi, 2)} cloth per tonne of wheat</b>.`;
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Country X needs 2 hours for a shirt and 4 hours for a radio; Country Y needs 6 hours for a shirt and 8 hours for a radio. Country Y has a comparative advantage in…', o: ['Shirts', 'Radios', 'Both', 'Neither'], a: 1, why: 'Opportunity cost of a radio: X = 4/2 = 2 shirts, Y = 8/6 = 1.33 shirts. Y gives up less, so Y has the comparative advantage in radios (X has absolute advantage in both).' }],
  take: ['Absolute advantage: fewer resources per unit. Comparative advantage: lower opportunity cost.', 'Countries gain by specialising according to comparative advantage and trading at prices between their opportunity costs.']
});

lesson({
  id: 'ricardian-ho', title: 'The Ricardian and Heckscher-Ohlin Models of Trade', dur: '3:58', tags: 'factor endowments labor capital technology differences income distribution',
  hook: `Where does comparative advantage come from? Two classic models give different answers: differences in <b>technology</b>, or differences in <b>factor endowments</b>.`,
  body: () => `
  <div class="tblw"><table class="tbl"><tr><th></th><th>Ricardian model</th><th>Heckscher-Ohlin model</th></tr>
  <tr><td>Factors of production</td><td>One: labour</td><td>Two: labour and capital</td></tr>
  <tr><td>Source of comparative advantage</td><td>Differences in <b>technology</b> (labour productivity)</td><td>Differences in <b>relative factor endowments</b></td></tr>
  <tr><td>Prediction</td><td>Countries export goods they produce relatively efficiently</td><td>Capital-abundant countries export capital-intensive goods; labour-abundant countries export labour-intensive goods</td></tr>
  <tr><td>Income distribution</td><td>Not addressed (one factor)</td><td>Trade <b>raises</b> returns to the abundant factor and <b>lowers</b> returns to the scarce factor</td></tr></table></div>
  ${W('ho')}`,
  widgets: {
    ho(el) {
      el.innerHTML = lab('Heckscher-Ohlin predictor', `<div class="lab-grid"><div class="ctls"><b>Home</b>${slider('hk', 'Capital (machines)', 10, 100, 5, 80)}${slider('hl', 'Labour (workers)', 10, 100, 5, 30)}
        <b>Foreign</b>${slider('fk', 'Capital', 10, 100, 5, 20)}${slider('fl', 'Labour', 10, 100, 5, 90)}</div>
        <div class="ctls"><div class="readout">${ro('Home K/L', 'h')}${ro('Foreign K/L', 'f')}</div><div id="o"></div></div></div>`);
      const draw = () => {
        const hk = val(el, 'hk'), hl = val(el, 'hl'), fk = val(el, 'fk'), fl = val(el, 'fl');
        ['hk', 'hl', 'fk', 'fl'].forEach(k => setO(el, k, val(el, k)));
        const h = hk / hl, f = fk / fl; setT(el, 'h', fmt(h, 2)); setT(el, 'f', fmt(f, 2));
        let m;
        if (Math.abs(h - f) < .05) m = say('kip', 'Both countries have the same capital-to-labour ratio, so H-O predicts <b>no basis for trade</b> from endowments.', 'think');
        else { const cap = h > f ? 'Home' : 'Foreign', lab_ = h > f ? 'Foreign' : 'Home';
          m = say('kip', `<b>${cap}</b> is capital-abundant, so it exports <b>capital-intensive</b> goods (machinery, chemicals). <b>${lab_}</b> is labour-abundant, so it exports <b>labour-intensive</b> goods (clothing, assembly).<br><br>Winners: capital owners in ${cap} and workers in ${lab_}. Losers: workers in ${cap} and capital owners in ${lab_}.`, 'joy'); }
        $('#o', el).innerHTML = m;
        goal(el, 'Change the endowments so that Foreign becomes the capital-abundant country.', f > h + .05);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'According to the Heckscher-Ohlin model, opening to trade in a labour-abundant country will most likely…', o: ['Lower wages', 'Raise wages relative to returns on capital', 'Raise returns to capital', 'Have no distributional effect'], a: 1, why: 'Trade raises demand for the abundant factor (labour), so its return rises.' }],
  take: ['Ricardian: one factor, technology differences drive comparative advantage.', 'Heckscher-Ohlin: two factors; countries export goods intensive in their abundant factor.', 'H-O predicts trade redistributes income toward the abundant factor.']
});

lesson({
  id: 'trade-restrictions', title: 'Trade Restrictions', dur: '7:14', tags: 'tariff quota voluntary export restraint export subsidy deadweight loss quota rent',
  hook: `Governments often protect domestic industries with tariffs and quotas. Let's put a tariff on imported shoes and count exactly who gains, who loses, and what simply disappears.`,
  body: () => `
  <div class="cards c5">
    <div class="card"><h4>Tariff</h4><p>A tax on imports. Raises the domestic price; the government collects revenue.</p></div>
    <div class="card"><h4>Import quota</h4><p>A limit on the quantity imported. The price rises; the gain (<b>quota rent</b>) goes to whoever holds import licences.</p></div>
    <div class="card"><h4>Voluntary export restraint (VER)</h4><p>The exporting country agrees to limit exports. The quota rent goes to <b>foreign</b> exporters, so the importing country loses even more.</p></div>
    <div class="card"><h4>Export subsidy</h4><p>A payment to exporters. Raises the domestic price, costs taxpayers, and invites retaliation.</p></div>
    <div class="card"><h4>Other barriers</h4><p>Minimum domestic content rules, administrative hurdles, and similar measures.</p></div>
  </div>
  ${W('tf')}
  <div class="tblw"><table class="tbl"><tr><th>Effect in the importing country</th><th>Tariff</th><th>Quota</th><th>VER</th></tr>
  <tr><td>Domestic price</td><td>↑</td><td>↑</td><td>↑</td></tr><tr><td>Domestic production</td><td>↑</td><td>↑</td><td>↑</td></tr>
  <tr><td>Imports</td><td>↓</td><td>↓</td><td>↓</td></tr><tr><td>Consumer surplus</td><td>↓</td><td>↓</td><td>↓</td></tr><tr><td>Producer surplus</td><td>↑</td><td>↑</td><td>↑</td></tr>
  <tr><td>Area C goes to</td><td>Government (revenue)</td><td>Licence holders</td><td>Foreign exporters</td></tr><tr><td>National welfare</td><td>↓ (deadweight loss)</td><td>↓</td><td>↓↓ (also loses C)</td></tr></table></div>
  <p>For a <b>large</b> country, a tariff can push down the world price (a terms-of-trade gain), which can partly offset the deadweight loss. For a small country, it can't.</p>
  <h2>Supply chains, friendshoring and industrial policy</h2>
  ${say('kip', 'After the pandemic port jams and new geopolitical tensions, many firms and governments decided the cheapest supplier isn\'t always the best one. If one link breaks, the whole chain stops. So trade is being rewired.', 'think')}
  <div class="cards">
    <div class="card"><h4>Nearshoring</h4><p>Moving production closer to home (for example US firms shifting from Asia to Mexico) to shorten supply chains and cut shipping risk.</p></div>
    <div class="card"><h4>Friendshoring</h4><p>Sourcing from politically allied countries, accepting higher costs in exchange for supply that is less likely to be cut off.</p></div>
    <div class="card"><h4>Strategic industrial subsidies</h4><p>Governments pay to build domestic capacity in chips, batteries and clean energy (for example the US CHIPS Act and the EU Chips Act). Like an export subsidy, they cost taxpayers and invite retaliation.</p></div>
    <div class="card"><h4>Geoeconomic fragmentation</h4><p>If the world splits into rival trading blocs, comparative advantage is used less. IMF staff estimated severe fragmentation could cost up to about 7% of world GDP in the long run.</p></div>
  </div>
  ${W('fs')}
  <div class="pit"><p>Comparative advantage says shifting away from the lowest-cost supplier always costs efficiency. The case for friendshoring is <b>insurance</b>: you pay a premium every year to limit the damage when a disruption hits. Too little insurance is risky; too much wastes resources.</p></div>
  `,
  widgets: {
    fs(el) {
      el.innerHTML = lab('Efficiency versus resilience', `${segHTML('who', ['Consumers pay the premium', 'Subsidy: taxpayers pay'])}
        <div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">
        ${slider('sh', 'Share sourced from domestic or allied suppliers', 0, 100, 5, 20)}${slider('pr', 'Cost premium of allied suppliers', 0, 60, 5, 25)}${slider('cut', 'Disruption: share of distant supply cut off', 0, 100, 10, 60)}
        <div class="readout">${ro('Consumer price change', 'cp')}${ro('Yearly extra cost', 'ec')}${ro('Supply lost in a disruption', 'sl')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> the market buys 100m units a year at a world price of $10. Raise the friendshored share: supply becomes safer, but every unit from allies costs more. Find the point where the two lines cross.</p>`, 'Scenario', 'Keep supply losses in a disruption below 30% while the yearly extra cost stays under $100m (10% of the market).');
      let who = 0;
      const draw = () => {
        const s = val(el, 'sh') / 100, p = val(el, 'pr') / 100, cut = val(el, 'cut') / 100;
        setO(el, 'sh', fmt0(s * 100) + '%'); setO(el, 'pr', '+' + fmt0(p * 100) + '%'); setO(el, 'cut', fmt0(cut * 100) + '%');
        const cost = 100 * p * s, lost = (1 - s) * cut * 100, ec = 1000 * p * s;
        const c = chart({ x: [0, 100], y: [0, 100], xl: 'Share from domestic or allied suppliers (%)', yl: 'Percent', xt: [0, 25, 50, 75, 100], yt: [0, 25, 50, 75, 100], grid: true, h: 300, label: 'Resilience versus cost trade-off' });
        c.rect(0, 0, 100, 10, 'fm').hline(30, 'guide');
        c.fn(x => p * x, 'l4', 0, 100).fn(x => (1 - x / 100) * cut * 100, 'l2', 0, 100);
        c.text(100, p * 100, 'extra cost (% of market)', 's', -4, -8, 'end').text(2, cut * 100, 'supply lost in a disruption', 'c', 4, -8);
        c.vline(s * 100, 'guide', 0, 100).dot(s * 100, cost, 's', 6).dot(s * 100, lost, 'c', 6);
        $('#p', el).innerHTML = c.html();
        setT(el, 'cp', who ? '0% (subsidised)' : '+' + fmt(cost, 1) + '%'); setT(el, 'ec', '$' + fmt0(ec) + 'm' + (who ? ' (taxpayers)' : '')); setT(el, 'sl', fmt0(lost) + '%');
        $('#v', el).className = 'verdict ' + (lost < 30 && cost < 10 ? 'good' : lost >= 50 ? 'bad' : 'warn');
        $('#v', el).innerHTML = (who ? `Taxpayers pay $${fmt0(ec)}m a year so shoppers see no price rise. The resource cost is the same; it is just hidden in the budget. ` : `Shoppers pay ${fmt(cost, 1)}% more. `)
          + (lost >= 50 ? `With ${fmt0(lost)}% of supply exposed, a disruption would leave shelves badly short.` : `A disruption would now cut supply by ${fmt0(lost)}%.`);
        goal(el, 'Keep supply losses in a disruption below 30% while the yearly extra cost stays under $100m (10% of the market).', lost < 30 && ec < 100);
      };
      segBind(el, 'who', i => { who = i; draw(); });
      el.addEventListener('input', draw); draw();
    },

    tf(el) {
      el.innerHTML = lab('Tariff on imported shoes (small country)', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('t', 'Tariff per pair ($)', 0, 2.3, .1, 1.2)}${segHTML('k', ['Tariff', 'Quota', 'VER'])}
        <div class="readout">${ro('A: producer gain', 'a')}${ro('C: revenue / rent', 'c')}${ro('B + D: deadweight loss', 'bd')}${ro('Consumer loss', 'cl')}</div><div class="verdict" id="v"></div></div></div>
        <p class="hint-line"><b>Try:</b> raise the tariff. Imports shrink, the deadweight triangles (red) grow. Switch to VER and see where area C goes.</p>`);
      let k = 0;
      const draw = () => {
        const t = val(el, 't'); setO(el, 't', '$' + fmt(t, 2));
        const pw = 4, pt = Math.min(pw + t, 6.28);
        const D = p => (12 - p) / .8, S = p => (p - 2) / .6;
        const q1 = S(pw), q2 = D(pw), q3 = S(pt), q4 = D(pt);
        const c = chart({ x: [0, 14], y: [0, 13], xl: 'Shoes (m pairs)', yl: 'Price ($)', xt: [0, 4, 8, 12], yt: [0, 4, 8, 12], grid: true, label: 'Tariff welfare effects' });
        c.fn(q => 12 - .8 * q, 'l1', 0, 14).fn(q => 2 + .6 * q, 'l2', 0, 14).text(13.5, 12 - .8 * 13.5, 'D', 'a', 0, -8).text(13.8, Math.min(12.7, 2 + .6 * 13.8), 'S', 'c', -10, 4);
        if (t > 0) {
          c.poly([[0, pw], [q1, pw], [q3, pt], [0, pt]], 'fp');
          c.poly([[q1, pw], [q3, pw], [q3, pt]], 'fc');
          c.poly([[q3, pw], [q4, pw], [q4, pt], [q3, pt]], k === 2 ? 'fa' : 'fs');
          c.poly([[q4, pw], [q2, pw], [q4, pt]], 'fc');
          c.text(q3 * .45, (pw + pt) / 2, 'A', 'p', 0, 5, 'middle').text((q1 + q3 * 2) / 3, pw + (pt - pw) * .33, 'B', 'c', 0, 5, 'middle').text((q3 + q4) / 2, (pw + pt) / 2, 'C', '', 0, 5, 'middle').text((q4 * 2 + q2) / 3, pw + (pt - pw) * .33, 'D', 'c', 0, 5, 'middle');
          c.hline(pt, 'l5 thin', 0, 14).text(14, pt, k === 0 ? 'world price + tariff' : 'domestic price', 'p', -4, -8, 'end');
        }
        c.hline(pw, 'l4', 0, 14).text(14, pw, 'world price', 's', -4, 16, 'end');
        $('#p', el).innerHTML = c.html();
        const A = (pt - pw) * (q1 + q3) / 2, B = (pt - pw) * (q3 - q1) / 2, C = (pt - pw) * (q4 - q3), Dd = (pt - pw) * (q2 - q4) / 2;
        setT(el, 'a', '$' + fmt(A, 2) + 'm'); setT(el, 'c', '$' + fmt(C, 2) + 'm'); setT(el, 'bd', '$' + fmt(B + Dd, 2) + 'm'); setT(el, 'cl', '$' + fmt(A + B + C + Dd, 2) + 'm');
        const who = ['the government as tariff revenue', 'domestic holders of import licences (quota rent)', '<b>foreign exporters</b>, so it is lost to the importing country'][k];
        $('#v', el).innerHTML = t === 0 ? 'Free trade: no tariff.' : `Imports fall from ${fmt(q2 - q1, 1)}m to ${fmt(q4 - q3, 1)}m pairs. Area C ($${fmt(C, 2)}m) goes to ${who}. B and D are pure <b>deadweight loss</b>: B from inefficient domestic production, D from consumption lost.`;
        goal(el, 'Find the prohibitive tariff that eliminates imports entirely.', q4 - q3 < .05);
      };
      segBind(el, 'k', i => { k = i; draw(); });
      el.addEventListener('input', draw); draw();
    }
  },

const BLOCS = [

  { n: 'Customs union', f: [1, 1, 0, 0, 0], ex: 'Mercosur', d: 'Adds a common trade policy toward non-members.' },

lesson({
  id: 'trading-blocs', title: 'Trading Blocs', dur: '3:30', tags: 'free trade area customs union common market economic union monetary union regional integration',
  hook: `Countries often team up with their neighbours to trade more freely. These <b>regional trading blocs</b> come in five levels, each a step deeper than the last.`,

lesson({
  id: 'capital-restrictions', title: 'Capital Restrictions', dur: '3:21', tags: 'capital controls price controls prohibitions repatriation hot money',
  hook: `Money can flood into a country, and rush out again, in hours. Some governments put brakes on these flows with <b>capital restrictions</b>.`,
  body: () => `
  <div class="cards">
    <div class="card"><h4>Forms</h4><ul><li><b>Price controls</b>: taxes on foreign investment returns or on transactions</li><li><b>Outright prohibitions</b> on foreign ownership in certain sectors</li><li>Limits on <b>repatriation</b> of earnings or capital by foreign investors</li></ul></div>
    <div class="card"><h4>Objectives</h4><ul><li>Reduce volatility from short-term "hot money" flows</li><li>Defend a fixed exchange rate</li><li>Keep domestic interest rates low</li><li>Protect strategic industries (defence, telecoms) from foreign control</li></ul></div>
    <div class="card"><h4>Costs</h4><ul><li>Less foreign investment and technology transfer</li><li>Higher cost of capital</li><li>Encourages evasion and corruption</li><li>Delays needed policy reforms</li></ul></div>
  </div>
  ${W('cf')}
  ${say('kip', 'Economists are generally more relaxed about controls on <b>short-term</b> inflows in a crisis than about long-term barriers to <b>direct investment</b>, which usually brings jobs and know-how.', 'think')}`,
  widgets: {
    cf(el) {
      el.innerHTML = lab('Hot money and a capital control', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('tx', 'Tax on short-term inflows', 0, 5, .5, 0)}<div class="verdict" id="v"></div></div></div>`);
      const draw = () => {
        const tx = val(el, 'tx'); setO(el, 'tx', pct(tx));
        const damp = 1 / (1 + tx * .5);
        const f = t => 10 * damp * (Math.sin(t * 1.3) + .6 * Math.sin(t * 3.1)) * (t > 6 && t < 8 ? -2.2 : 1);
        const c = chart({ x: [0, 12], y: [-35, 25], xl: 'Quarters', yl: 'Net capital inflow ($bn)', xt: [0, 4, 8, 12], yt: [-30, -15, 0, 15], grid: true, h: 260, label: 'Capital flows' });
        c.hline(0, 'gridl').fn(f, 'l1', 0, 12, 300).rect(6, -35, 8, 25, 'fc').text(7, 25, 'sudden stop', 'c', 0, 14, 'middle');
        $('#p', el).innerHTML = c.html();
        $('#v', el).innerHTML = tx ? `The tax damps short-term flows by about ${fmt0((1 - damp) * 100)}%, making the sudden stop less violent, at the cost of discouraging some foreign investment.` : 'Without controls, volatile short-term flows swing wildly, including a sudden outflow (shaded).';
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Which is a common objective of capital restrictions?', o: ['Increase exchange rate volatility', 'Help maintain a fixed exchange rate', 'Attract more short-term hot money', 'Raise domestic interest rates'], a: 1, why: 'Limiting capital flows helps defend a peg and reduces volatility. Controls usually aim to keep rates low, not raise them.' }],
  take: ['Capital restrictions include taxes, prohibitions and repatriation limits.', 'Aims: reduce volatility, defend a peg, keep rates low, protect strategic sectors.', 'Costs: less investment, higher cost of capital, evasion.']
});

lesson({
  id: 'balance-of-payments', title: 'The Balance of Payments', dur: '5:40', tags: 'current account capital account financial account remittances',
  hook: `Every transaction between a country and the rest of the world gets recorded in one giant ledger: the <b>balance of payments</b>. It has three accounts, and they always balance.`,
  body: () => `
  <div class="cards">
    <div class="card"><div class="ic c-acc">CA</div><h4>Current account</h4><ul><li>Merchandise trade (goods)</li><li>Services (tourism, transport, finance)</li><li>Income receipts (dividends, interest, wages from abroad)</li><li>Unilateral transfers (remittances, foreign aid)</li></ul></div>
    <div class="card"><div class="ic c-sun">KA</div><h4>Capital account</h4><ul><li>Capital transfers (debt forgiveness, migrants' transfers)</li><li>Sales and purchases of non-produced, non-financial assets (land for embassies, patents, mineral rights)</li></ul></div>
    <div class="card"><div class="ic c-plu">FA</div><h4>Financial account</h4><ul><li>Assets abroad owned by residents (foreign shares, bonds, factories)</li><li>Domestic assets owned by foreigners</li><li>Includes direct investment, portfolio investment and official reserves</li></ul></div>
  </div>
  <div class="formula"><span class="lbl">The identity</span>Current account + Capital account + Financial account = 0 &nbsp;&nbsp;(plus a statistical discrepancy in practice)</div>
  ${W('s')}`,
  widgets: {
    s(el) {
      sorter(el, {
        title: 'Which account records it?', prompt: 'Classify each transaction in the balance of payments.',
        bins: ['Current account', 'Capital account', 'Financial account'],
        items: [
          { t: 'A country exports $5bn of cars', b: 0, why: 'Merchandise trade.' },
          { t: 'Migrant workers send money home to their families', b: 0, why: 'Unilateral transfers (remittances).' },
          { t: 'A foreign firm builds a factory in the country', b: 2, why: 'Foreign direct investment, a financial asset.' },
          { t: 'Residents receive dividends on foreign shares', b: 0, why: 'Income receipts.' },
          { t: 'A creditor country forgives another country\'s debt', b: 1, why: 'A capital transfer.' },
          { t: 'A pension fund buys foreign government bonds', b: 2, why: 'Portfolio investment.' },
          { t: 'A foreign embassy buys land for its building', b: 1, why: 'Purchase of a non-produced, non-financial asset.' },
          { t: 'Tourists from abroad spend money in local hotels', b: 0, why: 'Export of services.' },
          { t: 'The central bank adds dollars to its reserves', b: 2, why: 'Official reserve assets.' }
        ]
      }, 'kip');
    }
  },
  check: [{ q: 'Foreign aid given by one government to another is recorded in the…', o: ['Financial account', 'Capital account', 'Current account (unilateral transfers)', 'It is not recorded'], a: 2, why: 'One-way transfers such as aid and remittances are unilateral transfers in the current account.' }],
  take: ['Current account: goods, services, income and unilateral transfers.', 'Capital account: capital transfers and non-produced, non-financial assets.', 'Financial account: cross-border ownership of financial assets.', 'The three accounts sum to zero.']

lesson({
  id: 'bop-continued', title: 'The Balance of Payments (continued)', dur: '3:26', tags: 'current account deficit savings investment government balance financing',
  hook: `A current account deficit means a country spends more than it earns from abroad. Someone has to finance it, and the national accounts tell us exactly who.`,
  body: () => `
  <div class="formula"><span class="lbl">Linking the BoP to the national accounts</span><b>CA = X − M = (S − I) + (T − G)</b></div>
  <p>A current account deficit happens when the country's private saving falls short of investment, or the government runs a deficit, or both. The deficit is financed by a <b>financial account surplus</b>: foreigners buying the country's assets or lending to it.</p>
  <div class="cards">
    <div class="card"><h4>Deficit driven by investment</h4><p>Borrowing abroad to build productive capital can raise future output and pay for itself.</p></div>
    <div class="card"><h4>Deficit driven by consumption</h4><p>Borrowing to consume adds to foreign debt without raising future income, a bigger concern.</p></div>
  </div>
  ${W('ca')}`,
  widgets: {
    ca(el) {
      el.innerHTML = lab('Where does the current account come from?', `<div class="lab-grid"><div class="plot" id="p"></div><div class="ctls">${slider('s', 'Private saving (% GDP)', 5, 35, 1, 18)}${slider('i', 'Investment (% GDP)', 5, 35, 1, 22)}${slider('b', 'Government balance T − G (% GDP)', -10, 5, .5, -3)}
        <div class="readout">${ro('Current account', 'c')}${ro('Financial account', 'f')}</div><div class="verdict" id="v"></div></div></div>`);
      const draw = () => {
        const s = val(el, 's'), i = val(el, 'i'), b = val(el, 'b'); setO(el, 's', s + '%'); setO(el, 'i', i + '%'); setO(el, 'b', pct(b));
        const ca = s - i + b, sc = 9, mid = 280;
        const bar = (y, v, cl, n) => `<text class="dg-t" x="10" y="${y + 19}">${n}</text><rect x="${v >= 0 ? mid : mid + v * sc}" y="${y}" width="${Math.abs(v) * sc}" height="28" class="${cl}" rx="3"/><text class="lab-t" x="${v >= 0 ? mid + v * sc + 6 : mid + v * sc - 6}" y="${y + 19}" text-anchor="${v >= 0 ? 'start' : 'end'}">${(v > 0 ? '+' : '') + fmt(v, 1)}%</text>`;
        $('#p', el).innerHTML = `<div style="background:var(--chart-bg);border:1px solid var(--line);border-radius:12px"><svg viewBox="0 0 560 220" role="img" aria-label="Current account identity"><line x1="${mid}" x2="${mid}" y1="5" y2="210" class="ax"/>
          ${bar(15, s - i, 'fm-s', 'Private S − I')}${bar(65, b, 'fs-s', 'Government T − G')}${bar(115, ca, ca >= 0 ? 'fa-s' : 'fc-s', 'Current account')}${bar(165, -ca, 'fp-s', 'Financial account')}</svg></div>`;
        setT(el, 'c', pct(ca)); setT(el, 'f', pct(-ca));
        $('#v', el).className = 'verdict ' + (ca < -4 ? 'bad' : ca < 0 ? 'warn' : 'good');
        $('#v', el).innerHTML = ca < 0 ? `A current account <b>deficit</b> of ${pct(-ca)} of GDP, financed by a financial account surplus: foreigners are acquiring the country's assets.` : `A current account <b>surplus</b> of ${pct(ca)}: the country is lending to, or investing in, the rest of the world.`;
        goal(el, 'Run a current account surplus even though the government runs a deficit of 3% of GDP or more.', ca > 0 && b <= -3);
      };
      el.addEventListener('input', draw); draw();
    }
  },
  check: [{ q: 'Private saving 20%, investment 24%, government balance −2% (all % of GDP). The current account is…', o: ['+2%', '−2%', '−6%', '+6%'], a: 2, why: 'CA = (S − I) + (T − G) = −4 + (−2) = −6% of GDP.' }],
  take: ['CA = (S − I) + (T − G).', 'A current account deficit is financed by a financial account surplus.', 'Deficits that fund investment are less worrying than deficits that fund consumption.']
});

        </div>
